# Field-2026-11 ticket 05, cell retry. Main removes link-7 (n-4-2 -> r2) and link-8 (r2 -> n-4-5): each enters the
# foreign cell pod-1#1 of its own frame. Both are retried, and libavoid skips a required stem checkpoint in each
# retry (the cause is not examined; the checkpoint stands outside every cell box), so both stay removed, now with
# ROUTE_CHECKPOINT_SKIPPED. Each stores the retry's answer, and restore judges it again and agrees. link-4 enters a
# bundle envelope and is not retried.
portograph: 2
groups:
  pod-1: { tier: 1, label: pod-1 }
  pod-2: { tier: 1, label: pod-2 }
  pod-3: { tier: 0, shape: row, label: pod-3 }
  pod-4: { tier: 1, label: pod-4 }
nodes:
  r1: { group: pod-1, class: router }
  r2: { group: pod-1, class: switch }
  n-2-1: { group: pod-2, class: router }
  n-3-1: { group: pod-3, class: switch }
  n-4-1: { group: pod-4, class: switch }
  n-4-2: { group: pod-4, class: switch }
  n-4-3: { group: pod-4, class: switch }
  n-4-4: { group: pod-4, class: router }
  n-4-5: { group: pod-4, class: switch }
links:
  - [r2, n-3-1]
  - [n-2-1, n-3-1]
  - [r1, r2]
  - [r1, n-2-1]
  - [r2, n-4-5]
  - [r2, n-2-1]
  - [r1, n-4-3]
  - [n-4-2, r2]
  - [n-2-1, r1]
  - [n-4-5, n-2-1]
  - [n-4-2, n-4-4]
  - [n-2-1, n-4-3]
