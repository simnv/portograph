# Expected: the twin of a two-core transport sheet, under generic names (dense-16x9 ticket 01, ADR-0026).
# Each core has twelve members and three ranks. `up-x1` and `up-x2` link to the tier above; `up-x3` and `up-x4` link only to `mid` members,
# two links from each pole, a tie that takes the upper of the two results (rank 0). The four `up` members stand on rank 0. The two `hub`
# members link only to the tier below, so they are the downward anchors and take the last rank, rank 2. The four `mid` members and the two
# `leaf` members, which link only to the hubs, are one link from each pole (or from the hubs) and stand on rank 1. No member stands between
# a hub and the tier below, so the 28 links from the hubs to the seven groups of two nodes on tier 2 take a routed chord: no lane for them.
# Before ADR-0026 the depth counted from `up-x1` and `up-x2` alone, and `mid-x3`, `mid-x4`, `leaf-x1` and `leaf-x2` took a rank below the hubs, and `up-x3` and `up-x4` stood beside them (four ranks).
# Seven groups of two nodes stand on tier 2 and one stub group under each pair on tier 3. Every link asks for `route: straight`.
# As on the sheet it stands for, some feeds link to both upper anchors (dense-16x9 ticket 03, slice C): `feed-a5` in Feeds A, and `feed-b5`
# and `feed-b7` in Feeds B, inside the run of `up-b1`. Each leaf row then holds members with several links: both stand in two lines with compact hubs.
# STAGED outside goldens/synthetic/ (the corpus gate would fail it): the sheet still fails G5 (port order, dense-16x9 ticket 05) and G6
# (parallel clearance of the same-tier links between the hubs, ticket 06). It moves to goldens/synthetic/ when tickets 04, 05 and 06 make it clean.
# Test-only input owned by dense-16x9 ticket 01; test/pipeline/two-pole-ranks.test.ts reads the ranks. Other dense-16x9 tickets measure on it.
