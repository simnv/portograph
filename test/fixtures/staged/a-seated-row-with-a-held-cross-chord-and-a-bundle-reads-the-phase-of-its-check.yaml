  c2: { group: site, ports: [{ name: u1, side: top }, { name: b, side: bottom }] }
  k1: { group: site, ports: [{ name: t1, side: top }, { name: t3, side: top }, { name: b1, side: bottom }, { name: b2, side: bottom }, { name: b3, side: bottom }] }
  z1: { group: down, ports: [{ name: in, side: top }] }
  n4: { group: down }
  n5: { group: down }
  n6: { group: down }
  n7: { group: down }
  n8: { group: down }
  n9: { group: down }
