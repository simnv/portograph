# Source: https://github.com/aristanetworks/avd/tree/62679891063862e3c55bb9ca8cf125be6dee2490/ansible_collections/arista/avd/examples/dual-dc-l3ls
# (inventory.yml and group_vars/DC1*.yml, DC2*.yml)
