# Expected (dense-16x9 ticket 32, review 1; owner ruling on stacked pairs): three rank rows of the Core frame, a0..a5 over m1..m3 over b1, b2.
# The a row is fed in order; m1, m2 and m3 have one feed key each, so the first pair (a row over m row) is free in the m row. Standing as
# declared, [m3, m1, m2], it is already a minimum of that pair: 4 crossings. The pair below (m row over b row) may not move the m row: a row
# a pair has judged is settled, and only the b row moves. On 10fa07cc the pair below turned the m row to [m1, m3, m2] (5 crossings for the
# first pair), and a refresh turned it back; both passed the validator. Now the published model and a refresh agree on [m3, m1, m2].
portograph: 2
groups:
  root: {tier: 0}
  feeds: {tier: 1}
  core: {tier: 2}
  sinks: {tier: 3}
nodes:
  source: {group: root}
  p0: {group: feeds}
  p1: {group: feeds}
  p2: {group: feeds}
  p3: {group: feeds}
  p4: {group: feeds}
  p5: {group: feeds}
  a0: {group: core}
  a1: {group: core}
  a2: {group: core}
  a3: {group: core}
  a4: {group: core}
  a5: {group: core}
  m3: {group: core}
  m1: {group: core}
  m2: {group: core}
  b1: {group: core}
  b2: {group: core}
  sink: {group: sinks}
links:
  - [source, p0]
  - [source, p1]
  - [source, p2]
  - [source, p3]
  - [source, p4]
  - [source, p5]
  - [p0, a0]
  - [p1, a1]
  - [p2, a2]
  - [p3, a3]
  - [p4, a4]
  - [p5, a5]
  - [a0, m1]
  - [a1, m1]
  - [a5, m1]
  - [a2, m2]
  - [a0, m3]
  - [a4, m3]
  - [m1, b1]
  - [m3, b1]
  - [m3, b2]
  - [m2, b2]
  - [b1, sink]
  - [b2, sink]
