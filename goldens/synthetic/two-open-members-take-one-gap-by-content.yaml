# Expected (dense-16x9 ticket 36, slice 3, review 1): with `layout.moveBeforeGrow: true` the row `site#1` has two open members, `r1` and `r2`,
# each 100 px wide and each linked to the same two hubs below; the gap between the two seated members `c1` and `c2` holds one of them. The two
# choices keep the same seats and the same row width, so the choice ends on content: the row order by node id (`c1`, `r1`, `c2`, `r2`), not on
# the declaration order of the two members. Swapping the declaration lines of `r1` and `r2` gives the same order.
# Test: test/layout/free-slots.test.ts (R3 of the slot choice).
portograph: 2
layout: { moveBeforeGrow: true }
groups:
  up: { tier: 0 }
  site: { tier: 1, label: "One site in ranks" }
  down: { tier: 2 }
nodes:
  t0: { group: up, ports: [{ name: a, side: bottom }, { name: b, side: bottom }] }
  p1: { group: site, size: { width: 220, height: 40 }, ports: [{ name: up, side: top }, { name: d1, side: bottom }] }
  p2: { group: site, size: { width: 220, height: 40 }, ports: [{ name: up, side: top }, { name: d1, side: bottom }] }
  c1: { group: site, ports: [{ name: u1, side: top }, { name: e1, side: bottom }, { name: e2, side: bottom }] }
  c2: { group: site, ports: [{ name: u1, side: top }, { name: e1, side: bottom }, { name: e2, side: bottom }] }
  r1: { group: site, size: {width: 100, height: 40}, ports: [{ name: e1, side: bottom }, { name: e2, side: bottom }] }
  r2: { group: site, size: {width: 100, height: 40}, ports: [{ name: e1, side: bottom }, { name: e2, side: bottom }] }
  h1: { group: site, ports: [{ name: a, side: top }, { name: b, side: top }, { name: c, side: top }, { name: z, side: top }, { name: d, side: bottom }] }
  h2: { group: site, ports: [{ name: a, side: top }, { name: b, side: top }, { name: c, side: top }, { name: z, side: top }, { name: d, side: bottom }] }
  d0: { group: down, ports: [{ name: u, side: top }, { name: v, side: top }] }
links:
  - { from: t0.a, to: p1.up }
  - { from: t0.b, to: p2.up }
  - { from: p1.d1, to: c1.u1 }
  - { from: p2.d1, to: c2.u1 }
  - { from: c1.e1, to: h1.a }
  - { from: c1.e2, to: h2.a }
  - { from: c2.e1, to: h1.c }
  - { from: c2.e2, to: h2.c }
  - { from: r1.e1, to: h1.b }
  - { from: r1.e2, to: h2.b }
  - { from: h1.d, to: d0.u }
  - { from: h2.d, to: d0.v }
  - { from: r2.e1, to: h1.z }
  - { from: r2.e2, to: h2.z }
