# Expected: a seat that a later rule withdraws names the alignment it opens (dense-16x9 ticket 02, ADR-0027; ticket 75). n1 has three top
# ports for rA, one for rB and one for f2. Its seat stands port b under rB, and while the seat stands n1 pulls only through b, so the
# feed from f2 is not open. The centring spends its budget with link-1 (rB to n1.b) named open. In the bundles rule (7e) the seat, whose port b stands off its feed,
# is withdrawn. Without the seat the replay reads every feed of n1, and link-2 (f2 to n1) is open too. The open alignments are
# named again after the withdrawal, so the record and its replay read one seat record. Before, the stage refused the layout with
# 'Centring invariant violated' (link-2 not named), where main draws it. `layout.feedOrder: false` keeps the row order as written.
# Test `test/layout/withdrawn-seat-open.test.ts` reads the layout.
portograph: 2
profile: network
layout: { feedOrder: false, farEndPull: false }
groups:
  top: {tier: 0, label: Top}
  low: {tier: 1, label: Low}
nodes:
  rB: {group: top, class: router, label: RB, ports: [{name: q, side: bottom}]}
  f2: {group: top, label: F2}
  f1: {group: top, label: F1}
  rA: {group: top, class: router, label: RA, ports: [{name: p1, side: bottom}, {name: p2, side: bottom}, {name: p3, side: bottom}]}
  n1: {group: low, label: N1, ports: [{name: a1, side: top}, {name: a2, side: top}, {name: a3, side: top}, {name: b, side: top}]}
  s1: {group: low, label: S1}
links:
- [rA.p1, n1.a1]
- [rA.p2, n1.a2]
- [rA.p3, n1.a3]
- [rB.q, n1.b]
- [f1, s1]
- [f2, n1]
