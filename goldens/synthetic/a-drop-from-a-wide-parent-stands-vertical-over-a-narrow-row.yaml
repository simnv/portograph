# Expected: A drop from a wide parent stands vertical over a narrow row (architecture-2 ticket 31). The sheet above with a
# narrower first child: the aligned switch is wider than the canton wall, so centring declined the alignment as a whole and every
# drop slanted (45 to 143 px) with no diagnostic. The reserved aligned extent holds the switch: every drop stands at one x.
# Test-only input owned by architecture-2 ticket 31; test/pipeline/canton-walls.test.ts reads the layout.
portograph: 2
profile: network
title: "A drop from a wide parent stands vertical over a narrow row"

groups:
  site: { label: "Site" }
  core: { tier: 0, canton: site, label: "Core" }
  edge: { tier: 1, canton: site, label: "Edge" }

nodes:
  sw:
    group: core
    label: sw
    ports:
      - { name: p1, class: downlink }
      - { name: p2, class: downlink }
      - { name: p3, class: downlink }
      - { name: p4, class: downlink }
      - { name: p5, class: downlink }
      - { name: p6, class: downlink }
      - { name: p7, class: downlink }
      - { name: p8, class: downlink }
      - { name: spare, class: "downlink admin-down" }
  a: { group: edge, label: a, ports: [{ name: eth }] }
  b: { group: edge, label: b, ports: [{ name: eth }] }
  c: { group: edge, label: c, ports: [{ name: eth }] }
  srv: { group: edge, label: srv, ports: [{ name: n0 }, { name: n1 }] }
  d: { group: edge, label: d, ports: [{ name: eth }] }
  e: { group: edge, label: e, ports: [{ name: eth }] }
  f: { group: edge, label: f, ports: [{ name: eth }] }

links:
  - [sw.p1, a.eth]
  - [sw.p2, b.eth]
  - [sw.p3, c.eth]
  - [sw.p4, srv.n0]
  - [sw.p5, srv.n1]
  - [sw.p6, d.eth]
  - [sw.p7, e.eth]
  - [sw.p8, f.eth]
