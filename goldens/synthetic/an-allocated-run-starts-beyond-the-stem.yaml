# Expected: A site group holds a router, a switch and a child group (ranked cells, ticket 19) of
# three servers. The child feeds nothing deeper, so the leaf-child rule (ticket 19) puts it after
# the switch, and the ranks are the router 0, the switch 1, b and c 2, a 3. Links skip one
# rank (the switch's), so each crosses a rank band between its ends and owns a lane there.
# A lane reaches 12 px past its own band. The allocated run of the other link leaves its
# lane and arrives at a port that stands on the edge of a rank cell. An interior cell edge holds no
# padding, so that port row sits 12 px from the far lane's reach, and the 15 px stem of the port
# ends inside the tier gap. A run that stops at the gap's boundary ends between the port and the
# stem tip. The router then meets a required checkpoint beyond the end of its piece and skips it
# ("Router skipped a required checkpoint"). An allocated run ends at the stem tip when the tip
# lies inside the gap, so the checkpoint lies on the path of every link (ranked-groups ticket 14,
# rule A).
# The condition rests on rank cells with no padding on their interior edges and on lanes that
# share a gap with a port; it does not rest on a rank order the derivation may change.
# Reduced from a private sheet; names are generic.
# Test-only input owned by ranked-groups ticket 14; test/pipeline/allocated-run-beyond-stem.test.ts reads the layout.
portograph: 2
profile: network
groups:
  wan: { tier: 0 }
  site: { tier: 1 }
  zone: { parent: site }
nodes:
  provider: { group: wan, class: provider }
  router: { group: site, class: router }
  mid: { group: site, class: switch }
  a: { group: zone, class: load-balancer }
  b: { group: zone, class: ntp-stratum2 }
  c: { group: zone, class: ntp-stratum2 }
links:
  - [router, provider, { class: dashed }]
  - [router, mid, { class: physical }]
  - [a, b, { class: physical }]
  - [router, c, { class: physical }]
  - [router, b, { class: physical }]
  - [c, a, { class: physical }]
  - [mid, a, { class: physical }]
