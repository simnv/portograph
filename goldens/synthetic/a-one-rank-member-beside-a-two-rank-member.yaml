# Expected: A one-rank member below a two-rank member inside one canton (ranked-groups ticket 64, the subset shape).
# The canton `west` holds `site` (tier 1: a gateway and two servers hung from it, two ranks: `site#0`, `site#1`) and `lab`
# (tier 2, one node, `lab#0`, fed from the gateway of `site`). `lab` is alone on its sub-tier, so the inner pass pulls it
# toward its feed inside the canton. A second `holdMemberWalls` on the finished layout moves nothing.
# Test-only input owned by ranked-groups ticket 64; test/pipeline/canton-walls.test.ts reads the layout.
portograph: 2
groups:
  west: { label: West }
  top: { tier: 0, label: Top }
  site: { tier: 1, canton: west, label: Site }
  lab: { tier: 2, canton: west, label: Lab }
nodes:
  feed: { group: top, class: router, label: Feed }
  gw: { group: site, class: router, label: Gateway }
  srv: { group: site, class: server, label: Server }
  srv2: { group: site, class: server, label: Server two }
  l1: { group: lab, class: server, label: Lab one }
links:
  - [feed, gw]
  - [gw, srv]
  - [gw, srv2]
  - [gw, l1]
