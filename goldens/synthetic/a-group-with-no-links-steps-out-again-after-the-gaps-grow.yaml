# Expected: a labelled routed link grows the tier gaps (stage 7f) after the group has stepped out of the chords, which changes the slope of a chord
# that spans two gaps (ticket 76 review). The step runs again after the growth: every overlay link stays one straight segment clear of `key`.
# Test-only input owned by ranked-groups ticket 76.
portograph: 2
groups:
  sources: { tier: 0, label: Sources }
  key: { tier: 1, label: Key }
  targets: { tier: 2, label: Targets }
  relay: { tier: 1, label: Relay }
  hosts: { tier: 3, label: Hosts }
nodes:
  src-a: { group: sources, class: server, label: Source A }
  src-x: { group: sources, class: server, label: Source X }
  src-b: { group: sources, class: server, label: Source B }
  k1: { group: key, class: server, label: Key 1 }
  k2: { group: key, class: server, label: Key 2 }
  k3: { group: key, class: server, label: Key 3 }
  dst-a: { group: targets, class: server, label: Target A }
  dst-b: { group: targets, class: server, label: Target B }
  dst-c: { group: targets, class: server, label: Target C }
  rl: { group: relay, class: server, label: Relay 1 }
  h1: { group: hosts, class: server, label: Host 1 }
  h2: { group: hosts, class: server, label: Host 2 }
  h3: { group: hosts, class: server, label: Host 3 }
  h4: { group: hosts, class: server, label: Host 4 }
  h5: { group: hosts, class: server, label: Host 5 }
links:
  - [src-x, rl, { label: A rather long description of the link from the source }]
  - [dst-a, h1]
  - [dst-b, h2]
  - [dst-c, h3]
  - [dst-c, h4]
  - [src-a, dst-a, { class: sync }]
  - [src-a, dst-c, { class: sync }]
