# Expected: A tier above packs over the final x of its feeds (ranked-groups ticket 33). The lowest tier is
# the anchor tier: three locations, each a frame with a gateway on its first rank and a zone below it,
# `west` much wider than the other two. Between them stands a tier of one-rank groups: `core`, fed by the
# gateways of `west` and `east`, and `side`, fed by nothing above. Two two-rank locations stand above `core`,
# each linked to one router of `core` and each holding an overlay link that pins its column axis. The
# centring stage moves `core` over its feeds, far from the x it had when the columns were packed, so the
# two locations above must stand over that final x and not over the packed one.
# Test-only input owned by ranked-groups ticket 33; test/pipeline/tier-above-final-x.test.ts reads the layout.
