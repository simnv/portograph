# Expected: A link into a leaf child of its own frame needs no lane (ranked-groups tickets 04 and 28, the NTP
# `loc4wan001` case). Two routers link to the ISP above (rank 0). The switch hangs from the first router
# (rank 1). The WAN node stands alone in a child group `edge` and links to the second router. `edge` feeds
# nothing deeper, so it keeps its depth rank (1) and stands beside the switch, the parent member of that rank
# (ticket 28); it used to take the rank after the last rank of the rest (ticket 19), and the link from the
# second router then crossed the sub-tier of the switch's cell `site#1` in a lane inside the frame. Now the
# link is a stem, one vertical run, stem; no lane, no removed link, no margin expansion.
# Test-only input owned by ranked-groups ticket 04; test/pipeline/frame-transit.test.ts reads the layout.
portograph: 2
groups:
  upstream: { tier: 0, label: Upstream }
  site: { tier: 1, label: Site }
  edge: { parent: site, label: Edge }
nodes:
  isp: { group: upstream, class: provider, label: ISP }
  rt1: { group: site, class: router, label: Router 1 }
  rt2: { group: site, class: router, label: Router 2 }
  sw: { group: site, class: switch, label: Switch }
  wan: { group: edge, class: server, label: WAN }
links:
  - [isp, rt1]
  - [isp, rt2]
  - [rt1, sw]
  - [rt2, wan]
