# Expected: the draw.io export binds every node, port and link cell (docs/drawio-binding-contract.md).
# The root carries pg-schema="1" and the root meta; each link id comes from its ends or its `id:`,
# so a reorder of the links keeps every link cell id; two parallel links between anonymous ports
# take `edge--server` and `edge--server@2`; meta changes no geometry.
portograph: 2
profile: network
meta: { datasource: prometheus, site: lab }
groups:
  top: { tier: 0 }
  bottom: { tier: 1 }
nodes:
  router:
    group: top
    class: router
    meta: { host: router, job: node-router, instance: "router:9100" }
    ports:
      - { name: eth0, class: uplink, meta: { device: eth0 } }
      - { name: eth1, class: downlink, meta: { device: eth1.10 } }
  edge:
    group: top
    ports: [lan]
  switch:
    group: bottom
    class: switch
    meta: { host: switch, kind: switch }
    ports: [p1, p2, p3]
  server:
    group: bottom
    meta: { host: server, job: node-server }
    ports: [{ name: nic0, meta: { device: enp1s0 } }]
links:
  - { id: uplink, from: router.eth1, to: switch.p1, label: "10G", meta: { capacity: 1e10 } }
  - [switch.p2, server.nic0, { label: "1G", meta: { capacity: 1e9, kind: access } }]
  - [edge.lan, switch.p3]
  - [edge, server]
  - [edge, server]
