# Expected: Facing units link direct (architecture-2 ticket 22, slice 1). `hub` and `peer` stand on tier 0 and feed the six nodes of
# tier 1 interleaved (hub: e0, e2, e4, e5; peer: e1, e3), so the orthogonal staircases of the two fans cross each other. The pair
# splits into one direct family per source node, and both are triggered (3 counted crossings each). At the band gap hub's chord to
# e0 is flatter than 30 degrees, so 7f reserves about 26 px more tier-gap height (a floor of the tier-gap plan) before the
# freeze; all four members of hub's fan are one straight segment each, in peer order, crossing nothing of their own fan;
# peer's two members stay orthogonal (`body`) and cross hub's fan. Measured against main: bends 20 → 16, crossings 21 → 21, Q 0.4438 → 0.4586; G5 (port order at f0)
# fails before and after. Test-only input owned by architecture-2 ticket 22; test/pipeline/direct-families.test.ts reads the layout.
portograph: 2
groups:
  core: { tier: 0, label: Core }
  edge: { tier: 1, label: Edge }
  near: { tier: 2, label: Near }
  far: { tier: 2, label: Far }
nodes:
  hub: { group: core, class: router }
  peer: { group: core, class: router }
  e0: { group: edge, class: switch }
  e1: { group: edge, class: switch }
  e2: { group: edge, class: switch }
  e3: { group: edge, class: switch }
  e4: { group: edge, class: switch }
  e5: { group: edge, class: switch }
  n0: { group: near, class: server }
  f0: { group: far, class: server }
links:
  - [hub, e0]
  - [peer, e1]
  - [hub, e2]
  - [peer, e3]
  - [hub, e4]
  - [hub, e5]
  - [e0, n0]
  - [e1, f0]
  - [e2, n0]
  - [e3, f0]
  - [e4, n0]
  - [e5, f0]
  - [hub, f0]
