# Expected: the shape of the private NTP sheet's grown gap (ranked-groups ticket 42). Three locations of tier 1 (`site`, `other`,
# `third`), each a group of routers over switches, share one tier gap (tier 1 to tier 2). Each has interleaved pairs (the
# source ports of a pair run left to right, the target ports right to left), so each earlier link owes a row.
# On main the room follows the probe: the gap is opened far past need, every lower tip and every mid row move down with the
# opening, and the lowest mid seated sets the height. The gap grows 63.00 px. The rows the pairs are owed, each the lowest legal
# row from a run clearance below its upper tip, need 33.50 px. Nothing is removed and every gate passes either way.
# Test-only input owned by ranked-groups ticket 42; test/pipeline/held-row-room.test.ts reads the layout.
portograph: 2
groups:
  upstream: { tier: 0 }
  site: { tier: 1 }
  other: { tier: 1 }
  third: { tier: 1 }
nodes:
  isp: { group: upstream, class: provider }
  r0: { group: site, class: router }
  r1: { group: site, class: router }
  r2: { group: site, class: router }
  s0: { group: site, class: switch }
  s1: { group: site, class: switch }
  s2: { group: site, class: switch }
  s3: { group: site, class: switch }
  q0: { group: other, class: router }
  q1: { group: other, class: router }
  t0: { group: other, class: switch }
  t1: { group: other, class: switch }
  t2: { group: other, class: switch }
  u0: { group: third, class: router }
  u1: { group: third, class: router }
  w0: { group: third, class: switch }
  w1: { group: third, class: switch }
  w2: { group: third, class: switch }
links:
  - [isp, u0]
  - [isp, u1]
  - [u0, w1, { class: physical, route: orthogonal }]
  - [u0, w2, { class: physical, route: orthogonal }]
  - [u1, w0, { class: physical, route: orthogonal }]
  - [u1, w1, { class: physical, route: orthogonal }]
  - [isp, r0]
  - [isp, r1]
  - [isp, r2]
  - [isp, q0]
  - [isp, q1]
  - [r0, s2, { class: physical, route: orthogonal }]
  - [r0, s3, { class: physical, route: orthogonal }]
  - [r1, s0, { class: physical, route: orthogonal }]
  - [r1, s1, { class: physical, route: orthogonal }]
  - [r2, s2, { class: physical, route: orthogonal }]
  - [r2, s3, { class: physical, route: orthogonal }]
  - [q0, t1, { class: physical, route: orthogonal }]
  - [q0, t2, { class: physical, route: orthogonal }]
  - [q1, t0, { class: physical, route: orthogonal }]
  - [q1, t1, { class: physical, route: orthogonal }]
