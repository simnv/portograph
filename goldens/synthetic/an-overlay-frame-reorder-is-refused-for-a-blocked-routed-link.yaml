# Expected: ranked-groups ticket 06b, frames take part in the overlay-weighted order. The same three
# locations as `overlay-links-reorder-two-locations`, but B has routed links from `b-edge` to the second
# rank of A and to the second rank of C, so ELK stands B between them. The key of B is the smallest (the
# overlay link to `ntp1`), and moving B to the left end would straighten the two sync links, but it would
# put A between B and C: the routed link `b-edge` to `c-sync1` would then have a body between its ends,
# and it would leave the routed link `b-edge` to `a-sync1` as it is. The move is refused with one warning
