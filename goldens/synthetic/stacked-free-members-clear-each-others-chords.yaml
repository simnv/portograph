# Expected: Two free one-cell members of a canton stand one under the other, and the lower one stands where its overlay chords are
# straight (ranked-groups ticket 143, decisions-log Q112). The canton `west` holds two ranked members, `left` and `right` (a router
# row and a zone rank of two servers each, fed from the core row on tier 0), and below them the free members `upper-clients`
# (tier 3) and `lower-clients` (tier 4). Neither client member has a routed link. Every server of the two zone ranks syncs with
# every client server by an overlay link. The mean of the partners is the canton axis for both client members, so on the mean the
# chords to `lower-clients` cross the row of `upper-clients` and take the orthogonal branch. The rule moves `lower-clients` to the
# nearest x where those chords are straight.
# Test-only input owned by ranked-groups ticket 143; test/pipeline/overlay-window.test.ts reads the layout.
portograph: 2
groups:
  core: { tier: 0, label: Core }
  west: { label: West }
  left: { tier: 1, canton: west, label: Left site }
  left-zone: { parent: left, label: Left zone }
  right: { tier: 1, canton: west, label: Right site }
  right-zone: { parent: right, label: Right zone }
  upper-clients: { tier: 3, canton: west, label: Upper clients }
  lower-clients: { tier: 4, canton: west, label: Lower clients }
nodes:
  core-1: { group: core, class: router, label: Core 1 }
  core-2: { group: core, class: router, label: Core 2 }
  left-gw: { group: left, class: router, label: Left gateway }
  left-a: { group: left-zone, class: server, label: Left A }
  left-b: { group: left-zone, class: server, label: Left B }
  right-gw: { group: right, class: router, label: Right gateway }
  right-a: { group: right-zone, class: server, label: Right A }
  right-b: { group: right-zone, class: server, label: Right B }
  up-1: { group: upper-clients, class: server, label: Upper 1 }
  up-2: { group: upper-clients, class: server, label: Upper 2 }
  low-1: { group: lower-clients, class: server, label: Lower 1 }
  low-2: { group: lower-clients, class: server, label: Lower 2 }
links:
  - [core-1, left-gw]
  - [core-2, right-gw]
  - [left-gw, left-a]
  - [left-gw, left-b]
  - [right-gw, right-a]
  - [right-gw, right-b]
  - [left-a, up-1, { class: sync }]
  - [left-a, up-2, { class: sync }]
  - [left-b, up-1, { class: sync }]
  - [left-b, up-2, { class: sync }]
  - [right-a, up-1, { class: sync }]
  - [right-a, up-2, { class: sync }]
  - [right-b, up-1, { class: sync }]
  - [right-b, up-2, { class: sync }]
  - [left-a, low-1, { class: sync }]
  - [left-a, low-2, { class: sync }]
  - [left-b, low-1, { class: sync }]
  - [left-b, low-2, { class: sync }]
  - [right-a, low-1, { class: sync }]
  - [right-a, low-2, { class: sync }]
  - [right-b, low-1, { class: sync }]
  - [right-b, low-2, { class: sync }]
