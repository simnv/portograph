# Expected: A group with no links stands one band gap from the nearest connected frame, not from a group inside it (ticket 92).
# `key` (tier 0) has no link and no other group stands in its tier. The connected diagram is two cantons, whose frames are wider
# than the groups they hold. A test shifts `key` far to either side after ELK; it must stand `besideGap` (a band gap and the column slack, ticket 75) from the frame column.
# Test-only input owned by ranked-groups ticket 92; test/pipeline/linkless-group-beside.test.ts reads the layout.
portograph: 2
groups:
  west: { label: West }
  east: { label: East }
  key: { tier: 0, label: Key }
  west-edge: { tier: 1, canton: west, label: West edge }
  west-servers: { tier: 2, canton: west, label: West servers }
  east-edge: { tier: 1, canton: east, label: East edge }
  east-servers: { tier: 2, canton: east, label: East servers }
nodes:
  k1: { group: key, class: server, label: Key 1 }
  k2: { group: key, class: server, label: Key 2 }
  rw: { group: west-edge, class: router, label: RW }
  sw1: { group: west-servers, class: server, label: SW1 }
  sw2: { group: west-servers, class: server, label: SW2 }
  re: { group: east-edge, class: router, label: RE }
  se1: { group: east-servers, class: server, label: SE1 }
  se2: { group: east-servers, class: server, label: SE2 }
links:
  - [rw, sw1]
  - [rw, sw2]
  - [re, se1]
  - [re, se2]
