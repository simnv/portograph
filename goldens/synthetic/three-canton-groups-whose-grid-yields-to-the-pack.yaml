# Expected: the linked-group grid gives way to the pack of the beside rows (ticket 136), on the sheet of
# `three-canton-groups-close-up-to-a-band-gap` (ranked-groups ticket 65) with a side hint on m1 and the feed order off. The grid of
# `mpls` and `loc-a2` would widen `loc-a2` after 7f packed its row, so it keeps its own extents and GROUP_GRID_YIELDS_TO_PACK names
# the pair; the finished layout is the fixed point of the pack.
# Re-forged for snack-theme ticket 159: the nodes of `top-1` to `top-3` and of `mpls` have no class, so they are cards with no icon
# tile. With the tiles, card nodes widen those rows so far that the grid no longer meets the packed row, and the yield is gone.
# Test-only input owned by canton-groups ticket 136; test/pipeline/canton-walls.test.ts reads the layout.
# Card nodes (`layout.nodeContent: card`, snack-theme ticket 159): the premise was forged on the card geometry; a stacked document is narrower.
