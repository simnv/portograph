# Expected: The corridor rule one step further. `a` links to the bar above it and to the bar below
# it, so it needs the first row and the last row at once, and the one count that gives it both is a
# single row: the column floor answers a node that exits both ways with the node count. Every gate
# passes. Ranked into the last row of a two-column grid instead — which is what the count did before
# the floor — `a`'s upward reservation ran through `c`, and the diagram published G2, G3, G6 and one
# `BAR_DROP_OBSTRUCTED`.
portograph: 2
profile: network
groups:
  above: { tier: 0, shape: bar }
  place: { tier: 1, shape: grid }
  below: { tier: 2, shape: bar }
nodes:
  topRail: { group: above, ports: [{ name: p, side: bottom }] }
  a: { group: place, ports: [{ name: u, side: top }, { name: d, side: bottom }] }
  b: { group: place }
  c: { group: place }
  d: { group: place }
  botRail: { group: below, ports: [{ name: p, side: top }] }
links:
  - [a.u, topRail.p]
  - [a.d, botRail.p]
