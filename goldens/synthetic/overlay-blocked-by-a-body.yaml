# Expected: An overlay link whose diagonal has a node body in the way. Both loopback ports face left
# and Border B's own body lies between them, so each 16 px stub points away from the other end and
# the 86.06 px segment between the two stub ends doubles back across Border B, from (28.5, 258.5) to
# (114.5, 255.5). Nothing dodges it: the maintainer's direction is to move the nodes rather than bend
# the line (stress ticket 20, question 3; stress ticket 21), and the SVG mask keeps the body readable
# as it did before the rule existed. Only the two stubs and the sliver outside the pills are drawn.
# Every gate passes; Q is 0.8401068126850539 — unchanged from the staircase, which reached the same
# bounding box.
# Test-only input owned by synthetics-review ticket 01 and stress ticket 20; the whole pipeline runs,
# so no stage precondition is needed.
portograph: 2
groups:
  upper: { tier: 0, label: Upper }
  lower: { tier: 1, label: Lower }
nodes:
  a:
    group: upper
    class: router
    label: Router A
    ports:
      - { name: d1, side: bottom, class: downlink }
  b:
    group: lower
    class: tbr
    label: Border B
    ports:
      - { name: u1, side: top, class: uplink }
      - { name: lo, side: left, class: loopback }
  c:
    group: lower
    class: rr
    label: Reflector C
    ports:
      - { name: lo, side: left, class: loopback }
links:
  - [a.d1, b.u1]
  - [b.lo, c.lo, { route: overlay }]
