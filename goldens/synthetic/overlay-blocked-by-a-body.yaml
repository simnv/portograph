# Expected: An overlay link that cannot go round every shape. Both loopback ports face left, so the
# straight segment of the 2026-09-16 rule (stress ticket 20) — now from (32.5, 258.5) to
# (118.5, 255.5), face to face, since stress ticket 30 removed that branch's stub — runs through both
# node bodies and through the target's own pill, which it must turn back into because that port faces
# away from its partner. It is refused and the link is
# routed orthogonally. Border B's own body then lies between the two ports, so none of the eight ways
# the two pill boxes offer clears every node and pill either. The rule falls back one step and takes
# the shortest way that clears its own two pill boxes: out of each pill face by the clearance, and
# one run across above both of them, which crosses Border B. The SVG mask keeps that body readable.
# The whole path is (32.5, 258.5) (28.5, 258.5) (28.5, 246.5) (114.5, 246.5) (114.5, 255.5)
# (118.5, 255.5) — 4, 12, 86, 9 and 4 px — beginning and ending on the two pill faces, where the
# endpoint marks are drawn. The 4 px at each end is `OVERLAY_PILL_CLEARANCE`, which this branch keeps
# because it has to step outward before it can turn (stress ticket 30).
# Every gate passes; Q is 0.8401068126850539. The detour reaches further than the straight line it
# replaced, so `aspectRatio` reads a different bounding box and Q moves with it: the score reads
# what the diagram draws, and a drift here is not a regression.
# Test-only input owned by synthetics-review ticket 01; the whole pipeline runs, so no stage
# precondition is needed.
portograph: 2
groups:
  upper: { tier: 0, label: Upper }
  lower: { tier: 1, label: Lower }
nodes:
  a:
    group: upper
    class: router
    label: Router A
    ports:
      - { name: d1, side: bottom, class: downlink }
  b:
    group: lower
    class: tbr
    label: Border B
    ports:
      - { name: u1, side: top, class: uplink }
      - { name: lo, side: left, class: loopback }
  c:
    group: lower
    class: rr
    label: Reflector C
    ports:
      - { name: lo, side: left, class: loopback }
links:
  - [a.d1, b.u1]
  - [b.lo, c.lo, { route: overlay }]
