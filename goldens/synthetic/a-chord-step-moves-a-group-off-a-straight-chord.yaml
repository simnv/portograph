# Expected: In the base 7f run (no side trial), the step over a chord moves a free group off the chords of its tier (architecture ticket 13, phase 1).
# The canton `west` holds the ranked members `left` and `right` (a router row and a zone rank of two servers each, fed from the core row on
# tier 0), and below them the free members `upper` (tier 3) and `lower` (tier 4). Neither free member has a routed link. Every server of the
# two zone ranks syncs with every client of both. On the mean of the partners both free members stand on the canton axis, so the chords to
# `lower` cross the row of `upper`. The step moves `upper` to the nearest x where the chords stand clear (one mover, one round that moved).
# Test-only input owned by architecture ticket 13; test/pipeline/attempt-ledger.test.ts reads the counters of the layout.
portograph: 2
groups:
  core: { tier: 0, label: Core }
  west: { label: West }
  left: { tier: 1, canton: west, label: Left site }
  left-zone: { parent: left, label: Left zone }
  right: { tier: 1, canton: west, label: Right site }
  right-zone: { parent: right, label: Right zone }
  upper: { tier: 3, canton: west, label: Upper clients }
  lower: { tier: 4, canton: west, label: Lower clients }
nodes:
  core-1: { group: core, class: router, label: Core 1 }
  core-2: { group: core, class: router, label: Core 2 }
  left-gw: { group: left, class: router, label: Left gateway }
  left-a: { group: left-zone, class: server, label: Left A }
  left-b: { group: left-zone, class: server, label: Left B }
  right-gw: { group: right, class: router, label: Right gateway }
  right-a: { group: right-zone, class: server, label: Right A }
  right-b: { group: right-zone, class: server, label: Right B }
  up-1: { group: upper, class: server, label: Upper 1 }
  up-2: { group: upper, class: server, label: Upper 2 }
  low-1: { group: lower, class: server, label: Lower 1 }
  low-2: { group: lower, class: server, label: Lower 2 }
links:
  - [core-1, left-gw]
  - [core-2, right-gw]
  - [left-gw, left-a]
  - [left-gw, left-b]
  - [right-gw, right-a]
  - [right-gw, right-b]
  - [left-a, up-1, { class: sync }]
  - [left-b, up-2, { class: sync }]
  - [right-a, up-1, { class: sync }]
  - [right-b, up-2, { class: sync }]
  - [left-a, low-1, { class: sync }]
  - [left-b, low-2, { class: sync }]
  - [right-a, low-1, { class: sync }]
  - [right-b, low-2, { class: sync }]
