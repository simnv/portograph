# Expected: three links climb to one node in tier 3. Two start in the lowest tiers and transit the
# tiers between through lanes of their own; the third starts *inside* one of those tiers, so its
# approach has to travel along a tier gap to reach the mouth of its own lane.
#
# Nothing allocated that travel. The two earlier ownership batches routed their own approaches
# across it, sealed the only corridor between the two reserved lanes, and libavoid returned its
# degenerate answer: `Router skipped a required checkpoint on link-3#0`.
#
# ADR-0015 rule 1 per tier gap allocates one row for the third link and reserves the two lane-to-lane
# columns beside it, so the corridor exists before the first batch runs. Delta-debugged against the
# exact message; every group is load-bearing for the tier geometry.
