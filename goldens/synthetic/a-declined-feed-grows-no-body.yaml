# Expected: A feed the row declines must grow no body (architecture-2 ticket 14, "bends first"). The child n1 has four
# distinct top ports: three fed by rA at the left end of the row above, one (b) by rB at its right end. The sibling s1
# stands right of n1 and its own feed (f1) holds it there, so in each pass b cannot reach rB's x
# (CENTRE_ALIGNMENT_INFEASIBLE).
# Today: b still pulls the move toward rB in every pass, the three kept ports pull the body back by growing it, and n1
# ends 261.3 px wide for no straight link; the eight passes are spent (PLACEMENT_NON_CONVERGENCE).
# Wanted: the three links to rA stand straight and n1 keeps the 90 px its four ports need. Reaching b would push s1
# off its feed: one bent link for another, so the narrower body wins.
# Status: ticket 14 is open. The "Wanted" line is the rule; the "Today" line is what main does. The test marks the
# wanted assertions `it.fails` until the rule lands.
# Test-only input owned by architecture-2 ticket 14; test/pipeline/declined-feed-growth.test.ts runs the whole pipeline on it.
portograph: 2
profile: network
groups:
  top: {tier: 0, label: Top}
  low: {tier: 1, label: Low}
nodes:
  rA: {group: top, class: router, label: RA, ports: [{name: p1, side: bottom}, {name: p2, side: bottom}, {name: p3, side: bottom}]}
  f1: {group: top, label: F1}
  f2: {group: top, label: F2}
  rB: {group: top, class: router, label: RB, ports: [{name: q, side: bottom}]}
  n1: {group: low, label: N1, ports: [{name: a1, side: top}, {name: a2, side: top}, {name: a3, side: top}, {name: b, side: top}]}
  s1: {group: low, label: S1}
links:
- [rA.p1, n1.a1]
- [rA.p2, n1.a2]
- [rA.p3, n1.a3]
- [rB.q, n1.b]
- [f1, s1]
