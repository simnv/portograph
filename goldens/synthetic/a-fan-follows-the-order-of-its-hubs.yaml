# Expected: the cells of a fan follow the order of the far ends they reach (architecture-2 ticket 25, part B). A
# carrier router feeds two hubs, hub1 left of hub2, and the hubs fan to three locations. Each location has two edge
# routers in rank 0, e1 linked to hub1 and e2 to hub2, joined to each other, and an access switch in rank 1 that both
# feed. Each location declares e2 before e1. The order of the far ends puts e1 left of e2 in every location, so the two
# fan links of one location never cross: 3 routed crossings remain, the ones between locations that no order removes
# (hub2's link to a location crosses hub1's link to each location right of it). In the declared order each location's
# two fan links also crossed: 6 routed crossings, 4 bent routed links.
# Test-only input owned by architecture-2 ticket 25; test/layout/feed-order.test.ts reads the layout.
portograph: 2
groups:
  carrier: { tier: 0, label: Carrier }
  core: { tier: 1, label: Core }
  west: { tier: 2, label: West }
  middle: { tier: 2, label: Middle }
  east: { tier: 2, label: East }
nodes:
  up: { group: carrier, class: router, label: Carrier router }
  hub1: { group: core, class: provider, label: Hub one }
  hub2: { group: core, class: provider, label: Hub two }
  w2: { group: west, class: router, label: West edge two }
  w1: { group: west, class: router, label: West edge one }
  wa: { group: west, class: switch, label: West access }
  m2: { group: middle, class: router, label: Middle edge two }
  m1: { group: middle, class: router, label: Middle edge one }
  ma: { group: middle, class: switch, label: Middle access }
  x2: { group: east, class: router, label: East edge two }
  x1: { group: east, class: router, label: East edge one }
  xa: { group: east, class: switch, label: East access }
links:
  - [up, hub1]
  - [up, hub2]
  - [w1, hub1]
  - [m1, hub1]
  - [x1, hub1]
  - [w2, hub2]
  - [m2, hub2]
  - [x2, hub2]
  - [w2, w1]
  - [m2, m1]
  - [x2, x1]
  - [w1, wa]
  - [w2, wa]
  - [m1, ma]
  - [m2, ma]
  - [x1, xa]
  - [x2, xa]
