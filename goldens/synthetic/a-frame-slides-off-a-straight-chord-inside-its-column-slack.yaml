# Expected: A frame of two cells slides off a straight overlay chord inside its column slack (ticket 80).
# The location `loc` has a core cell on tier 1 and a zone cell on tier 2; the zone's long title widens its box, so its nodes have
# slack. `src` (tier 0) syncs with `dst` (tier 3); the chord runs past the zone cell. Every link of the frame's cells stays off an
# axis, so no straight link bends when the frame moves. The test stands the frame, or one node of the zone, on the chord after
# layout, runs the step and reads the placed model. Test-only input owned by ranked-groups ticket 80; test/pipeline/chord-clear.test.ts.
portograph: 2
groups:
  top: { tier: 0, label: Top }
  loc: { tier: 1, label: Site }
  loc-zone: { parent: loc, label: The zone of the site with a long title }
  bottom: { tier: 3, label: Bottom }
  wide: { tier: 3, label: Wide }
nodes:
  src: { group: top, class: server, label: Source }
  up: { group: top, class: router, label: Uplink }
  gw: { group: loc, class: router, label: Gateway }
  sw: { group: loc-zone, class: switch, label: Switch }
  sw2: { group: loc-zone, class: switch, label: Switch two }
  dst: { group: bottom, class: server, label: Target }
  w1: { group: wide, class: server, label: Wide one }
  w2: { group: wide, class: server, label: Wide two }
links:
  - [src, gw]
  - [up, gw]
  - [gw, sw]
  - [sw2, dst]
  - [sw, w1]
  - [sw, w2]
  - [src, dst, { class: sync }]
