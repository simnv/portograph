# Expected: two chords cross one middle tier close together, so the nearest edge of the mover's forbidden run clears only one of them and a
# farther edge clears both. The mover takes the position that leaves the most chords straight, not the nearest one (ticket 110).
portograph: 2
groups:
  sources: { tier: 0, label: Sources }
  middle: { tier: 1, label: Middle }
  targets: { tier: 2, label: Targets }
  spread: { tier: 3, label: Spread }
nodes:
  src-a: { group: sources, class: server, label: Source A }
  src-b: { group: sources, class: server, label: Source B }
  mid: { group: middle, class: server, label: A middle node with a long label }
  dst-a: { group: targets, class: server, label: Target A }
  dst-b: { group: targets, class: server, label: Target B }
  wide-1: { group: spread, class: server, label: Wide node number 1 }
  wide-2: { group: spread, class: server, label: Wide node number 2 }
  wide-3: { group: spread, class: server, label: Wide node number 3 }
  wide-4: { group: spread, class: server, label: Wide node number 4 }
links:
  - [src-a, dst-a, { class: sync }]
  - [src-b, dst-b, { class: sync }]
  - [dst-a, wide-1]
  - [dst-b, wide-2]
  - [mid, dst-a, { class: sync }]
