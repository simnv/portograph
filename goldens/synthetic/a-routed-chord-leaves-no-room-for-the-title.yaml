# Expected: A routed link keeps the orthogonal route where the chord would take the room of the title (ranked-groups ticket 100, Q108).
# A location frame on tier 1 links its router to the only node of a provider group on tier 2, and a frame on tier 3 links its router
# to the same node. The two edges carry one routed port each, so the tie keeps the title on the top edge, where the chord enters.
# The group is as wide as its one node and the title is wider than either side of the crossing, plus the 8 px inset on each side, so the link is refused with
# `ROUTED_CHORD_REFUSED` reason `title`. The link is orthogonal and every gate passes. No growth is assumed: the group could
# widen later, but a widening the decision counted on would be a size discovered after the route (the pipeline's one rule).
# Test-only input owned by ranked-groups ticket 100; test/pipeline/routed-chord-title.test.ts reads the layout.
portograph: 2
profile: network
groups:
  upstream: { tier: 1, label: Upstream }
  providers: { tier: 2, label: Providers of the upstream transit service }
  lower: { tier: 3, label: Lower }
nodes:
  upstream-core: { group: upstream, class: router, label: Upstream core router }
  upstream-router: { group: upstream, class: router, label: Upstream router }
  provider-1: { group: providers, class: provider, label: Provider 1 }
  lower-router: { group: lower, class: router, label: Lower router }
links:
  - [upstream-core, upstream-router]
  - [upstream-router, provider-1, { class: dashed }]
  - [provider-1, lower-router, { class: dashed }]
