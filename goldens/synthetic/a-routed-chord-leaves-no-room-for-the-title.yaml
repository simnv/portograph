# Expected (architecture-2 ticket 54, titles last): a routed link keeps its chord where the title has no room beside the crossing. A location
# frame on tier 1 links its router to the only node of a provider group on tier 2, and a frame on tier 3 links its router to the same node. The
# two edges carry one routed port each, so the tie keeps the title on the top edge, where the chord enters. The group is as wide as its one node
# and the title is wider than either side of the crossing, so the title finds no free span: it stands at the centre with a halo and names the
# chord in `crossedBy`. No `ROUTED_CHORD_REFUSED` is raised, every link is straight, and every gate passes (G3 excuses the chord).
# Before ticket 54 the chord was refused with reason `title` (ranked-groups ticket 100, Q108) and the link was orthogonal.
# Test-only input owned by ranked-groups ticket 100; test/pipeline/routed-chord-title.test.ts reads the layout.
portograph: 2
profile: network
groups:
  upstream: { tier: 1, label: Upstream }
  providers: { tier: 2, label: Providers of the upstream transit service }
  lower: { tier: 3, label: Lower }
nodes:
  upstream-core: { group: upstream, class: router, label: Upstream core router }
  upstream-router: { group: upstream, class: router, label: Upstream router }
  provider-1: { group: providers, class: provider, label: Provider 1 }
  lower-router: { group: lower, class: router, label: Lower router }
links:
  - [upstream-core, upstream-router]
  - [upstream-router, provider-1, { class: dashed }]
  - [provider-1, lower-router, { class: dashed }]
