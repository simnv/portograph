# Expected: The feeding chain of a wrapped rank cell moves as one block over the cell's block (fan wrap, decision D-Q4, ticket 07).
# Two locations stand in the lowest tier. `west` holds a gateway, a hub and twenty-four leaves fed by the hub; its leaf cell stands on
# two lines, and the column packer packs the tier again, so `west` is narrower and `east` closes up. Above stand a chain of
# one-rank tiers: `dist` feeds both gateways, `core` feeds `dist`. Stage 5 decides the chain once (`staggerRows[].chain` = core, dist)
# and moves it as one block in x, so Dist one stands over West gateway again; no body of the chain grows to reach a feed (Dist one
# keeps its own width), and the feed to East gateway takes its bend. The overlay link Core two to East hub stays one straight segment.
# The acceptance gate keeps the two lines: less area and every straight link kept. Publication checks that the chain still stands over
# its block. Test-only input; test/pipeline/fan-wrap.test.ts reads the layout.
portograph: 2
groups:
  core: { tier: 0, label: Core }
  dist: { tier: 1, label: Dist }
  west: { tier: 2, label: West }
  west-zone: { parent: west, label: West zone }
  east: { tier: 2, label: East }
  east-zone: { parent: east, label: East zone }
