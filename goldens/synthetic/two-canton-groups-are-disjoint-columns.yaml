# Expected: Two cantons are disjoint columns (canton-groups ticket 2, fixture 2). A wide anchor tier `core` (tier 0,
# four routers) stands above two cantons of two tiers each. `west` holds `w-site` (tier 1) and `w-lab` (tier 2);
# `east` holds `e-site` (tier 1) and `e-lab` (tier 2). Each member of tier 1 links up to the core. One flow link
# joins `w-lab` to `e-lab`. The two canton frames stand a band gap apart at every sub-tier they share, and every
# member stands inside its canton column.
# Test-only input owned by canton-groups ticket 2; test/pipeline/canton-frames.test.ts reads the layout.
portograph: 2
groups:
  west: { label: West }
  east: { label: East }
  core: { tier: 0, label: Core }
  w-site: { tier: 1, canton: west, label: West site }
  w-lab: { tier: 2, canton: west, label: West lab }
  e-site: { tier: 1, canton: east, label: East site }
  e-lab: { tier: 2, canton: east, label: East lab }
nodes:
  core1: { group: core, class: router, label: Core one }
  core2: { group: core, class: router, label: Core two }
  core3: { group: core, class: router, label: Core three }
  core4: { group: core, class: router, label: Core four }
  w-gw: { group: w-site, class: router, label: West gateway }
  w-sw: { group: w-site, class: switch, label: West switch }
  w-srv: { group: w-lab, class: server, label: West server }
  e-gw: { group: e-site, class: router, label: East gateway }
  e-sw: { group: e-site, class: switch, label: East switch }
  e-srv: { group: e-lab, class: server, label: East server }
links:
  - [core1, w-gw]
  - [core2, w-sw]
  - [core3, e-gw]
  - [core4, e-sw]
  - [w-gw, w-srv]
  - [e-gw, e-srv]
  - { from: w-srv, to: e-srv, class: flow }
