# Expected: Two locations keep their feed axis through every stage (ranked-groups ticket 16). One tier-0
# row group of 13 nodes, `west`, stands over two tier-1 frames, `one` and `two`. Each frame has a gateway on
# rank 0 and a row of five switches on rank 1: the gateway feeds switches 1 and 3, and the row is chained
# 1-3, 3-5. The gateways are fed from `west-5` and `west-9`, four nodes apart, which is further than the two
# frames need: both feed links can be one straight segment. Pack puts the axes under the feeds, but the rows
# rule spaces the switches wider than pack measured and pushes `two` right, and the sweep never moved it
# back, so `link-2` jogged by 192 px at the end. The pass of ticket 16 pulls the columns back toward their
# feeds as far as they allow each other.
# Test-only input owned by ranked-groups ticket 16; test/pipeline/column-axis-hold.test.ts reads the layout.
portograph: 2
groups:
  west: { tier: 0, label: West }
  one: { tier: 1, label: Location one }
  two: { tier: 1, label: Location two }
nodes:
