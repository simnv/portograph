  west-10: { group: west, class: switch, label: West 10 }
  west-11: { group: west, class: switch, label: West 11 }
  west-12: { group: west, class: switch, label: West 12 }
  west-13: { group: west, class: switch, label: West 13 }
  one-gw: { group: one, class: router, label: One gateway }
