# Expected: dense-16x9 ticket 42, review 2 (P2a): the final flat-gap choice is triggered by the published sheet, not by a placement reading.
# A 2x7 flat solid block (`hub` over seven pairs, past the 600 px cap) with the aim 3:1, and one labelled link between the bottom ports of
# the outer pair nodes. Stage 8 routes that link below the pairs, outside the placed boxes, so the published sheet is 5 px higher than every
# placement reading (5015.5 x 1676.833 px when the trigger compared two 7f readings: no fit ran). The final choice reads the published sheet
# of the run, places once (`FLAT_BLOCK_GAP_FINAL`, the flat gap 1407.33 -> 1402.33 px) and publishes 5015.5 x 1671.833 px, W / 3.
# Test `test/pipeline/flat-gap-final-public.test.ts`.
