# Expected: the ten `sync` links among the five nodes of `row` do not draw alike (one is labelled `backup`), so no bus forms and no smaller
# bus forms inside the refused mesh: MESH_BUS_DECLINED reason `label` naming that link, ten plain overlay links.
# Architecture-2 ticket 21: the `backup` label beside its detour over the row needs 20.25 px of top padding; 7f grows the top edge of
# `row` by 0.25 px and records it (`labelPadding`), so the label crosses no border.
# Test-only input owned by ranked-groups ticket 94; test/resolve/mesh-bus-join.test.ts and test/pipeline/link-label-rules.test.ts read it.
portograph: 2
groups:
  top: { tier: 0, label: Top }
  row: { tier: 1, label: Row }
nodes:
  core: { group: top, class: router, label: Core }
  n1: { group: row, class: router, label: N1 }
  n2: { group: row, class: router, label: N2 }
  n3: { group: row, class: router, label: N3 }
  n4: { group: row, class: router, label: N4 }
  n5: { group: row, class: router, label: N5 }
links:
  - [core, n1]
  - [core, n5]
  - { from: n1, to: n2, class: sync }
  - { from: n1, to: n3, class: sync }
  - { from: n1, to: n4, class: sync }
  - { from: n1, to: n5, class: sync }
  - { from: n2, to: n3, class: sync }
  - { from: n2, to: n4, class: sync, label: backup }
  - { from: n2, to: n5, class: sync }
  - { from: n3, to: n4, class: sync }
  - { from: n3, to: n5, class: sync }
  - { from: n4, to: n5, class: sync }
