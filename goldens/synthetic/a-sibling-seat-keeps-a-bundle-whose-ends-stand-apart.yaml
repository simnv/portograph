# Expected: w1 links to the east frame, so its facing end is the east end of the west row; but w1 leaves an authored lateral bundle (two links, right
# ports of w1 to left ports of w2), and wx stands between the two ends. The ends are not side by side, yet the bundle still needs w1 left of w2: the
# relative order of the two ends is what the row owes it. The seat would stand the row wx, w2, w1 and turn the bundle, so the sibling seat of west is
# declined by name (SIBLING_SEAT_REFUSED, info) and the row keeps w1, wx, w2. The two bodies are 180 px high and the bundle ports sit below wx, so the
# channel is clear: every gate passes and no link is removed.
# Before the rule read the order (review 06c-2), a guard that kept only adjacent ends let the seat turn the bundle: G2 4, G3 4, G5 2 and G6 4.
# Test-only input owned by dense-16x9 ticket 06 (slice C, review 2): test/pipeline/sibling-rows.test.ts.
portograph: 2
layout: { autoArrange: false }
groups:
  src: { tier: 0, label: Source }
  west: { tier: 1, label: West }
  east: { tier: 1, label: East }
  sink: { tier: 2, label: Sink }
nodes:
  s0: { group: src, class: router }
  wt: { group: west, class: router }
  w1:
    group: west
    class: switch
    size: { width: 70, height: 180 }
    ports:
      - { name: d0, side: right, order: 0 }
      - { name: d1, side: right, order: 1 }
      - { name: d2, side: right, order: 2 }
      - { name: d3, side: right, order: 3 }
      - { name: a, side: right, order: 5 }
      - { name: b, side: right, order: 6 }
  wx: { group: west, class: switch, size: { width: 50, height: 40 } }
  w2:
    group: west
    class: switch
    size: { width: 70, height: 180 }
    ports:
      - { name: d0, side: left, order: 0 }
      - { name: d1, side: left, order: 1 }
      - { name: d2, side: left, order: 2 }
      - { name: d3, side: left, order: 3 }
      - { name: a, side: left, order: 5 }
      - { name: b, side: left, order: 6 }
  et: { group: east, class: router }
  e1: { group: east, class: switch }
  e2: { group: east, class: switch }
  k1: { group: sink, class: router }
  k2: { group: sink, class: router }
links:
  - [s0, wt]
  - [s0, et]
  - [wt, w1]
  - [wt, wx]
  - [wt, w2]
  - [et, e1]
  - [et, e2]
  - [w1.a, w2.a]
  - [w1.b, w2.b]
  - [w1, e1]
  - [w1, k1]
  - [e1, k2]
