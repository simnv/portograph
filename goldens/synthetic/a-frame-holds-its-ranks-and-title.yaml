# Expected: One frame around two rank cells, one title (ranked-groups ticket 03). The gateway links to the
# ISP above, so it is rank 0 of group `site`; the distribution switch hangs from it, rank 1. Stage 1 replaces
# `site` by the cells `site#0` and `site#1`, and the pipeline draws ONE box for `site`: the union of the two
# cells, with a single title "Site" in the frame's label band above the gateway. The cells carry no label
# band and no label of their own. The ISP's group has one rank, so it has no frame and is drawn as before.
# Test-only input owned by ranked-groups ticket 03; test/pipeline/frames.test.ts reads the layout.
portograph: 2
groups:
  upstream: { tier: 0, label: Upstream }
  site: { tier: 1, label: Site }
nodes:
  isp: { group: upstream, class: provider, label: ISP }
  gw: { group: site, class: router, label: Gateway }
  dist: { group: site, class: switch, label: Distribution }
links:
  - [isp, gw]
  - [gw, dist]
