# Expected: Ticket 36's shape (ranked-groups ticket 39). `site` holds three routers on rank 0 and four switches on rank 1
# in one frame; the `orthogonal` route keeps the links off the ticket 34 chord. Link-4 (first router to the third switch)
# and link-7 (second router to the second switch) interleave: the source ports of the pair run left to right, the target
# ports right to left, so the pair must cross once. Link-7's source stem nests (depth 32.5, tip row y 280.5) and both
# targets are plain.
# On main the router lays link-4 as a run on its nested tip row (y 280.5), a jog of exactly one pitch (23 px, x 158.3), and
# a run on the far tip row (y 303.5): (104.6,248) (104.6,280.5) (158.3,280.5) (158.3,303.5) (194,303.5) (194,318.5). The
# covers of the two runs meet on the centre of the jog, the crossing has no free face, the pocket of link-7's target tip
# (128.5, 303.5) is closed, and link-7 is removed: `ROUTE_CHECKPOINT_SKIPPED`. Gate G6 fails.
# The allocation now gives link-4, the earlier link, a run on the row midway between its tip rows (the gap grows 39.5 px in
# all, 10.5 of it for the stems), link-7 crosses it once on that row, nothing is removed and every gate passes.
# Test-only input owned by ranked-groups ticket 39; test/pipeline/interleaved-gap-links.test.ts reads the layout.
portograph: 2
groups:
  upstream: { tier: 0 }
  site: { tier: 1 }
nodes:
  isp: { group: upstream, class: provider }
  r0: { group: site, class: router }
  r1: { group: site, class: router }
  r2: { group: site, class: router }
  s0: { group: site, class: switch }
  s1: { group: site, class: switch }
  s2: { group: site, class: switch }
  s3: { group: site, class: switch }
links:
  - [isp, r0, { route: orthogonal }]
  - [isp, r1, { route: orthogonal }]
  - [isp, r2, { route: orthogonal }]
  - [r0, s2, { class: physical, route: orthogonal }]
  - [r0, s3, { class: physical, route: orthogonal }]
  - [r1, s0, { class: physical, route: orthogonal }]
  - [r1, s1, { class: physical, route: orthogonal }]
  - [r2, s2, { class: physical, route: orthogonal }]
  - [r2, s3, { class: physical, route: orthogonal }]
