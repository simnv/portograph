# Expected: Four direct lines — a link whose model path is one segment — of both kinds the draw.io
# exporter has to tell apart. Two routed links run straight down and one runs straight across with a
# label. A routed direct line is horizontal or vertical. Each of the three carries
# `orthogonalEdgeStyle;jettySize=0` with no waypoint of its own, and a dragged end makes a Z-bend,
# never a diagonal. The overlay link joins a top pill to a bottom pill that share neither x nor y.
# That is the unaligned pair, and it is the exception branch of the 2026-09-16 rule (stress
# ticket 20): the straight segment between its two stub ends, from (83.75, 216) to (204.02, 307),
# runs through both lower node bodies, so it takes the shortest orthogonal detour that enters neither
# pill box instead — and the whole connector stays square. The whole path is (83.75, 220)
# (83.75, 216) (143.89, 216) (143.89, 307) (204.02, 307) (204.02, 303) — 4, 60.14, 91, 60.14 and
# 4 px — beginning and ending on the two pill faces, which is where the endpoint marks are drawn
# (stress ticket 30) and where the exporter already pinned `exitX`/`exitY` with `exitPerimeter=0`,
# so the exported connector does not move.
# Every gate passes; Q is 0.8236621295302419. The `peer` label crosses the overlay's
# descent and the mask cuts 11 px of it: both of the label's candidate sides are covered, and a
# label that is drawn beats a line that is whole (synthetics review ticket 01).
# Test-only input owned by drawio-export ticket 02; the whole pipeline runs, so no stage
# precondition is needed.
portograph: 2
groups:
  upper: { tier: 0, label: Upper }
  lower: { tier: 1, label: Lower }
nodes:
  a:
    group: upper
    class: router
    label: Router A
    ports:
      - { name: d1, side: bottom, class: downlink }
      - { name: d2, side: bottom, class: downlink }
  b:
    group: lower
    class: tbr
    label: Border B
    ports:
      - { name: u1, side: top, class: uplink }
      - { name: east, side: right, class: peer }
      - { name: lo, side: top, class: loopback }
  c:
    group: lower
    class: rr
    label: Reflector C
    ports:
      - { name: u2, side: top, class: uplink }
      - { name: west, side: left, class: peer }
      - { name: lo, side: bottom, class: loopback }
links:
  - [a.d1, b.u1]
  - [a.d2, c.u2]
  - [b.east, c.west, { label: peer }]
  - [b.lo, c.lo, { route: overlay }]
