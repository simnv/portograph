# Expected: a held chord whose angle class 7f changes keeps its chord, and the title yields to it (architecture-2 ticket 54, ADR-0023).
# `w2` feeds `wb1` across the tier gap, into the frame `w-site-b` (a cell with a child zone). At the end of 7e the feed is a straight
# chord about 11 degrees off the vertical, a diagonal, and the freeze holds it. 7f then moves the columns and grows the gap: the chord
# stands near the vertical, across the title edge of `w-site-b`. Before ticket 54 a retry of 7f refused it (`title`) and it took the
# orthogonal route. Now no title refuses a chord: the title of `w-site-b` is placed last, finds no free span, takes the halo and records
# the feed (`crossedBy`), the feed stays one segment, and every gate passes. Stacked nodes; the group ids are the titles.
# Test-only input owned by ticket 162 and architecture-2 ticket 54; test/pipeline/chord-class-reread.test.ts reads it.
portograph: 2
groups:
  west: { label: West }
  w-top-a: { tier: 1, canton: west }
  w-top-b: { tier: 1, canton: west }
  e-top-b: { tier: 1 }
  w-site-a: { tier: 2, canton: west }
  w-zone-a: { parent: w-site-a }
  w-site-b: { tier: 2, canton: west }
  w-zone-b: { parent: w-site-b }
nodes:
  w1: { group: w-top-a, label: W1 }
  w2: { group: w-top-b, label: W2 }
  e2: { group: e-top-b, label: E2 }
  wz1: { group: w-zone-a, label: WZ1 }
  wb1: { group: w-site-b, label: WB1 }
  wb2: { group: w-site-b, label: WB2 }
  wz2: { group: w-zone-b, label: WZ2 }
links:
  - [w2, wb1]
  - [wb1, wb2]
  - [wb2, wz2]
  - { from: w1, to: w2, class: sync }
  - { from: w1, to: e2, class: sync }
  - { from: w2, to: e2, class: sync }
