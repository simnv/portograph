# Expected: An unseated lane-end piece holds the row between its tips (ranked-groups ticket 39, the ticket 41 shape).
# Three tiers; `orthogonal` links keep the ticket 34 chord off them. Link-7 (first tier 0 router to the fourth tier 2 switch)
# and link-8 (second tier 0 router to the second tier 2 switch) interleave: their sources run left to right, their targets
# right to left. Both cross the middle tier by a lane. In the gap under tier 0 the plain port stems of both end on the tip row
# y 116, and the lane approach points stand at y 155.3. The lane allocation seats no row for link-7, so its piece in that gap
# is one gap piece with no run.
# On main the router lays link-7 along its source tip row, (176.5,116) to (379.5,116), and link-8 rides the same row collinear
# with it, (401.5,116) to (198.5,116): G4 and G6 fail. The allocation now treats that piece like a plain one: it holds the row
# midway between its source tip row (116) and its lane approach point (155.3), y 135.6, 19.6 px from each. Link-8 crosses it
# once, at (198.5, 135.6), nothing is removed and every gate passes.
# Test-only input owned by ranked-groups ticket 39; test/pipeline/interleaved-gap-links.test.ts reads the layout.
portograph: 2
groups:
  g0: { tier: 0 }
  g1: { tier: 1 }
  g2: { tier: 2 }
nodes:
  a0: { group: g0, class: router }
  a1: { group: g0, class: router }
  b0: { group: g1, class: switch }
  c0: { group: g2, class: switch }
  c1: { group: g2, class: switch }
  c2: { group: g2, class: switch }
  c3: { group: g2, class: switch }
links:
  - [a0, b0, { class: physical, route: orthogonal }]
  - [b0, c0, { class: physical, route: orthogonal }]
  - [b0, c1, { class: physical, route: orthogonal }]
  - [b0, c2, { class: physical, route: orthogonal }]
  - [b0, c3, { class: physical, route: orthogonal }]
  - [a0, c1, { class: physical, route: orthogonal }]
  - [a0, c3, { class: physical, route: orthogonal }]
  - [a1, c1, { class: physical, route: orthogonal }]
  - [a1, c3, { class: physical, route: orthogonal }]
