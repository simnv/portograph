# Expected (dense-16x9 ticket 47): with `layout.moveBeforeGrow: true` (ADR-0027) a member of a pooled row unit seats inside the body it has, as
# it aligns inside it without the option: no growth and no slide. `row-a` and `row-b` are fed by `hub` and stand as one unit; the feed of
# `node-b` stands left of the window the unit leaves `row-b`. Before the fix the seat of `node-b` grew the body over that feed, the clamp of
# the step carried the port off again, and the step was declined whole, main move included, on every pass: `row-b` stood at its stage-6 x
# (607), 405 px right of where its main move puts it, with no seat or target of its own, the canvas was 716 x 322 and the overlay `ov-3` bent.
# Now the main move stands: `row-b` stands at x 202 beside `row-a`, `node-b` keeps its 55 px body, the canvas is 370 x 322 and every
# overlay is straight, as without the option. Test: test/layout/pooled-seat.test.ts.
