# Expected: four links cross the middle tier to reach four nodes below it, wired so that no
# horizontal move puts a run on one x. Each is therefore a **row** in the tier gap under the middle
# tier, not a column, and four rows need `4 x 17.5 = 70 px`.
#
# The band gap is 60 px for the whole diagram, and the lanes that face the gap overhang their band
# by 10.75 px, so the room a run really had was 49.25 px: two rows. The allocation seated two and
# left the rest to stage 8, the first ownership batch took the corridor the third needed, and the
# diagram did not publish: `Routed gap on link-4 crosses reserved lane lane:"link-4":1 sideways`.
#
# ADR-0015 rule 1 now grows the gap to the rows it must seat: 7f measures four rows, moves the
# bottom tier down 20.75 px, and the gap holds 70 px between the lane extents - the rows times the
# pitch, plus the 10.75 px of margin the overhang takes. The diagram publishes.
portograph: 2
groups:
  g0: { tier: 0 }
  g1: { tier: 1 }
  g2: { tier: 2 }
nodes:
  s0: { group: g0, label: S, ports: [{ name: p, side: bottom }] }
  s1: { group: g0, label: S, ports: [{ name: p, side: bottom }] }
  s2: { group: g0, label: S, ports: [{ name: p, side: bottom }] }
  s3: { group: g0, label: S, ports: [{ name: p, side: bottom }] }
  m1: { group: g1, ports: [{ name: p, side: top }] }
  t0: { group: g2, label: T, ports: [{ name: p, side: top }] }
  t1: { group: g2, label: T, ports: [{ name: p, side: top }] }
  t2: { group: g2, label: T, ports: [{ name: p, side: top }] }
  t3: { group: g2, label: T, ports: [{ name: p, side: top }] }
links:
  - [s0.p, t2.p]
  - [s1.p, t0.p]
  - [s2.p, t3.p]
  - [s3.p, t1.p]
