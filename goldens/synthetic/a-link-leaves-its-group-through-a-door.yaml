# Expected: two links leave one port of a narrow node, so 7e reserves a junction tree whose row stands
# inside the node's group, in its padding. One branch is released to the router (a reserved branch
# would cross the neighbour group), and the router must take it out of its own group. The group is a
# wall for that branch except for the doors that start at the end of its shared run, so the branch
# leaves sideways through the padding and turns up beyond the group's edge margin. G6 is clean.
portograph: 2
groups:
  up: { tier: 2, label: "Up" }
  centre: { tier: 5, label: "Centre" }
  home: { tier: 6, label: "Home" }
  beside: { tier: 6, label: "Beside" }
nodes:
  u1: { group: up, class: tbr, label: "u1" }
  s1: { group: home, class: router, label: "s1", ports: [{ name: p, side: top }] }
  c1: { group: centre, class: rr, label: "c1" }
  c2: { group: centre, class: provider, label: "c2", ports: [{ name: a, side: bottom, order: 1 }, { name: b, side: bottom, order: 2 }] }
  b1: { group: beside, class: tbr, label: "b1" }
links:
  - [s1.p, c1]
  - [s1.p, c2.a]
  - [c2.b, b1]
