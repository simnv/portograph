# Expected: A grid group stands fixed beside frame columns (ranked-groups ticket 12 review). The
# four locations of `four-locations-each-with-a-zone` share tier 1 with `spares`, a grid group of two
# nodes, one hung from each feed. The rows rule may not change a non-row group, so the column pass moves frames and
# one-rank row groups only, and leaves the grid where it stands, clear of the frames; layout does not throw. With the grid in the
# sweep, the rows rule refuses the move (`Rows cannot change non-row groups`).
