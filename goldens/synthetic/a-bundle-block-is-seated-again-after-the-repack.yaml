# Expected: architecture-2 ticket 74, a regression of the tier-gap solve (a reduced, anonymized real sheet). The bundle n6 -> n5 is seated
# along x: n5 grows to the ports of n6. The repack after the seat moves the frame column g1 a band gap and its slack from g2, so n6 moves
# and the block stands off the ports it aligned (0.42 px here, 30 px on the real sheet). The tier-gap solve then grows the gap above tier 1,
# and its rebuild in y seated the block again: n5 grew, g0 moved in x, and the solve threw. Now `prepareBundleGeometry` seats the blocks
# again until the repack moves no block's ends apart (`BUNDLE_SEAT_ROUNDS`). The sheet publishes, the three bundle links stand vertical,
# and n5 publishes in every slot of the g0 row (on main slots 0, 2 and 5 threw).
# Test test/layout/bundle-seat.test.ts.
portograph: 2
