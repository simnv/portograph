# Expected: Overlay link ends on a frame do not hold the frame off its feed axis (ranked-groups ticket 16).
# The input of `two-locations-keep-their-feed-axis.yaml` (feeds `west-5` and `west-9`, four nodes apart, so both
# feed links can be one straight segment) with three overlay links: a sync between the two locations
# (`one-s5` to `two-s1`, the same tier, face to face, so moving a frame in x cannot bend it) and one overlay link
# from each feed node to the gateway it feeds (parallel to the routed feed, so the overlay target and the feed
# target agree). Both frames hold overlay ends, and both must still be pulled back under their feeds: the
# rows rule pushes `two` right and the pass pulls it back to a jog of 0.
# Test-only input owned by ranked-groups ticket 16; test/pipeline/column-axis-hold.test.ts reads the layout.
# DR-04: links take the canonical order (group declaration order, then node order inside the group). `two` is declared
# first, then `one`, then `west`: ELK stands `two` left of `one` as before, and the test that adds an overlay link from west-1
# to two-s5 shows its held column again.
portograph: 2
groups:
  two: { tier: 1, label: Location two }
  one: { tier: 1, label: Location one }
  west: { tier: 0, label: West }
nodes:
  west-1: { group: west, class: switch, label: West 1 }
  west-2: { group: west, class: switch, label: West 2 }
  west-3: { group: west, class: switch, label: West 3 }
  west-4: { group: west, class: switch, label: West 4 }
  west-5: { group: west, class: switch, label: West 5 }
  west-6: { group: west, class: switch, label: West 6 }
  west-7: { group: west, class: switch, label: West 7 }
  west-8: { group: west, class: switch, label: West 8 }
  west-9: { group: west, class: switch, label: West 9 }
  west-10: { group: west, class: switch, label: West 10 }
  west-11: { group: west, class: switch, label: West 11 }
  west-12: { group: west, class: switch, label: West 12 }
  west-13: { group: west, class: switch, label: West 13 }
  one-gw: { group: one, class: router, label: One gateway }
  one-s1: { group: one, class: switch, label: One distribution switch 1 }
  one-s2: { group: one, class: switch, label: One distribution switch 2 }
  one-s3: { group: one, class: switch, label: One distribution switch 3 }
  one-s4: { group: one, class: switch, label: One distribution switch 4 }
  one-s5: { group: one, class: switch, label: One distribution switch 5 }
  two-gw: { group: two, class: router, label: Two gateway }
  two-s1: { group: two, class: switch, label: Two distribution switch 1 }
  two-s2: { group: two, class: switch, label: Two distribution switch 2 }
  two-s3: { group: two, class: switch, label: Two distribution switch 3 }
  two-s4: { group: two, class: switch, label: Two distribution switch 4 }
  two-s5: { group: two, class: switch, label: Two distribution switch 5 }
links:
  - [west-5, one-gw]
  - [west-9, two-gw]
  - [one-gw, one-s1]
  - [one-gw, one-s3]
  - [two-gw, two-s1]
  - [two-gw, two-s3]
  - [one-s1, one-s3]
  - [one-s3, one-s5]
  - [two-s1, two-s3]
  - [two-s3, two-s5]
  - [one-s5, two-s1, { route: overlay }]
  - [west-5, one-gw, { route: overlay }]
  - [west-9, two-gw, { route: overlay }]
