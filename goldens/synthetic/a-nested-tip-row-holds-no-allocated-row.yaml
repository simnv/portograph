# Expected: Six access switches link to two core routers above them and to two servers below them, and one
# core router links straight to the near server. The near server nests three stems, so their tips lie
# inside the gap the transit rows use. On main an allocated row stood inside the band of one run clearance
# about a nested tip row, and the router dropped a checkpoint and its link (ranked-groups ticket 31). The
# gap now grows so that every allocated row keeps one run clearance off every nested tip row, over the whole
# travel of the leg that runs along it, and every link routes.
# Test-only input owned by ranked-groups ticket 31.
portograph: 2
groups:
  src: { tier: 0 }
  access: { tier: 1 }
  edge-far: { tier: 2 }
  edge-near: { tier: 2 }
nodes:
  src0: { group: src, class: router, ports: [] }
  src1: { group: src, class: router, ports: [] }
  acc0: { group: access, class: switch, ports: [] }
  acc1: { group: access, class: switch, ports: [] }
  acc2: { group: access, class: switch, ports: [] }
  acc3: { group: access, class: switch, ports: [] }
  acc4: { group: access, class: switch, ports: [] }
  acc5: { group: access, class: switch, ports: [] }
  snk0: { group: edge-near, class: server, ports: [] }
  snk1: { group: edge-far, class: server, ports: [] }
links:
  - [src0, acc0]
  - [src1, acc1]
  - [src0, acc2]
  - [src1, acc3]
  - [src0, acc4]
  - [src1, acc5]
  - [acc0, snk1]
  - [acc1, snk0]
  - [acc2, snk0]
  - [acc3, snk1]
  - [acc4, snk0]
  - [acc5, snk0]
  - [src1, snk0]
