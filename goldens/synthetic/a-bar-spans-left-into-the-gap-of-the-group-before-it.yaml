# Expected: architecture ticket 19, reserved since architecture-2 ticket 73. A bar whose drop leaves stand far left of the bar's own box takes its span to the
# left, and 7d may move no other group; before ticket 73 the row group before the bar stood inside the band gap, and the final G9 `min-separation` finding
# reported it. The feed split of stage 5 now reserves the room: the leaves of `before` and of `bar` (the pair, above the anchor tier) stand apart, and the
# feeding side right of the split line moves 13.7 px right, so 7d's span leaves the band gap. G9 passes, canvas 432 to 439 px
# (test/pipeline/min-separation-writers.test.ts pins the fix). The general case stays open: a bar span that no feed split makes room for still meets G9.
# The filler label is short (`F1`, ticket 157): with the wider Verdana label
# the filler pushed leaf B to the right, the bar spanned no farther left than its own box, and the premise was lost.
# Source: architecture ticket 19 re-check.
portograph: 2
groups:
  before: { tier: 0, label: Before }
  bar: { tier: 0, shape: bar, label: Bar }
  filler: { tier: 1, label: Filler }
  leaf-a: { tier: 1, label: Leaf A }
  leaf-b: { tier: 1, label: Leaf B }
nodes:
  anchor: { group: before, class: router, label: Anchor }
  spine: { group: bar, label: Spine, ports: [{ name: p, side: bottom }, { name: q, side: bottom }] }
  f1: { group: filler, class: router, label: F1 }
  a: { group: leaf-a, class: router, label: Leaf A, ports: [{ name: p, side: top }] }
  b: { group: leaf-b, class: router, label: Leaf B, ports: [{ name: p, side: top }] }
links:
  - [spine.p, a.p]
  - [spine.q, b.p]
  - [anchor, f1]
