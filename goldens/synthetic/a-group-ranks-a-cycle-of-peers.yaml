# Expected: A cycle sw-sw-rt-rt (ranked-groups ticket 01). Four physical links close a ring: rt1-rt2,
# rt2-sw1, sw1-sw2 and sw2-rt1. Router 1 links to the tier above and is rank 0. The two routers share a
# class rank, and so do the two switches, so rt1-rt2 and sw1-sw2 are peer links for the layering; the
# ring therefore layers as two peer pairs, routers on rank 0 and switches on rank 1, and no path is
# lengthened by going round. All four links stay routed links; only the layering reads two as peers.
# Today the pipeline still draws the group as one row; ticket 02 reads the ranks.
# Test-only input owned by ranked-groups ticket 01; the derivation test reads the parsed document.
portograph: 2
groups:
  upstream: { tier: 0, label: Upstream }
  site: { tier: 1, label: Site }
nodes:
  isp: { group: upstream, class: provider, label: ISP }
  rt1: { group: site, class: router, label: Router 1 }
  rt2: { group: site, class: router, label: Router 2 }
  sw1: { group: site, class: switch, label: Switch 1 }
  sw2: { group: site, class: switch, label: Switch 2 }
links:
  - [isp, rt1]
  - [rt1, rt2]
  - [rt2, sw1]
  - [sw1, sw2]
  - [sw2, rt1]
