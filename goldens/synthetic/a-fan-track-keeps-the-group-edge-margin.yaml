# Expected: architecture-2 ticket 18. `s1.p` is a fan root of two links (to `c1` and to `c2.a`).
# `home` has two ranks (`s1` above `s0`), so its box is a frame. The branch to `c1` wants the x of
# `c1`'s port, which stands just outside the frame's left edge. Before the fix the track stood there and
# rose 7.4 px outside the frame edge, within the 10 px group edge clearance (ADR-0013): G6
# `segment-group-edge [link-2, home]`. A fan track stands strictly inside every box its branch
# leaves, or outside it one edge margin off its edges. Here the branch is alone on its side of the port,
# so it is the edge keeper: the junction moves out along the port's column past the frame's top margin
# (inside the rows the fan holds), link-3 turns right there, link-2 turns left and rises on `c1`'s
# column: one L each, no step. Every gate passes; 6 routed bends; no warning.
portograph: 2
groups:
  up: { tier: 2, label: "Up" }
  centre: { tier: 5, label: "Centre" }
  home: { tier: 6, label: "Home" }
  beside: { tier: 6, label: "Beside" }
nodes:
  u1: { group: up, class: tbr, label: "u1" }
  s0: { group: home, class: switch, label: "s0" }
  s1: { group: home, class: router, label: "s1", ports: [{ name: p, side: top }] }
  c1: { group: centre, class: rr, label: "c1" }
  c2: { group: centre, class: provider, label: "c2", ports: [{ name: a, side: bottom, order: 1 }, { name: b, side: bottom, order: 2 }] }
  b1: { group: beside, class: tbr, label: "b1" }
links:
  - [s0, s1]
  - [s1.p, c1]
  - [s1.p, c2.a]
  - [c2.b, b1]
