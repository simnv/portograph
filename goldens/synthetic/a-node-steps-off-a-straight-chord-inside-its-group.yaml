# Expected: A node with slack in its group steps along the row off a straight overlay chord (ticket 77).
# `src` (tier 0) syncs with `far` (tier 2). The title of `middle` (tier 1) is wider than its two nodes, so the box has slack.
# `ma` has a routed link to `p` and stands under it, so the group cannot move without bending that link. `mb` has no link: the
# chord from `src` to `far` would run over it where the row packs it, and placement moves `mb` alone, to the nearest x that clears
# the chord, inside the box the group already has. `hosts` (tier 3, four nodes) is the anchor tier.
# Test-only input owned by ranked-groups ticket 77; test/pipeline/chord-clear.test.ts reads the layout.
portograph: 2
groups:
  top: { tier: 0, label: Top }
  middle: { tier: 1, label: A group title much wider than its two nodes }
  targets: { tier: 2, label: Targets }
  hosts: { tier: 3, label: Hosts }
nodes:
  p: { group: top, class: server, label: Parent }
  src: { group: top, class: server, label: Source }
  ma: { group: middle, class: server, label: Middle A }
  mb: { group: middle, class: server, label: Middle B }
  far: { group: targets, class: server, label: Far }
  h1: { group: hosts, class: server, label: Host 1 }
  h2: { group: hosts, class: server, label: Host 2 }
  h3: { group: hosts, class: server, label: Host 3 }
  h4: { group: hosts, class: server, label: Host 4 }
links:
  - [p, ma]
  - [far, h1]
  - [far, h2]
  - [far, h3]
  - [far, h4]
  - [src, far, { class: sync }]
