# Expected: two links leave one port of a node in a parent group, and both end in its child group. The
# far end stands inside the parent's box by ancestry, so the parent is no group to leave: the shared run
# reserves no exit and the links are routed as before. Architecture ticket 13, review finding 1.
portograph: 2
groups:
  upstream: { tier: 0, label: Upstream }
  site: { tier: 1, label: Site }
  zone: { parent: site, label: Zone }
nodes:
  isp: { group: upstream, class: provider, label: ISP }
  gw: { group: site, class: router, label: Gateway, ports: [{ name: p, side: bottom }] }
  z1: { group: zone, class: switch, label: Zone 1 }
  z2: { group: zone, class: access, label: Zone 2 }
links:
  - [gw.p, z1]
  - [gw.p, z2]
  - [isp, gw]
