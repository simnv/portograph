# Expected (architecture-2 ticket 54, titles last): the titles of tiers 1, 3 and 4 are placed last and yield to the legs under them.
# None of the three finds a free span on its edge, so each stands at the centre with a halo and names the link whose leg crosses it in
# `crossedBy` (`t1` link-2, `t3` link-8, `t4` link-11). The row plan reads no title, so it declines no part as `leg-blocked`.
# The shape is `a-claim-lies-on-a-cover-edge` (three transit links, six tiers) with the titles of tiers 1, 3 and 4 made wider. G5 still fails, as on main.
# Before ticket 54 a title was nudged along its edge to clear the legs (ticket 62) and the group widened for them (ticket 66); these three titles were
# too wide, so the three links stayed with the router. The router tests that need a router-laid link now read
# `three-lateral-legs-stay-with-the-router`.
# Test-only input owned by ticket 62; test/pipeline/hard-legs-under-a-title.test.ts and test/pipeline/residual-parts.test.ts read it.
#
# Five links are authored `route: orthogonal` (ticket 162): as cross-frame chords they would cross the wide titles and leave no leg under them;
# the authored route keeps the legs the claim above is about.
#
# The rows keep their declared order (`layout.corridorRowOrder: false`, architecture-2 ticket 17): the claim above
# needs the crossings that order makes, and the corridor row order would remove them.
portograph: 2
layout: { corridorRowOrder: false }
groups:
  t0: { tier: 0, label: Tier 0 }
  t1: { tier: 1, label: Tier 1 east wing }
  t2: { tier: 2, label: Tier 2 }
  t3: { tier: 3, label: Tier 3 east wing }
  t4: { tier: 4, label: Tier 4 east wing }
  t5: { tier: 5, label: Tier 5 }
nodes:
  n0_0: { group: t0, class: router, label: N0_0, ports: [{ name: d0, side: bottom }] }
  n0_1: { group: t0, class: tbr, label: N0_1, ports: [{ name: d0, side: bottom }] }
  n0_2: { group: t0, class: rr, label: N0_2, ports: [{ name: d0, side: bottom }] }
  n1_0: { group: t1, class: tbr, label: N1_0, ports: [{ name: u0, side: top }, { name: d0, side: bottom }] }
  n1_1: { group: t1, class: rr, label: N1_1, ports: [{ name: u0, side: top }, { name: d0, side: bottom }] }
  n1_2: { group: t1, class: provider, label: N1_2, ports: [{ name: u0, side: top }, { name: d0, side: bottom }] }
  n2_0: { group: t2, class: rr, label: N2_0, ports: [{ name: u0, side: top }, { name: d0, side: bottom }] }
  n2_1: { group: t2, class: provider, label: N2_1, ports: [{ name: u0, side: top }, { name: d0, side: bottom }] }
  n2_2: { group: t2, class: router, label: N2_2, ports: [{ name: u0, side: top }, { name: d0, side: bottom }] }
  n3_0: { group: t3, class: provider, label: N3_0, ports: [{ name: u0, side: top }, { name: d0, side: bottom }] }
  n3_1: { group: t3, class: router, label: N3_1, ports: [{ name: u0, side: top }, { name: d0, side: bottom }] }
  n3_2: { group: t3, class: tbr, label: N3_2, ports: [{ name: u0, side: top }, { name: d0, side: bottom }] }
  n4_0: { group: t4, class: router, label: N4_0, ports: [{ name: u0, side: top }, { name: d0, side: bottom }] }
  n4_1: { group: t4, class: tbr, label: N4_1, ports: [{ name: u0, side: top }, { name: d0, side: bottom }] }
  n4_2: { group: t4, class: rr, label: N4_2, ports: [{ name: u0, side: top }, { name: d0, side: bottom }] }
  n5_0: { group: t5, class: tbr, label: N5_0, ports: [{ name: u0, side: top }] }
  n5_1: { group: t5, class: rr, label: N5_1, ports: [{ name: u0, side: top }] }
  n5_2: { group: t5, class: provider, label: N5_2, ports: [{ name: u0, side: top }] }
links:
  - [n0_0.d0, n1_0.u0]
  - [n0_1.d0, n1_1.u0, { route: orthogonal }]
  - [n0_2.d0, n1_2.u0, { route: orthogonal }]
  - [n1_0.d0, n2_0.u0]
  - [n1_1.d0, n2_1.u0]
  - [n1_2.d0, n2_2.u0]
  - [n2_0.d0, n3_0.u0, { route: orthogonal }]
  - [n2_1.d0, n3_1.u0]
  - [n2_2.d0, n3_2.u0]
  - [n3_0.d0, n4_0.u0]
  - [n3_1.d0, n4_1.u0, { route: orthogonal }]
  - [n3_2.d0, n4_2.u0, { route: orthogonal }]
  - [n4_0.d0, n5_0.u0]
  - [n4_1.d0, n5_1.u0]
  - [n4_2.d0, n5_2.u0]
  - [n5_2, n0_0]
  - [n5_2, n2_0]
  - [n5_2, n3_0]
