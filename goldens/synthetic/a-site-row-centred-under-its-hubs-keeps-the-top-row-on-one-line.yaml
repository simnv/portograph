# Expected (dense-16x9 ticket 27): eight sites on tier 2 each link to both hubs of `core`, so they have the same parents and stand as one
# row unit, centred under the hubs. Before ticket 27, 7c centred each site alone in group order: the sites stood to the right of the hubs, the
# canvas was 1450 x 741 px with `leaves` on two lines (ticket 22), and 14 of the 28 routed links bent (28 bends). Now the centred unit makes the
# canvas 1262 x 828 px, the acceptance gate declines the two lines of `leaves` (one line stands nearer the aim), and no link bends.
# The arrangement was ticket 22's fixture before ticket 27; that fixture now alternates the sites' parents.
portograph: 2
groups:
  leaves: { tier: 0 }
  core: { tier: 1 }
  site-1: { tier: 2 }
