# Expected: The input of `an-allocated-run-starts-beyond-the-stem` with the link between the load balancer and the
# second server removed and a second link between the switch and the router added. The load balancer now has one
# port on its top side, so no foreign stem tip stands within one tip band of the port column, and the gap seats the
# run that arrives there (ranked-groups ticket 31, round 4: a port beside another port is walled by its neighbour's
# tip band and its run is left to the router). The port row lies closer than one stem to the gap, so the seated run
# ends on the stem tip, not at the gap boundary, and the router meets its checkpoint on the path (ticket 14, rule A).
# Test-only input owned by ranked-groups ticket 14; test/pipeline/allocated-run-beyond-stem.test.ts reads the layout.
portograph: 2
profile: network
groups:
  wan: { tier: 0 }
  site: { tier: 1 }
  zone: { parent: site }
nodes:
  provider: { group: wan, class: provider }
  router: { group: site, class: router }
  mid: { group: site, class: switch }
  a: { group: zone, class: load-balancer }
  b: { group: zone, class: ntp-stratum2 }
  c: { group: zone, class: ntp-stratum2 }
  d: { group: site, class: server }
  e: { group: site, class: server }
links:
  - [router, provider, { class: dashed }]
  - [router, mid, { class: physical, route: orthogonal }]
  - [router, c, { class: physical, route: orthogonal }]
  - [router, b, { class: physical, route: orthogonal }]
  - [c, a, { class: physical, route: orthogonal }]
  - [mid, a, { class: physical, route: orthogonal }]
  - [a, d, { class: physical, route: orthogonal }]
  - [b, e, { class: physical, route: orthogonal }]
  - [mid, router, { class: physical, route: orthogonal }]
