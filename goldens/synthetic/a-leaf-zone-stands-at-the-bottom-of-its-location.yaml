# Expected: a leaf child keeps its depth ranks beside its parent's members (ranked-groups tickets 19 and 28).
# Location `loc` has a chain of routers and switches (rt, sw, crt, sw2, srv) and a child group `zone` of two
# nodes, ntp and fw, hung from sw. Zone feeds no deeper member of the location, so it is a leaf child. Ticket 19
# put it after the location's last rank (ranks 5 and 6); ticket 28 keeps it at its depth ranks, 2 and 3, and
# the location's own members of those ranks (crt, sw2) stand beside it, in the location's own cells of the same
# sub-tiers. Two overlay flow links join the zone's fw to the two-node client group in the tier below; both
# run straight (two points). The name of the file is the ticket 19 name.
# Test-only input owned by ranked-groups ticket 19; test/pipeline/leaf-zone.test.ts reads the layout.
portograph: 2
groups:
  upstream: { tier: 0, label: Upstream }
  loc: { tier: 1, label: Location }
  zone: { parent: loc, label: Zone }
  clients: { tier: 2, label: Clients }
nodes:
  feed: { group: upstream, class: router, label: Feed }
  rt: { group: loc, class: router, label: Router }
  sw: { group: loc, class: switch, label: Switch }
  crt: { group: loc, class: router, label: Core router }
  sw2: { group: loc, class: switch, label: Switch two }
  srv: { group: loc, class: server, label: Server }
  ntp: { group: zone, class: server, label: Time }
  fw: { group: zone, class: switch, label: Filter }
  k1: { group: clients, class: server, label: Client one }
  k2: { group: clients, class: server, label: Client two }
links:
  - [feed, rt]
  - [rt, sw]
  - [sw, ntp]
  - [ntp, fw]
  - [sw, crt]
  - [crt, sw2]
  - [sw2, srv]
  - [fw, k1, { route: overlay }]
  - [fw, k2, { route: overlay }]
