# Expected: a canton with no feed from above keeps its title on the top edge (canton-groups ticket 3, fixture 1 with
# the title on top). ADR-0011 counts no link port on either edge of `west`, so the tie keeps the top. The band is held
# by the sub-tier: the gap under `upstream` holds the frame margin, the band and a margin more. The member `site`
# has its own title on the same edge, in its own cell, and the two bands do not collide.
# Test-only input owned by canton-groups ticket 3; test/pipeline/canton-title.test.ts reads it.
portograph: 2
groups:
  west: { label: West }
  upstream: { tier: 0, label: Upstream }
  site: { tier: 1, canton: west, label: Site }
  clients: { tier: 2, canton: west, label: Clients }
nodes:
  isp: { group: upstream, class: provider, label: ISP }
  gw: { group: site, class: router, label: Gateway }
  srv: { group: site, class: server, label: Server }
  cl: { group: clients, class: server, label: Client }
links:
  - [gw, srv]
  - { from: srv, to: cl, class: flow }
