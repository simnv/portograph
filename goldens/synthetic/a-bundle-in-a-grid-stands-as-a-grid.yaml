# Expected: The farm stands as a 3 x 2 grid (S1 S4 S2 / S5 S6 S3) with the bundle inside it: S3 stands under S2 in one column,
# the bundle's members leave S2's bottom and enter S3's top, and they run straight across the row gap. Routed bent 0, turns 0,
# crossings 0, all gates pass, `GRID_BUNDLE_STACKED` once and no `GROUP_SHAPE_DECLINED`.
# A farm of six servers with shape grid, fed by one core. Two of the servers share a bundle of two links. The bundle's
# direction is decided in stage 2 (architecture ticket 23), before the rows are stacked, so the grid keeps the author's shape.
# Source: 10-bundle-in-a-grid.yaml. Test-only input owned by architecture tickets 15 and 23; test/pipeline/outside-lanes.test.ts and test/pipeline/grid-bundles.test.ts read it.
portograph: 2
profile: network
groups:
  top: { tier: 0, label: Core }
  farm: { tier: 1, shape: grid, label: Farm }
nodes:
  core: { group: top, class: router, label: Core }
  s1: { group: farm, class: server, label: S1 }
  s2: { group: farm, class: server, label: S2 }
  s3: { group: farm, class: server, label: S3 }
  s4: { group: farm, class: server, label: S4 }
  s5: { group: farm, class: server, label: S5 }
  s6: { group: farm, class: server, label: S6 }
links:
  - [core, s1]
  - [core, s4]
  - [s2, s3]
  - [s2, s3]
