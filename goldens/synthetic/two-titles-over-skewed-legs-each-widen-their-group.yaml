# Expected: two one-node groups, each with a title over skewed legs (tickets 66 and 71); the second copies the first beside it. Each title
# widens its own group for its legs, on its own pass outside the shared budget; a title that spends its allowance must not stop the next one.
# Test-only input owned by ticket 71; test/pipeline/leg-allowance-exhausted.test.ts reads it.
portograph: 2
groups:
  top: { tier: 0, label: Top }
  mid: { tier: 1, label: A rather long title for one router }
  low: { tier: 2, label: Low }
  side: { tier: 2, label: Side }
  top2: { tier: 0, label: Top two }
  mid2: { tier: 1, label: Another rather long title for one router }
  low2: { tier: 2, label: Low two }
  side2: { tier: 2, label: Side two }
nodes:
  a0: { group: top, class: router, label: A0 }
  a1: { group: top, class: router, label: A1 }
  a2: { group: top, class: router, label: A2 }
  m0: { group: mid, class: router, label: M0 }
  z0: { group: low, class: router, label: Z0 }
  z1: { group: low, class: router, label: Z1 }
  z2: { group: low, class: router, label: Z2 }
  s0: { group: side, class: router, label: S0 }
  s1: { group: side, class: router, label: S1 }
  b0: { group: top2, class: router, label: B0 }
  b1: { group: top2, class: router, label: B1 }
  b2: { group: top2, class: router, label: B2 }
  n0: { group: mid2, class: router, label: N0 }
  y0: { group: low2, class: router, label: Y0 }
  y1: { group: low2, class: router, label: Y1 }
  y2: { group: low2, class: router, label: Y2 }
  t0: { group: side2, class: router, label: T0 }
  t1: { group: side2, class: router, label: T1 }
links:
  - [a1, m0]
  - [a2, m0]
  - [m0, z1]
  - [m0, z2]
  - [b1, n0]
  - [b2, n0]
  - [n0, y1]
  - [n0, y2]
