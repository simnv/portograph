# Expected: past the cap the aspect aim 4:1 sets the gap between the 15 degree floor and the 34 degree demand (dense-16x9 ticket 04, slice 3).
# The outer members then leave the hub group by a side edge: each falls back alone ('edge'), the block stays flat and the others straight
# but for the members beside a fallback's stem ('leg').
portograph: 2
profile: network
layout: {aspect: "4:1"}
groups:
  core: {tier: 0}
  pair1: {tier: 1}
  pair2: {tier: 1}
  pair3: {tier: 1}
  pair4: {tier: 1}
  pair5: {tier: 1}
  pair6: {tier: 1}
  pair7: {tier: 1}
nodes:
  core-a: {group: core, class: router}
  core-b: {group: core, class: router}
  node1a: {group: pair1, class: router, size: {width: 300, height: 0}}
  node1b: {group: pair1, class: router, size: {width: 300, height: 0}}
  node2a: {group: pair2, class: router, size: {width: 300, height: 0}}
  node2b: {group: pair2, class: router, size: {width: 300, height: 0}}
  node3a: {group: pair3, class: router, size: {width: 300, height: 0}}
  node3b: {group: pair3, class: router, size: {width: 300, height: 0}}
  node4a: {group: pair4, class: router, size: {width: 300, height: 0}}
  node4b: {group: pair4, class: router, size: {width: 300, height: 0}}
  node5a: {group: pair5, class: router, size: {width: 300, height: 0}}
  node5b: {group: pair5, class: router, size: {width: 300, height: 0}}
  node6a: {group: pair6, class: router, size: {width: 300, height: 0}}
  node6b: {group: pair6, class: router, size: {width: 300, height: 0}}
  node7a: {group: pair7, class: router, size: {width: 300, height: 0}}
  node7b: {group: pair7, class: router, size: {width: 300, height: 0}}
links:
  - [core-a, node1a]
  - [core-a, node2a]
  - [core-a, node3a]
  - [core-a, node4a]
  - [core-a, node5a]
  - [core-a, node6a]
  - [core-a, node7a]
  - [core-b, node1b]
  - [core-b, node2b]
  - [core-b, node3b]
  - [core-b, node4b]
  - [core-b, node5b]
  - [core-b, node6b]
  - [core-b, node7b]
