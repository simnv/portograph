# Expected: dense-16x9 ticket 42, an aspect choice reads the sheet it is judged by. Two components: the fan of ranked-groups ticket 89 (two
# cores link to the same four edges, a spare router keeps the cores from being a complete block) and a 2x7 flat solid block (`hub` over seven
# pairs, past the 600 px cap), with the aim 3:1. The first flat-gap choice reads the sheet on the first placement, where the tier gap under
# the cores is 111 px; then the fan round spreads the core ports, that gap drops to 60 px, and the sheet is 51 px lower.
# The final choice reads the published sheet (`canvasExtent`: the canvas with the legend and the margin) and places once more:
# `FLAT_BLOCK_GAP_FINAL`, the flat gap 896 -> 947 px, and the sheet stands at 5016 x 1672 px, W / 3 exactly. On main d664bc10 the sheet was
# 5016 x 1670.5 px with no final choice. Every link is straight. Test `test/pipeline/flat-gap-final.test.ts`.
