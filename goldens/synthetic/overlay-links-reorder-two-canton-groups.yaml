# Expected: canton-groups ticket 57, fixture 2, the swap. The shape of `overlay-links-reorder-two-locations` (ranked-groups ticket 06b) with
# cantons in place of locations. Three cantons `ca`, `cb` and `cc` stand under one feed group; each holds a site on tier 1 and a lab on tier 2.
# The feed group has the most nodes, so tier 0 is the anchor tier. Every routed link is a feed from `hub` to a site or a link inside a canton, so
# no order makes two routed links cross. `cb` is joined to `ca` and to `cc` by overlay links between the labs, and ELK stands it between them; the two
# sync links join the lab of `ca` to the lab of `cc`, and the lab of `cb` is in the way. `cb` also has an overlay link to `ntp1`, the left end of the
# feed row, so the mean of the partners of its members is the smallest of the three (the labs share a sub-tier, so their links leave the key out).
# A canton moves as one unit: `cb` goes to the left end, `ca` and `cc` stand side by side, and the two sync links are one straight segment.
# Test-only input owned by canton-groups ticket 57; test/pipeline/canton-order.test.ts reads the layout.
portograph: 2
groups:
  ca: { label: Canton A }
  cb: { label: Canton B }
  cc: { label: Canton C }
  feed: { tier: 0, label: Feed }
  a-site: { tier: 1, canton: ca, label: Site A }
  a-lab: { tier: 2, canton: ca, label: Lab A }
  b-site: { tier: 1, canton: cb, label: Site B }
  b-lab: { tier: 2, canton: cb, label: Lab B }
  c-site: { tier: 1, canton: cc, label: Site C }
  c-lab: { tier: 2, canton: cc, label: Lab C }
nodes:
  ntp1: { group: feed, class: server, label: NTP one }
  ntp2: { group: feed, class: server, label: NTP two }
  hub: { group: feed, class: router, label: Hub }
  ntp3: { group: feed, class: server, label: NTP three }
  ntp4: { group: feed, class: server, label: NTP four }
  a-core: { group: a-site, class: router, label: A core }
  a-sync: { group: a-lab, class: switch, label: A sync }
  b-core: { group: b-site, class: router, label: B core }
  b-edge: { group: b-lab, class: switch, label: B edge }
  c-core: { group: c-site, class: router, label: C core }
  c-sync: { group: c-lab, class: switch, label: C sync }
links:
  - [ntp1, b-core, { route: overlay }]
  - [hub, a-core]
  - [hub, b-core]
  - [hub, c-core]
  - [a-core, a-sync]
  - [b-core, b-edge]
  - [c-core, c-sync]
  - [b-edge, a-sync, { route: overlay }]
  - [b-edge, c-sync, { route: overlay }]
  - [a-sync, c-sync, { route: overlay }]
  - [a-sync, c-sync, { route: overlay }]
