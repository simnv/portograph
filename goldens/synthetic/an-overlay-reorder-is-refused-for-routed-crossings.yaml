# Expected: ranked-groups ticket 06, refusal. In tier 1 `g10` stands left of `g11`. The overlay link
# from `n2` (the right end of the row above) to `n3` pulls `g10` to the right, so the barycentre
# order puts `g11` first. That swap would cross the routed links `n0` to `n4` and `n3` to `n7`, so the
# routed count of the two regions that touch tier 1 would rise from 0 to 1. The re-order is refused,
# ELK's order stands, and one OVERLAY_ORDER_REFUSED warning names tier 1.
# Known fault, not of this rule: gate G6 (`segment-group-edge`) fails here with the rule off too; the routed n0 to n4 runs along a group edge.
portograph: 2
groups:
  g00: { tier: 0, label: Row above }
  g10: { tier: 1, label: Left group }
  g11: { tier: 1, label: Right group }
  g20: { tier: 2, label: Row below }
nodes:
  n0: { group: g00, class: server, label: n0 }
  n1: { group: g00, class: server, label: n1 }
  n2: { group: g00, class: server, label: n2 }
  n3: { group: g10, class: server, label: n3 }
  n4: { group: g11, class: server, label: n4 }
  n5: { group: g11, class: server, label: n5 }
  n7: { group: g20, class: server, label: n7 }
  n8: { group: g20, class: server, label: n8 }
links:
  - [n0, n4]
  - [n3, n7]
  - [n5, n8]
  - [n2, n3, { route: overlay }]
