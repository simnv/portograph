  loc-a1: { tier: 2, canton: a, label: Location A1 }
  zone-a1: { parent: loc-a1, label: Zone A1 }
  loc-a2: { tier: 2, canton: a, label: Location A2 }
  zone-a2: { parent: loc-a2, label: Zone A2 }
