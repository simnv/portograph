# Expected: a close-up that is tried and put back leaves the layout whole (ranked-groups ticket 65, label geometry), with card nodes.
# Snack-theme ticket 159 re-forged a-refused-close-up-keeps-the-node-labels-in-order.yaml for the card content of the network profile:
# with card nodes (11 px titles, 32 px of tile and gap) no close-up of that input is refused any more, so it no longer exercises the
# undo. This copy has the same groups, nodes and links; only the client and server titles are short ("Client A3.1" is "CA3.1",
# "Server A1.1" is "SA1.1"). Measured with the orthogonal links of the test: the close-up is refused 29 times of 38 and the run publishes
# with no error and no centring finding. Expected: the layout is produced, the close-up is refused at least once in the run (read on the
# verdict of `closeUp`), the node labels stand in node order and a second pass moves nothing.
# Test-only input owned by snack-theme ticket 159; test/pipeline/canton-close-up.test.ts reads the layout.
# Card nodes (`layout.nodeContent: card`, snack-theme ticket 159): the premise was forged on the card geometry; a stacked document is narrower.
portograph: 2
layout: { nodeContent: card }
groups:
