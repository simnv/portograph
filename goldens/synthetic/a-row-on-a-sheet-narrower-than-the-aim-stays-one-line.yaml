# Expected (ADR-0025, dense-16x9 ticket 03): the aim is 16:9 and this sheet states none.
# One switch feeds five servers. One line is 400 x 234 px, narrower than 16:9 (1.71), so stage 5 tries no two lines: `leaves` stays one line,
# `groupArrangements` records it `row` with the reason `aspect: the sheet is ... not wider than the aim 1.778`, and no `staggerRows` exists.
# All 5 links are straight, crossings 0, bends 0, G1-G9 pass. Under `layout: { aspect: "1:1" }` the same sheet stands on two lines
# (`a-document-aspect-overrides-the-aim`).
portograph: 2
groups:
  feeds: { tier: 0 }
  leaves: { tier: 1 }
nodes:
  p: { group: feeds, class: switch }
  n1: { group: leaves, class: server }
  n2: { group: leaves, class: server }
  n3: { group: leaves, class: server }
  n4: { group: leaves, class: server }
  n5: { group: leaves, class: server }
links:
  - [p, n1]
  - [p, n2]
  - [p, n3]
  - [p, n4]
  - [p, n5]
