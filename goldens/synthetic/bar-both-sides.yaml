# Expected: Place bar ports on top and bottom for feeds from both directions, mirror the drops, and report crossings of intervening bars.
portograph: 2
profile: network
groups:
  upper: { tier: 0 }
  bars: { tier: 1, shape: bar }
  lower: { tier: 2 }
nodes:
  above: { group: upper, ports: { side: bottom, list: [p, p] } }
  first:
    group: bars
    ports: [{ name: p, side: top }, { name: p, side: bottom }]
  second:
    group: bars
    ports: [{ name: p, side: top }, { name: p, side: bottom }]
  below: { group: lower, ports: { side: top, list: [p, p] } }
links:
  - [above.p#1, first.p#1]
  - [above.p#2, second.p#1]
  - [below.p#1, first.p#2]
  - [below.p#2, second.p#2]
