# Expected: ranked-groups ticket 15, a frame gap never drops below the band gap. Three two-rank locations A, B and C
# stand in tier 1 under one feed group, each with a zone whose title is wider than the zone's one node. Since
# architecture-2 ticket 54 stage 5 sizes each zone cell for its title (its width floor) and 7f widens no cell for a
# title; the frames stand a band gap apart. Before, 7f widened a zone cell to hold its title and moved the cells
# after it, but a frame box is wider than its cells, so before ranked-groups ticket 15 the frames of A and C stood
# 48.7 px inside each other here. With the course trial on, link-4 takes a course round the outside (its chord
# would enter C by the side edge) and C stands under the course, 134 px after A; test/pipeline/frame-columns.test.ts
# reads the push with no course.
# The overlay link to `ntp1` and the two sync links between A and C put B at the left end and A beside C.
# Test-only input owned by ranked-groups ticket 15; test/pipeline/frame-columns.test.ts reads the layout.
portograph: 2
groups:
  feed: { tier: 0, label: Feed }
  a: { tier: 1, label: Site A }
  a-zone: { parent: a, label: Zone A of the west site }
  b: { tier: 1, label: Site B }
  b-zone: { parent: b, label: Zone B of the middle site }
  c: { tier: 1, label: Site C }
  c-zone: { parent: c, label: Zone C of the east site }
nodes:
  ntp1: { group: feed, class: server, label: NTP one }
  ntp2: { group: feed, class: server, label: NTP two }
  ntp3: { group: feed, class: server, label: NTP three }
  ntp4: { group: feed, class: server, label: NTP four }
  hub: { group: feed, class: router, label: Hub }
  a-core: { group: a, class: router, label: A core }
  a-sync1: { group: a-zone, class: switch, label: A sync }
  b-core: { group: b, class: router, label: B core }
  b-edge: { group: b-zone, class: switch, label: B edge }
  c-core: { group: c, class: router, label: C core }
  c-sync1: { group: c-zone, class: switch, label: C sync }
links:
  - [ntp1, b-edge, { route: overlay }]
  - [hub, a-core]
  - [hub, b-core]
  - [hub, c-core]
  - [a-core, a-sync1]
  - [b-core, b-edge]
  - [c-core, c-sync1]
  - [a-sync1, c-sync1, { route: overlay }]
  - [a-sync1, c-sync1, { route: overlay }]
