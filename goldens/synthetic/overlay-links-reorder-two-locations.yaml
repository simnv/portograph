# Expected: ranked-groups ticket 06b, frames take part in the overlay-weighted order. Three two-rank
# locations A, B and C stand in tier 1 under one feed group; the feed group has the most nodes, so
# tier 0 is the anchor tier and the locations are ordered. The routed feeds do not care about the
# order: one node (`hub`) feeds the first rank of each location, so no order makes them cross.
# ELK stands B between A and C, because B has a routed link to the second rank of each. The sync
# links join the second rank of A to the second rank of C (two of them), and there B's body is in the
# way. B also has an overlay link to `ntp1`, the left end of the feed row, so the mean of its
# partners is the smallest of the three; A and C have the same mean (the hub) and keep ELK's order.
# A frame moves as one column: B goes to the left end, A and C stand side by side, and the two sync
# links are one straight segment each.
# Test-only input owned by ranked-groups ticket 06b; test/pipeline/overlay-frame-order.test.ts reads the layout.
portograph: 2
groups:
  feed: { tier: 0, label: Feed }
  a: { tier: 1, label: Site A }
  a-zone: { parent: a, label: Zone A }
  b: { tier: 1, label: Site B }
  b-zone: { parent: b, label: Zone B }
  c: { tier: 1, label: Site C }
  c-zone: { parent: c, label: Zone C }
nodes:
  ntp1: { group: feed, class: server, label: NTP one }
  ntp2: { group: feed, class: server, label: NTP two }
  ntp3: { group: feed, class: server, label: NTP three }
  ntp4: { group: feed, class: server, label: NTP four }
  hub: { group: feed, class: router, label: Hub }
  a-core: { group: a, class: router, label: A core }
  a-sync1: { group: a-zone, class: switch, label: A sync }
  b-core: { group: b, class: router, label: B core }
  b-edge: { group: b-zone, class: switch, label: B edge }
  c-core: { group: c, class: router, label: C core }
  c-sync1: { group: c-zone, class: switch, label: C sync }
links:
  - [ntp1, b-edge, { route: overlay }]
  - [hub, a-core]
  - [hub, b-core]
  - [hub, c-core]
  - [a-core, a-sync1]
  - [b-core, b-edge]
  - [c-core, c-sync1]
  - [b-edge, a-sync1]
  - [b-edge, c-sync1]
  - [a-sync1, c-sync1, { route: overlay }]
  - [a-sync1, c-sync1, { route: overlay }]
