# Expected: Rank `a` into the last row, because its links leave the group downward to the bar, and
# seat it at the left cell of that row, because it is the left flank's stored primary peer. The
# reserved drop then meets no node body. Rank `b` into the first row, because its link leaves
# upward, so the grid holds a head row and a tail row at once. Leave the flank and the bar to their
# own rules, and keep every group box clear of the others.
portograph: 2
profile: network
groups:
  upper: { tier: 0 }
  place: { tier: 1, shape: grid }
  side: { align: left, of: place }
  rails: { tier: 2, shape: bar }
nodes:
  head: { group: upper, ports: [{ name: p, side: bottom }] }
  s1: { group: side, ports: [{ name: p, side: right }] }
  a: { group: place, ports: [{ name: p, side: left }, { name: r, side: bottom }] }
  b: { group: place, ports: [{ name: q, side: top }] }
  c: { group: place }
  d: { group: place }
  e: { group: place }
  rail: { group: rails, ports: [{ name: p, side: top }] }
links:
  - [head.p, b.q]
  - [s1.p, a.p]
  - [a.r, rail.p]
