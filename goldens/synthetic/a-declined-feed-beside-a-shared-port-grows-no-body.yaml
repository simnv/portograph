# Expected: The shared-port control of a-declined-feed-grows-no-body (architecture-2 ticket 14). rA feeds three ports
# of n1 from one port: the first child port by x owns the vertical and the other two fan (CENTRE_FAN_REMAINDER).
# Today: n1 ends 262.5 px wide; a1 stands under rA's port.
# Wanted: a1 stands under rA's port and n1 keeps the 90 px its four ports need.
# Status: ticket 14 is open. The "Wanted" line is the rule; the "Today" line is what main does. The test marks the
# wanted assertions `it.fails` until the rule lands.
# Test-only input owned by architecture-2 ticket 14; test/pipeline/declined-feed-growth.test.ts runs the whole pipeline on it.
portograph: 2
profile: network
groups:
  top: {tier: 0, label: Top}
  low: {tier: 1, label: Low}
nodes:
  rA: {group: top, class: router, label: RA, ports: [{name: p, side: bottom}]}
  f1: {group: top, label: F1}
  f2: {group: top, label: F2}
  rB: {group: top, class: router, label: RB, ports: [{name: q, side: bottom}]}
  n1: {group: low, label: N1, ports: [{name: a1, side: top}, {name: a2, side: top}, {name: a3, side: top}, {name: b, side: top}]}
  s1: {group: low, label: S1}
links:
- [rA.p, n1.a1]
- [rA.p, n1.a2]
- [rA.p, n1.a3]
- [rB.q, n1.b]
- [f1, s1]
