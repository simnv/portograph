# Expected: six planned parts across the tier gap and one link, r0 to the left port of s3, whose lateral port the plan does not own
# (residual, reason lateral-port, TIER_GAP_PART_RESIDUAL). The router lays it among the reserved covers; the diagram publishes
# and removes nothing.
# Test-only input owned by ranked-groups ticket 51; test/pipeline/residual-parts.test.ts reads the placed and the routed model.
portograph: 2
groups:
  src: { tier: 0 }
  access: { tier: 1 }
nodes:
  r0: { group: src, class: router, ports: [] }
  r1: { group: src, class: router, ports: [] }
  r2: { group: src, class: router, ports: [] }
  r3: { group: src, class: router, ports: [] }
  s0: { group: access, class: switch, ports: [] }
  s1: { group: access, class: switch, ports: [] }
  s2: { group: access, class: switch, ports: [] }
  s3: { group: access, class: switch, ports: [{ name: w, side: left }] }
links:
  - [r0, s1]
  - [r1, s0]
  - [r1, s3]
  - [r2, s2]
  - [r2, s0]
  - [r3, s1]
  - [r0, s3.w]
