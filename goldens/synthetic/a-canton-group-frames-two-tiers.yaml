# Expected: A canton frames its members (canton-groups ticket 2, fixture 1). The canton frame contains both member
# frames plus 20 px, and the client group's axis is the site's. Three tiers: `upstream` (tier 0, outside the canton),
# then the canton `west` whose members are `site` (tier 1, two ranks) and `clients` (tier 2, one node, so a one-cell
# frame). The gateway of `site` links up to the ISP and down to the server; one flow link joins the server to the client.
# Test-only input owned by canton-groups tickets 1 and 2; test/parse/canton.test.ts and test/pipeline/canton-frames.test.ts read it.
portograph: 2
groups:
  west: { label: West }
  upstream: { tier: 0, label: Upstream }
  site: { tier: 1, canton: west, label: Site }
  clients: { tier: 2, canton: west, label: Clients }
nodes:
  isp: { group: upstream, class: provider, label: ISP }
  gw: { group: site, class: router, label: Gateway }
  srv: { group: site, class: server, label: Server }
  cl: { group: clients, class: server, label: Client }
links:
  - [isp, gw]
  - [gw, srv]
  - { from: srv, to: cl, class: flow }
