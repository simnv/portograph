# apart on tier 1, and the provider stands on tier 2 nearer the east one. The west router's link would be a chord from its bottom face to the provider's
# right face: at least twice the larger body long, and leaving the bottom face 80 degrees or more from its normal (`PERPENDICULAR_FLAT_ANGLE`). It is
# drawn as an orthogonal L with one bend into the right face instead. The east router's link joins a bottom face to a top face and stays a chord.
