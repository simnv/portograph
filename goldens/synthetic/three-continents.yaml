  - [loc-b-gw, loc-b-sw]
  - [loc-c-gw, loc-c-sw]
  - { from: t1-2, to: loc-a1-gw, class: sync }
  - { from: t1-2, to: loc-a2-gw, class: sync }
  - { from: t1-2, to: loc-b-gw, class: sync }
  - { from: t1-2, to: loc-c-gw, class: sync }
  - { from: t2-2, to: loc-a1-gw, class: sync }
  - { from: t2-2, to: loc-a2-gw, class: sync }
  - { from: t2-2, to: loc-b-gw, class: sync }
  - { from: t2-2, to: loc-c-gw, class: sync }
  - { from: t3-2, to: loc-a1-gw, class: sync }
  - { from: t3-2, to: loc-a2-gw, class: sync }
  - { from: t3-2, to: loc-b-gw, class: sync }
  - { from: t3-2, to: loc-c-gw, class: sync }
  - [loc-a1-sw, zone-a1-1]
  - [zone-a1-1, zone-a1-2]
  - [loc-a2-sw, zone-a2-1]
  - [zone-a2-1, zone-a2-2]
  - { from: loc-a1-sw, to: cl-a3-1, class: flow }
  - { from: loc-a2-sw, to: cl-a3-2, class: flow }
  - { from: loc-a1-sw, to: cl-a3-3, class: flow }
  - { from: loc-a1-sw, to: cl-a4-1, class: flow }
  - { from: loc-a2-sw, to: cl-a4-2, class: flow }
  - { from: loc-b-sw, to: cl-b3-1, class: flow }
  - { from: loc-b-sw, to: cl-b3-2, class: flow }
  - { from: loc-b-sw, to: cl-b4-1, class: flow }
  - { from: loc-c-sw, to: cl-c3-1, class: flow }
  - { from: loc-c-sw, to: cl-c3-2, class: flow }
  - { from: loc-c-sw, to: cl-c3-3, class: flow }
  - { from: loc-c-sw, to: cl-c4-1, class: flow }
  - { from: loc-a1-sw, to: cl-b3-1, class: flow }
  - { from: loc-b-sw, to: cl-c3-1, class: flow }
  - { from: loc-c-sw, to: cl-a4-1, class: flow }
  - { from: loc-a2-sw, to: cl-c4-1, class: flow }
