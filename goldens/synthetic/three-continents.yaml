  - [t1-1, m1]
  - [t2-1, m2]
  - [t3-1, m3]
  - [m1, loc-a1-gw]
  - [m2, loc-a2-gw]
  - [m3, loc-b-gw]
  - [m1, loc-c-gw]
  - [loc-a1-gw, loc-a1-sw]
