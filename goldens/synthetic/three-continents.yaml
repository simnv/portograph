# Expected: three cantons stand a band gap apart and the top row keeps its spacing (canton-groups ticket 58, fixture 10).
# Three top locations (tier 0) and an MPLS row (tier 1) stand outside every canton. Canton `a` holds two locations with a zone
# each (tier 2), canton `b` and canton `c` hold one location each (tier 2); every canton holds client groups on tiers 3 and 4,
# fed by flow links from its own locations. Four flow links cross cantons. Sync links join the top locations to every
# tier-2 location. The three canton frames stand a band gap apart, every client group stands inside its own canton frame, and
# the top row keeps its spacing against the same input without the `canton:` keys (it shifts as a whole; see ticket 58).
# Test-only input owned by canton-groups ticket 58; test/pipeline/three-continents.test.ts reads it.
portograph: 2
groups:
  a: { label: Canton A }
  b: { label: Canton B }
  c: { label: Canton C }
  top-1: { tier: 0, label: Top location 1 }
  top-2: { tier: 0, label: Top location 2 }
  top-3: { tier: 0, label: Top location 3 }
  mpls: { tier: 1, label: MPLS }
  loc-a1: { tier: 2, canton: a, label: Location A1 }
  zone-a1: { parent: loc-a1, label: Zone A1 }
  loc-a2: { tier: 2, canton: a, label: Location A2 }
  zone-a2: { parent: loc-a2, label: Zone A2 }
  loc-b: { tier: 2, canton: b, label: Location B }
  loc-c: { tier: 2, canton: c, label: Location C }
  cl-a3: { tier: 3, canton: a, label: Clients A3 }
  cl-a4: { tier: 4, canton: a, label: Clients A4 }
  cl-b3: { tier: 3, canton: b, label: Clients B3 }
  cl-b4: { tier: 4, canton: b, label: Clients B4 }
  cl-c3: { tier: 3, canton: c, label: Clients C3 }
  cl-c4: { tier: 4, canton: c, label: Clients C4 }
nodes:
  t1-1: { group: top-1, class: router, label: Top 1.1 }
  t1-2: { group: top-1, class: router, label: Top 1.2 }
  t1-3: { group: top-1, class: server, label: Top 1.3 }
  t1-4: { group: top-1, class: server, label: Top 1.4 }
  t2-1: { group: top-2, class: router, label: Top 2.1 }
  t2-2: { group: top-2, class: router, label: Top 2.2 }
  t2-3: { group: top-2, class: server, label: Top 2.3 }
  t3-1: { group: top-3, class: router, label: Top 3.1 }
  t3-2: { group: top-3, class: router, label: Top 3.2 }
  t3-3: { group: top-3, class: server, label: Top 3.3 }
  m1: { group: mpls, class: provider, label: MPLS 1 }
  m2: { group: mpls, class: provider, label: MPLS 2 }
  m3: { group: mpls, class: provider, label: MPLS 3 }
  loc-a1-gw: { group: loc-a1, class: router, label: Gateway A1 }
  loc-a1-sw: { group: loc-a1, class: switch, label: Switch A1 }
  zone-a1-1: { group: zone-a1, class: server, label: Zone A1 one }
  zone-a1-2: { group: zone-a1, class: server, label: Zone A1 two }
  loc-a2-gw: { group: loc-a2, class: router, label: Gateway A2 }
  loc-a2-sw: { group: loc-a2, class: switch, label: Switch A2 }
  zone-a2-1: { group: zone-a2, class: server, label: Zone A2 one }
  zone-a2-2: { group: zone-a2, class: server, label: Zone A2 two }
  loc-b-gw: { group: loc-b, class: router, label: Gateway B }
  loc-b-sw: { group: loc-b, class: switch, label: Switch B }
  loc-c-gw: { group: loc-c, class: router, label: Gateway C }
  loc-c-sw: { group: loc-c, class: switch, label: Switch C }
  cl-a3-1: { group: cl-a3, class: server, label: Client A3.1 }
  cl-a3-2: { group: cl-a3, class: server, label: Client A3.2 }
  cl-a3-3: { group: cl-a3, class: server, label: Client A3.3 }
  cl-a4-1: { group: cl-a4, class: server, label: Client A4.1 }
  cl-a4-2: { group: cl-a4, class: server, label: Client A4.2 }
  cl-b3-1: { group: cl-b3, class: server, label: Client B3.1 }
  cl-b3-2: { group: cl-b3, class: server, label: Client B3.2 }
  cl-b4-1: { group: cl-b4, class: server, label: Client B4.1 }
  cl-c3-1: { group: cl-c3, class: server, label: Client C3.1 }
  cl-c3-2: { group: cl-c3, class: server, label: Client C3.2 }
  cl-c3-3: { group: cl-c3, class: server, label: Client C3.3 }
  cl-c4-1: { group: cl-c4, class: server, label: Client C4.1 }
