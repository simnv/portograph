# Expected: a canton titled at the bottom pushes the tier below it (canton-groups ticket 3, fixture 7). The canton
# `west` is fed from above (its gateway links up to the ISP), so ADR-0011 puts its title on the bottom edge. The
# band is held by the sub-tier: the gap to the `edge` group below holds the frame margin, the band and a margin more.
# Test-only input owned by canton-groups ticket 3; test/pipeline/canton-title.test.ts reads it.
portograph: 2
groups:
  west: { label: West }
  upstream: { tier: 0, label: Upstream }
  site: { tier: 1, canton: west, label: Site }
  clients: { tier: 2, canton: west, label: Clients }
  edge: { tier: 3, label: Edge }
nodes:
  isp: { group: upstream, class: provider, label: ISP }
  gw: { group: site, class: router, label: Gateway }
  srv: { group: site, class: server, label: Server }
  cl: { group: clients, class: server, label: Client }
  fw: { group: edge, class: router, label: Firewall }
links:
  - [isp, gw]
  - [gw, srv]
  - { from: srv, to: cl, class: flow }
  - { from: cl, to: fw, class: flow }
