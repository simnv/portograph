# Expected: a chord through its own title band reserves the title room (architecture-2 ticket 35, part 2). One router on tier 1 feeds
# `provider-1` and `provider-3` of a provider row on tier 2, whose title stands on the top edge; `provider-2` sits between them, so the two
# feeds are slanted and both cross the title band. At the decision the row is narrower than its title beside either crossing. Main refused
# both chords (`ROUTED_CHORD_REFUSED` with `title`) and drew two orthogonal links with 2 bends each. Now the verdict proves that the title
# host can widen by the shortfall (the lane-feasible widening `planLabels` makes in 7f), and that the chord costs no more than its lean
# over the fallback leg; 7f reserves that widening (`reserveChordTitleRoom`) before the titles are planned. Both links draw straight,
# the title stands right of both crossings with its 8 px margin, routed bent 0, and every gate passes.
# Test-only input owned by architecture-2 ticket 35; test/pipeline/one-gap-span.test.ts reads it.
portograph: 2
profile: network
groups:
  upstream: { tier: 1, label: Upstream }
  providers: { tier: 2, label: Providers of the shared transit }
  lower: { tier: 3, label: Lower }
nodes:
  upstream-core: { group: upstream, class: router, label: Upstream core router }
  upstream-router: { group: upstream, class: router, label: Upstream router }
  provider-1: { group: providers, class: provider, label: Provider 1 }
  provider-2: { group: providers, class: provider, label: Provider 2 }
  provider-3: { group: providers, class: provider, label: Provider 3 }
  lower-router: { group: lower, class: router, label: Lower router }
links:
  - [upstream-core, upstream-router]
  - [upstream-router, provider-1, { class: dashed }]
  - [upstream-router, provider-3, { class: dashed }]
  - [provider-1, lower-router, { class: dashed }]
  - [provider-2, lower-router, { class: dashed }]
  - [provider-3, lower-router, { class: dashed }]
