# Expected: Six routers in three sibling groups of tier 0 each link to one of two providers in tier 1,
# e1, m1 and w1 to p1 and e2, m2 and w2 to p2. The links that end at one provider share an ownership
# batch, and the router splits that batch into parts by the completed runs each link may cross. The
# parts are routed in order, so the order is a reservation like the batch order: a part leaves the
# outward stems of the links of the parts after it alone, as it leaves those of later batches
# (ranked-groups ticket 14, rule B). Without it, a completed run of an earlier part can stand beside a
# later part's stem tip and close the pocket its checkpoint is in. The links of one part still share
# one request, so batchmates that must cross a sibling's stem may (ticket 22).
# Test-only input owned by ranked-groups ticket 14; test/pipeline/later-part-stem.test.ts reads the request stream.
portograph: 2
groups:
  east: { tier: 0, label: "East" }
  mid: { tier: 0, label: "Middle" }
  west: { tier: 0, label: "West" }
  wan: { tier: 1, label: "Wan" }
nodes:
  e1: { group: east, class: router, label: "e1" }
  e2: { group: east, class: router, label: "e2" }
  m1: { group: mid, class: router, label: "m1" }
  m2: { group: mid, class: router, label: "m2" }
  w1: { group: west, class: router, label: "w1" }
  w2: { group: west, class: router, label: "w2" }
  p1: { group: wan, class: provider, label: "p1" }
  p2: { group: wan, class: provider, label: "p2" }
links:
  - [e1, p1]
  - [e2, p2]
  - [m1, p1]
  - [m2, p2]
  - [w1, p1]
  - [w2, p2]
