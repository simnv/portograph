# Expected (dense-16x9 ticket 36, ruling B, scope V): a decline is a fact of the placement the command keeps, not of a placement it compares.
# The sheet of ranked-groups ticket 28 with moveBeforeGrow. A placement the command compares (the first run, before its room rounds) withdraws
# the seat set of loc#2 at centre: its row is the anchor tier of that placement. That placement only carries its seatSetDeclined entry; the
# placement the command keeps decides the set again on its own geometry, and it stands. zone#4, which the kept placement's 7f withdraws,
# is declined at the baseline and placed once more without its set. No seatSet for a declined row, every withdrawal named, the restore passes.
# Test-only input owned by dense-16x9 ticket 36; test/layout/seat-set.test.ts reads the layout.
portograph: 2
layout: { moveBeforeGrow: true }
groups:
  upstream: { tier: 0, label: Upstream }
  loc: { tier: 1, label: Location }
  far: { tier: 1, label: Far site }
  zone: { parent: loc, label: Zone }
nodes:
  feed: { group: upstream, class: router, label: Feed }
  fr: { group: far, class: router, label: Far router }
  f1: { group: far, class: server, label: Far time server }
  f2: { group: far, class: switch, label: Far traffic filter }
  c0: { group: loc, class: router, label: Core }
  c1: { group: loc, class: switch, label: Distribution }
  s0: { group: loc, class: switch, label: Switch one }
  s1: { group: loc, class: switch, label: Switch two }
  s2: { group: loc, class: switch, label: Switch three }
  s3: { group: loc, class: switch, label: Switch four }
  s4: { group: loc, class: switch, label: Switch five }
  s5: { group: loc, class: switch, label: Switch six }
  p4: { group: loc, class: server, label: Primary time server }
  z4: { group: zone, class: server, label: Zone time server }
  z5: { group: zone, class: switch, label: Zone traffic filter }
links:
  - [feed, c0]
  - [feed, fr]
  - [fr, f1]
  - [f1, f2]
  - [c0, c1]
  - [c1, s0]
  - [c1, s1]
  - [c1, s2]
  - [c1, s3]
  - [c1, s4]
  - [c1, s5]
  - [s0, p4]
  - [s5, z4]
  - [z4, z5]
  - [z4, f1, { route: overlay }]
  - [z5, f2, { route: overlay }]
