# One switch feeds ten servers. One line is wider than 16:9 and two lines bring the stage-5 canvas nearer it and make it smaller, so `leaves`
# stands on two lines (`groupArrangements`: `stagger`), every drop straight, crossings 0, bends 0, G1-G9 pass.
