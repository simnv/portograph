# Expected (architecture-2 ticket 20, review): two described overlay links leave the one node `h` in `lower` for `p` and `q` in
# `upper`; each draws one diagonal and its label lies on the line. The two bands meet near `h`, so the pair is decided once in 7f
# (`model.labelYields`): link-1 yields to link-2. Band avoidance applies to candidates on the line only; near the shared node the bands
# lie inside `lower`, which the windows leave out anyway. Both labels stand on their lines, and the tier gap does not grow for the
# yield (the canvas main had). Test-only input; test/pipeline/link-label-rules.test.ts reads it.
# `lower` is declared first, so the canonical link order (ticket DR-04: groups in declaration order, then nodes inside a group) is the
# order the links are written in.
portograph: 2
profile: network
groups:
  lower: { tier: 1, label: Lower }
  upper: { tier: 0, label: Upper }
nodes:
  p: { group: upper, class: cloud, icon: cloud, label: P, description: left peer }
  m: { group: upper, class: cloud, icon: cloud, label: M, description: middle peer }
  q: { group: upper, class: cloud, icon: cloud, label: Q, description: right peer }
  h: { group: lower, class: router, icon: router, label: H, description: hub router }
  s: { group: lower, class: router, icon: router, label: S, description: side router }
links:
  - [h, p, { label: hub to the left, route: overlay, class: overlay }]
  - [h, q, { label: hub to the right, route: overlay, class: overlay }]
  - [s, m, { label: side up, class: primary }]
