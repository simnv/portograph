  mid-3: { group: hub, ports: [p1, p2] }
  mid-2: { group: hub, ports: [p1, p2, p3, p4, p5] }
  mid-4: { group: hub, ports: [p1, p2, p3] }
  top-2: { group: hub, ports: [p1, p2, p3, p4, p5, p6, p7, p8] }
  top-4: { group: hub, ports: [p1, p2] }
  leaf-1: { group: site, ports: [p1] }
  leaf-2: { group: site, ports: [p1] }
  up-1: { group: upstream }
  up-2: { group: upstream }
  up-3: { group: upstream }
