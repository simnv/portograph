# Expected: A cycle sw-sw-rt-rt (ranked-groups ticket 01, re-read by ticket 27). Four physical links
# close a ring: rt1-rt2, rt2-sw1, sw1-sw2 and sw2-rt1. Router 1 links to the tier above and is rank 0.
# A ring has no inherent order, and the class no longer pairs its ends: the rank is the breadth-first
# depth, so Router 2 and Switch 2 are one hop from Router 1 and share rank 1, and Switch 1, two hops
# from it whichever way round, is rank 2. No link joins two members of equal depth, so the ring has
# no peer link and the group has three ranks.
# Test-only input owned by ranked-groups ticket 01; the derivation test reads the parsed document.
portograph: 2
groups:
  upstream: { tier: 0, label: Upstream }
  site: { tier: 1, label: Site }
nodes:
  isp: { group: upstream, class: provider, label: ISP }
  rt1: { group: site, class: router, label: Router 1 }
  rt2: { group: site, class: router, label: Router 2 }
  sw1: { group: site, class: switch, label: Switch 1 }
  sw2: { group: site, class: switch, label: Switch 2 }
links:
  - [isp, rt1]
  - [rt1, rt2]
  - [rt2, sw1]
  - [sw1, sw2]
  - [sw2, rt1]
