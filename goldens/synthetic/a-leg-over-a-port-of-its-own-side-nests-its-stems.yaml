# Expected: Centring (7c) moves and grows `w1`, inside the alignment cap (ADR-0027), to put its two top ports under their two parents (`a1`, `b3`).
# `m1|top` carries two ports one port pitch apart, and the link on the right one travels over the left one's column, so the two turns cannot
# stand at one depth: the stem plan nests them, the left port at the plain reach and the right one a pitch beyond it (ADR-0015 rule 1, stress
# ticket 08). `w1|top` nests nothing: its two links descend on their own columns. Derived from widened-child-packs-tier, whose child no longer
# widens under the cap (its parents stand more than 5 times its need apart); this sheet has fewer parents (`a2`, `a3` and `b2` are gone). Test-only input;
# test/pipeline/turning-legs.test.ts reads it.
portograph: 2
groups:
  feed-a: { tier: 0, label: "Feed A" }
  feed-b: { tier: 0, label: "Feed B" }
  wide: { tier: 1, label: "Wide" }
  middle: { tier: 1, label: "Middle" }
  edge: { tier: 1, label: "Edge" }
nodes:
  a1: { group: feed-a, class: router, label: "a1" }
  b1: { group: feed-b, class: router, label: "b1" }
  b3: { group: feed-b, class: router, label: "b3" }
  w1: { group: wide, class: rr, label: "w1" }
  m1: { group: middle, class: provider, label: "m1" }
  e1: { group: edge, class: provider, label: "e1" }
links:
  - [w1, a1]
  - [w1, b3]
  - [m1, a1]
  - [m1, b1]
  - [e1, m1]
