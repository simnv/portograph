# Expected: a row of seven nodes, the first five in a `sync` mesh, a core above feeding the first and the fifth, and the sixth and
# seventh each feeding three nodes of a tier below. ADR-0011 counts two routed ports on the top edge and six on the bottom edge, so
# the group title stands on top. Inside the span of the mesh (the first five nodes) the top edge holds two legs and the bottom none, so
# the bus stands at the bottom, opposite the title, and the two feed legs do not cross the bar (ticket 83, mesh-bus.md section 4).
# Test-only input owned by ranked-groups ticket 83; test/pipeline/mesh-bus-placement.test.ts reads the layout.
portograph: 2
groups:
  top: { tier: 0, label: Top }
  row: { tier: 1, label: Row }
  below: { tier: 2, label: Below }
nodes:
  core: { group: top, class: router, label: Core }
  n1: { group: row, class: router, label: N1 }
  n2: { group: row, class: router, label: N2 }
  n3: { group: row, class: router, label: N3 }
  n4: { group: row, class: router, label: N4 }
  n5: { group: row, class: router, label: N5 }
  n6: { group: row, class: router, label: N6 }
  n7: { group: row, class: router, label: N7 }
  s1: { group: below, class: server, label: S1 }
  s2: { group: below, class: server, label: S2 }
  s3: { group: below, class: server, label: S3 }
  s4: { group: below, class: server, label: S4 }
  s5: { group: below, class: server, label: S5 }
  s6: { group: below, class: server, label: S6 }
links:
  - [core, n1]
  - [core, n5]
  - [n6, s1]
  - [n6, s2]
  - [n6, s3]
  - [n7, s4]
  - [n7, s5]
  - [n7, s6]
  - { from: n1, to: n2, class: sync }
  - { from: n1, to: n3, class: sync }
  - { from: n1, to: n4, class: sync }
  - { from: n1, to: n5, class: sync }
  - { from: n2, to: n3, class: sync }
  - { from: n2, to: n4, class: sync }
  - { from: n2, to: n5, class: sync }
  - { from: n3, to: n4, class: sync }
  - { from: n3, to: n5, class: sync }
  - { from: n4, to: n5, class: sync }
