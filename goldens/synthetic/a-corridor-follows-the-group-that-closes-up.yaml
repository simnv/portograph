# Expected: A corridor follows the group that closes up (architecture-2 ticket 69). Reduced from a-stretched-body-is-trimmed-to-its-ports:
# `near` and `access` are grids, and the label of `sink-near` makes it need 102 px; the seat grows it in place over two of its feeds
# (to 491 px, under the alignment cap of ADR-0027) and the end trim narrows it (119.5 px). `far` then closes up toward `near` by
# 61.9 px, and the corridor of the link `src-b -> sink-far` follows its port (`bodyTrims.laneShifts`): one lane moves by the shift
# of its group and still stands on the port. Since dense-16x9 ticket 02 a step that grows a body and leaves every aligned port of its group
# off its feed is declined whole; the grids give the premise back. Test `test/layout/close-up.test.ts` reads the layout.
# DR-04: links take the canonical order (group declaration order, then node order inside the group), so `access` is declared
# before `src`; the canonical order is then the written order.
portograph: 2
groups:
  access: { tier: 1, shape: grid }
  src: { tier: 0 }
  far: { tier: 2 }
  near: { tier: 2, shape: grid }
nodes:
  src-a: { group: src, class: router, ports: [] }
  src-b: { group: src, class: router, ports: [] }
  src-c: { group: src, class: router, ports: [] }
  sw-1: { group: access, class: switch, ports: [] }
  sw-2: { group: access, class: switch, ports: [] }
  sink-near: { group: near, class: server, label: "sink near server", ports: [] }
  sink-far: { group: far, class: server, ports: [] }
links:
  - [sw-1, sink-near]
  - [src-a, sink-near]
  - [src-b, sink-far]
  - [src-b, sink-near]
  - [src-c, sink-near]
