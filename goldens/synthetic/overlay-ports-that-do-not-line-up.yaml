# Expected: An overlay pair whose two ports do not line up, with nothing between them. The `sync`
# ports sit on two nodes 75.51 px apart on x and the straight segment between the two stub ends
# enters no node body and no pill, so the default branch of the 2026-09-16 rule (stress ticket 20)
# answers with **one 126.11 px diagonal**, from (80.01, 119) to (155.52, 220) — the whole link, pill
# face to pill face, and the shape the maintainer chose over both the orthogonal staircase and the
# anchor-to-anchor line. The two endpoint marks are drawn at those two points.
#
# It was a 16 px stub, a 119.79 px diagonal and a 16 px stub. Stress ticket 30 took 12 px off each
# stub — pill the overlay mask cut away and never drew — and then took the remaining 4 px as well:
# *"no point in stub then"*, because the stub's two jobs were to square the meeting with the pill and
# to keep the mark clear of it, and a path that starts on the face does both. The line still leaves
# each face outward, so it enters neither of its own pills. The orthogonal
# derivation, which is now the exception branch, drew
# (80.01, 107) (80.01, 216) (155.52, 216) (155.52, 232) on this same input; the two ends and the
# bounding box are the same, so the canvas and Q are unchanged. Every gate passes; Q is
# 0.8391492903118092.
# Test-only input owned by stress ticket 20; the whole pipeline runs, so no stage precondition is
# needed.
portograph: 2
profile: network
groups:
  upper: { tier: 0, label: Upper }
  lower: { tier: 1, label: Lower }
nodes:
  a:
    group: upper
    class: router
    label: Router A
    ports:
      - { name: d1, side: bottom, class: downlink }
      - { name: sync, side: bottom }
  b:
    group: lower
    class: rr
    label: Reflector B
    ports:
      - { name: u1, side: top, class: uplink }
  c:
    group: lower
    class: rr
    label: Reflector C
    ports:
      - { name: sync, side: top }
links:
  - [a.d1, b.u1]
  - [a.sync, c.sync, { route: overlay }]
