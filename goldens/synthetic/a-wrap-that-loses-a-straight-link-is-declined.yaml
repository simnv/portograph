# Expected: The acceptance gate declines a fan wrap that loses a straight link (fan wrap, decision D-Q4, ticket 07; FAN_WRAP_DECLINED).
# The sheet of a-feeding-chain-moves-over-its-wrapped-block with one more link: Dist one also feeds East gateway. Dist one is then a shared
# parent of both locations, so the feeding chain is empty and nothing moves over the wrapped `west`. Stage 5 still stands the 24 leaves on
# two lines (less stage-5 area), but in the complete placement `east` closes up under the chain that stayed, and the overlay link Core two
# to East hub, one straight segment on one line, is no longer straight. The gate keeps the one-line placement: no stagger row,
# `groupArrangements` names the gate for `west-zone#2`, and the info diagnostic FAN_WRAP_DECLINED names the lost link. The same holds with a
# placement budget of one re-run: the comparison run never spends the budget. Test-only input; test/pipeline/fan-wrap.test.ts reads it.
