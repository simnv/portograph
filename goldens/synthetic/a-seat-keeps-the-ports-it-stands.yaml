# Expected: with `layout.moveBeforeGrow: true` (ADR-0027) a seated body keeps the ports its seat stands. The sheet is
# a-face-aligns-one-port-and-leaves-a-chord-port-in-place-middle-tier-first with the option. The seat record names `snk0` with its four
# top ports, `src0` with two bottom ports and `src1` with three; each of these ports stands on the x of its feed, and the publication
# check refuses a layout in which a later stage moves one off. `snk1` gets no seat: a growth that stands none of its targets is declined
# (clause 5), so it stays 56 px. The canvas is 541 x 484; without the option `snk1` grows to 237 px and the canvas is 722 px wide.
portograph: 2
layout: { moveBeforeGrow: true }
groups:
  access: { tier: 1 }
  src: { tier: 0 }
  edge-far: { tier: 2 }
  edge-near: { tier: 2 }
nodes:
  src0: { group: src, class: router, ports: [] }
  src1: { group: src, class: router, ports: [] }
  acc0: { group: access, class: switch, ports: [] }
  acc1: { group: access, class: switch, ports: [] }
  acc2: { group: access, class: switch, ports: [] }
  acc3: { group: access, class: switch, ports: [] }
  acc4: { group: access, class: switch, ports: [] }
  snk0: { group: edge-near, class: server, ports: [] }
  snk1: { group: edge-far, class: server, ports: [] }
links:
  - [src0, acc0]
  - [src1, acc1]
  - [src1, acc3]
  - [src0, acc4]
  - [acc0, snk1]
  - [acc1, snk0]
  - [acc2, snk0]
  - [acc3, snk1]
  - [acc4, snk0]
  - [src0, snk0]
  - [src1, snk1]
