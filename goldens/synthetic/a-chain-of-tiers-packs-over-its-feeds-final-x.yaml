# Expected: A chain of one-rank tiers packs over the final x of its feeds (ranked-groups ticket 33). The lowest tier is
# the anchor tier: three locations, `west` much wider than the other two. Above it stand two tiers of one-rank groups
# in a chain: `dist`, fed by the gateways of the anchor tier, and `core`, fed by `dist`. Two two-rank locations stand
# above `core`. Only `core` has frames next to it, so a rule that reads the next tier outward alone leaves `dist` at
# the x ELK gave it, `core` packs over that x, and centring then moves both. The pack order must follow the feed chain
# from the anchor tier outward, so the two locations end over the final x of `core`.
# Test-only input owned by ranked-groups ticket 33; test/pipeline/tier-above-final-x.test.ts reads the layout.
# Fan wrap (D-Q4, ticket 07): the 29 leaves of `west` stand on two lines, and the feeding chain (`dist`, `core` and the two top
# locations) stands over West gateway; the canvas is about a third smaller than with one line. test/pipeline/fan-wrap.test.ts reads it too.
