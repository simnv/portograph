# Expected: The child's two feeds sit at opposite ends of the row above it, 1 017 px apart, so
# seating a port under each would stretch its 50 px body over twenty times its own width — 1 051.31 px
# before ticket 29, which is how this input used to converge. The alignment allowance declines both:
# the body keeps its 50 px, each feed is reported CENTRE_ALIGNMENT_INFEASIBLE, no pass can settle an
# alignment none of them may reach so the eight are spent and PLACEMENT_NON_CONVERGENCE is reported
# as well, and stage 8 routes the two links. The canvas is the same 1 140.56 x 308 either way: the
# row above sets it. Every gate passes.
# Ticket 29; the whole pipeline runs, so no stage precondition is needed.
# The far-end pull is off (ticket 22, `layout.farEndPull: false`): the two feeds stand at the two ends of their row.
portograph: 2
layout: { farEndPull: false }
groups:
  feeds: { tier: 0 }
  child: { tier: 1 }
nodes:
  feed-left: { group: feeds, ports: [{ name: p, side: bottom }] }
  filler-1: { group: feeds }
  filler-2: { group: feeds }
  filler-3: { group: feeds }
  filler-4: { group: feeds }
  filler-5: { group: feeds }
  filler-6: { group: feeds }
  filler-7: { group: feeds }
  filler-8: { group: feeds }
  filler-9: { group: feeds }
  filler-10: { group: feeds }
  filler-11: { group: feeds }
  filler-12: { group: feeds }
  filler-13: { group: feeds }
  feed-right: { group: feeds, ports: [{ name: p, side: bottom }] }
  target:
    group: child
    ports:
      - { name: a, side: top }
      - { name: b, side: top }
links:
  - [feed-left.p, target.a]
  - [feed-right.p, target.b]
