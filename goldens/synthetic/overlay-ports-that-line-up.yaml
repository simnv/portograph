# Expected: An overlay pair whose two ports face each other on a clear axis. A bottom `sync` port and
# a top `sync` port on two nodes one routed link holds in column share an x, so both stubs are
# on one line, and the path is the one straight segment the rule states for every pair with a clear
# line between them (stress ticket 20, question 2). It runs face to face — 101 px, from (57.34, 119)
# to (57.34, 220) — where it ran anchor to anchor, 125 px from (57.34, 107) to (57.34, 232): stress
# ticket 30 took a 12 px pill half-depth off each end, and those 24 px are exactly what the overlay
# mask cut out of the two pills and never drew. The endpoint mark, drawn above the mask, moves with
# the path onto the pill's face. Removing the stub from the straight branch left this pair alone: its
# two stubs were already collinear with the segment and `straighten` had always dropped them, so the
# degenerate case comes out identical, to the last digit, before and after. The canvas and Q are
# unchanged too, so a diagram whose overlay ports line up does not move. Every gate passes; Q is
# 0.8335929892966935.
# Test-only input owned by stress ticket 20; the whole pipeline runs, so no stage precondition is
# needed.
portograph: 2
profile: network
groups:
  upper: { tier: 0, label: Upper }
  lower: { tier: 1, label: Lower }
nodes:
  a:
    group: upper
    class: router
    label: Router A
    ports:
      - { name: d1, side: bottom, class: downlink }
      - { name: sync, side: bottom }
  b:
    group: lower
    class: rr
    label: Reflector B
    ports:
      - { name: u1, side: top, class: uplink }
      - { name: sync, side: top }
links:
  - [a.d1, b.u1]
  - [a.sync, b.sync, { route: overlay }]
