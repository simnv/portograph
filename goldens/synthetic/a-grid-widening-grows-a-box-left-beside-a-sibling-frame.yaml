# Expected: a linked-group grid widening that grows a cell box left, its body left in place (`dx: 0`), is not refused while the frames keep their
# gap; the same box moved with its body (`dx: -10`) breaks `separation-root-frames` of `top-a` and `top-b` (ticket 157 re-check of `framesAfter`).
# Premise: frame `top-b` stands exactly a band gap right of `top-a`, and the left edge of cell `top-b-zone#1` is the left edge of its body, so
# the body's reach (20 px past it) stands farther left than the box grown by 10 px.
# A copy of a-chain-of-tiers-packs-over-its-feeds-final-x (ranked-groups ticket 33) with short core, dist and top core labels (snack-theme ticket
# 159): with card nodes the core and dist nodes widened, the two top frames stood 88 px apart, and the top core nodes, wider than the edge
# switches, put the zone cell's box 14 px left of its body; neither premise held.
# Test-only input; test/pipeline/min-separation-writers.test.ts reads the layout.
