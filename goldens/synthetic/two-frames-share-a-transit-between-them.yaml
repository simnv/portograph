# Expected: A link foreign to two neighbouring three-rank frames runs between them (ranked-groups ticket 04,
# review). `east` and `west` share three sub-tiers (gateway, distribution, access); `u1` sits between the
# two feeds `u0` and `u2` and links to `l0` in the tier below, so the link crosses all three sub-tiers of
# both frames. One lane x is decided for the whole crossing and stands in the gap between the frames, at
# least the group-edge margin from each frame box, in every sub-tier. The frames do not overlap, no
# routed gap crosses a reserved lane, and gates G2 and G9 stay clean.
# Test-only input owned by ranked-groups ticket 04; test/pipeline/frame-transit.test.ts reads the layout.
portograph: 2
groups:
  up: { tier: 0, label: Up }
  east: { tier: 1, label: East }
  west: { tier: 1, label: West }
  low: { tier: 2, label: Low }
nodes:
  u0: { group: up, class: provider, label: U0 }
  u1: { group: up, class: provider, label: U1 }
  u2: { group: up, class: provider, label: U2 }
  e-gw: { group: east, class: router, label: East gateway of the main building }
  e-dist: { group: east, class: switch, label: East dist }
  e-acc: { group: east, class: access, label: East access }
  w-gw: { group: west, class: router, label: West gateway }
  w-dist: { group: west, class: switch, label: West distribution switch of the annex building }
  w-acc: { group: west, class: access, label: West access }
  l0: { group: low, class: server, label: L0 }
links:
  - [u0, e-gw]
  - [u2, w-gw]
  - [e-gw, e-dist]
  - [e-dist, e-acc]
  - [w-gw, w-dist]
  - [w-dist, w-acc]
  - [u1, l0]
