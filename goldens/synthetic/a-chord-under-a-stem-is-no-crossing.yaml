# Expected: Two core routers each link to the same four edge routers below them. The core routers' stems and
# the edge routers' stems nest, so a link's pin-to-pin chord may cut a batchmate's stem while every leg of
# the link, through its stem tips, stays clear of it (ranked-groups ticket 30). The chord alone must not open
# that stem to a later part. On main the chord grant lets link-9 walk through the granted stem of link-10 at
# x 75.1; its cover (x 66 to 86.6) then closes link-10's near tip (75, 263), and link-10 is skipped and
# removed. With the chord dropped for consumers the stem stays an obstacle, link-9 drops at x 63.3 and
# link-10 routes.
# Test-only input owned by ranked-groups ticket 30; the route test asserts that no link is removed.
portograph: 2
groups:
  upstream: { tier: 0, label: Upstream }
  site: { tier: 1, label: Site }
nodes:
  isp: { group: upstream, class: provider, label: ISP }
  c1: { group: site, class: router, label: Core 1 }
  c2: { group: site, class: router, label: Core 2 }
  e1: { group: site, class: router, label: Edge 1 }
  e2: { group: site, class: router, label: Edge 2 }
  e3: { group: site, class: switch, label: Edge 3 }
  e4: { group: site, class: switch, label: Edge 4 }
links:
  - [isp, c1]
  - [isp, c2]
  - [c1, c2]
  - [c1, e1]
  - [c1, e2]
  - [c1, e3]
  - [c1, e4]
  - [c2, e1]
  - [c2, e2]
  - [c2, e3]
  - [c2, e4]
  - [e1, e2]
  - [e3, e4]
