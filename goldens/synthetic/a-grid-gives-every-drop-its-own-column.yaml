# Expected: Three of the four nodes drop to the bar below, so the grid takes at least three columns
# — a column is a corridor, and it holds one downward exit — and the three drops share the last row
# rather than stacking two of them in one column. The fourth node, which exits no way, fills the row
# above. Reading order alone would not do it: chunked three wide, the ranked order `d a b c` puts
# `a` and `b` in the first row, so the rows are built from the ranks instead.
portograph: 2
profile: network
groups:
  place: { tier: 0, shape: grid }
  rails: { tier: 1, shape: bar }
nodes:
  a: { group: place, ports: [{ name: p, side: bottom }] }
  b: { group: place, ports: [{ name: p, side: bottom }] }
  c: { group: place, ports: [{ name: p, side: bottom }] }
  d: { group: place }
  rail: { group: rails, ports: { side: top, list: [p, p, p] } }
links:
  - [a.p, rail.p#1]
  - [b.p, rail.p#2]
  - [c.p, rail.p#3]
