# Expected (architecture-2 ticket 54, titles last): `lower`'s title stands over the node's downward feed corridor. 7f no longer grows a box
# for a title: the title is placed last, finds no free span, stands at the centre with a halo and names link-3 in `crossedBy`. The box keeps
# the width stage 5 gives it (the title room, snack-theme ticket 157). Every gate passes.
#
# History: before ticket 54, 7f grew the box and planned the label again inside it, the one path where `planLabels` answered from the
# `firstFree` walk (stress ticket 19); the fixture pinned that the label came to rest on the inset and not 1e-6 px outside it.
#
# `middle` carries two links up and one down, so the title takes the bottom edge (ADR-0011), the edge the downward corridor crosses.
portograph: 2
groups:
  upper: { tier: 0, label: "Upper" }
  lower: { tier: 1, label: "A group label that fills the box it asked for" }
  under: { tier: 2, label: "Under" }
nodes:
  parent-a: { group: upper, class: router, label: "parent a" }
  parent-b: { group: upper, class: router, label: "parent b" }
  middle: { group: lower, class: router, label: "middle" }
  under-a: { group: under, class: router, label: "under a" }
links:
  - [middle, parent-a]
  - [middle, parent-b]
  - [middle, under-a]
