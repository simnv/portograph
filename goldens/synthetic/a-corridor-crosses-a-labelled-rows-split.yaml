# Expected: stress ticket 18. `n3_0.r0` → `n3_1.l0` is a labelled row link, and the run between the
# two pill faces holds 9 px where its label needs 206.61279296875. 7f cannot reserve that room: the
# corridor `link-16` owns across tier 2 stands at x 231, beyond the link's split, and lane geometry
# cannot move — so the link is diagnosed `LINK_LABEL_ROOM_UNRESERVED` and the stage 9 ladder decides.
#
# Then 7f's last step moves that corridor **left**, to its child's port x at -197.1860853536607,
# which is on the far side of the split. The reservation the production pass declined is one the
# publication replay makes, and it throws
#
#   A labelled link is shorter than the run its label reserved: link-17 needs 206.61279296875 px
#   along its row and holds 9 px
#
# on a model nothing else touched. Re-reserving is not the answer here: it moves nodes, and by 7f's
# last step the corridors are fixed. So the corridor move is refused, beside the centring and
# short-gap contradictions it was already refused for, and `LANE_FOLLOWS_ITS_CHILD` is dropped with
# it. The build produces the diagram, keeps both corridors where 7a put them (x 95.5 and x 231) and
# leaves link-17's label to the ladder, which omits it.
#
# The diagram is produced at Q 0.5234685207782394 with G4, G5 and G6 failing: a transit diagram with
# one crossing pair, which is the routing backlog and no part of this claim.
