# Expected: `row-12` and `row-13` are joined by vertical links, so they share one x-extent
# (ADR-0012) — and on this diagram the merge is the one `laneSidesHold` declines, because the
# corridor the link `lab4crt001` → `transit-a001` owns across tier 6 stands at x
# 909.5692545572916, its rectangle reaching 926.5692545572916, and the shared extent starts at
# 926.2877604166666: 0.2815 px inside it.
#
# 7f's last step then moves that corridor to its child's port x, 1513.2303873697915, and the window
# it blocked is free. Six corridors follow their children here; this is the one that matters.
#
# So the plans 7f settled before the move are settled against corridors the diagram does not
# publish, and `validateGroupLabelBands` — which re-derives both the grid and the label plan —
# refuses the result: `Linked groups do not share the grid their links require`, `row-12`
# 952.5692545572916 wide 445.6430664062499, which the replay would make 926.2877604166666 wide
# 474.6777343749999. The grid and the labels are settled again after the move, so the published
# model is the fixed point of both, and `row-12` and `row-13` both span
# 926.2877604166666 … 1400.9654947916665.
#
# Stress ticket 37. Shrunk from the Enterprise NTP sheet, which this claim stopped from publishing at all, and
# renamed as far as the reproduction allows: the failure is a 0.28 px margin, so every measured
# string the rename would have changed was tested and reverted where it moved the geometry.
# The diagram is produced. It is a hard sheet to route and G4, G5 and G6 fail on it at
# Q 0.4879135816981557; that is the routing backlog, not this claim.
