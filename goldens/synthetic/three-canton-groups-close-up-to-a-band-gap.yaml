# Expected: three canton groups stand a band gap apart when the anchor sub-tier stands inside their span (ranked-groups
# ticket 65). The shape of three-continents.yaml (ticket 58, fixture 10) with, in every location, two access switches beside
# the switch (rank 1), and in the two locations of canton `a` two servers (rank 2) beside a four-node zone child. The rank-1
# sub-tier holds 12 nodes against 10 on tier 0, so it is the anchor tier: the canton step is packed first, with no tier before
# it to read, and keeps ELK's centre. Sync links join every top location to every tier-2 location (all-to-all), so no canton
# has a partner side to follow. Today the canton frames stand 100 and 148 px apart: the pack leaves a band gap plus two column
# slacks, the rows rule pushes a canton right and nothing brings it back, and no pass packs the anchor step again. Expected:
# the three canton frames a band gap apart, centred as a block under the top locations.
# Test-only input owned by ranked-groups ticket 65; the ticket's test reads the layout.
# Ticket 89: the links from the two switches to their zone nodes are authored `route: orthogonal`. As frame chords they would make the
# switches spread their ports (a fan pitch) and widen the canvas, and this input is about the close-up, not about the fan.
# The feed order is off (architecture-2 ticket 25, `layout.feedOrder: false`): the input is about the close-up, and its tests pin
# measured geometry and verdicts. With the feed order on, the zones of canton `a` stand under their feeds (routed crossings
# 12 to 4, Q 0.757 to 0.839) and canton b keeps its gap open for a straight overlay link.
portograph: 2
layout: { feedOrder: false }
