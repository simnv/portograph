# Expected: the stems of the same-boundary U-turn between the bottom ports of r0 and r3 (residual, TIER_GAP_PART_RESIDUAL) put rows of the
# tier gap in a cycle. Since ticket DR-04 a part of the cycle that has a free middle is split (a Z with a middle drop), so no part is
# TIER_GAP_ROW_CYCLE here; `a-row-cycle-with-no-free-middle-is-left-to-the-router` keeps that code. The diagram publishes and removes nothing.
# Test-only input owned by ranked-groups ticket 51; test/pipeline/residual-parts.test.ts reads the placed and the routed model.
portograph: 2
groups:
  src: { tier: 0 }
  access: { tier: 1 }
nodes:
  r0: { group: src, class: router, ports: [{ name: a, side: bottom }] }
  r1: { group: src, class: router, ports: [] }
  r2: { group: src, class: router, ports: [] }
  r3: { group: src, class: router, ports: [{ name: a, side: bottom }] }
  s0: { group: access, class: switch, ports: [] }
  s1: { group: access, class: switch, ports: [] }
  s2: { group: access, class: switch, ports: [] }
  s3: { group: access, class: switch, ports: [] }
links:
  - [r0, s1, { route: orthogonal }]
  - [r1, s0, { route: orthogonal }]
  - [r1, s3, { route: orthogonal }]
  - [r2, s2, { route: orthogonal }]
  - [r2, s0, { route: orthogonal }]
  - [r3, s1, { route: orthogonal }]
  - [r0.a, r3.a, { route: orthogonal }]
