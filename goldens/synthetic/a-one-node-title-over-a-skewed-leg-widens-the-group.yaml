# Expected (architecture-2 ticket 54, titles last): a one-node group whose title stands over skewed legs. The group `mid` holds one router fed
# from two nodes of `top` and leaving to two nodes of `low`; its two top ports stand 12 px apart, off the feeds they meet, so their legs are skewed,
# and the title (as wide as the group's box less its insets) finds no free span on its edge. It stands at the centre with a halo and names both
# links in `crossedBy`; `mid` does not widen for it. The tier-gap row plan holds both parts (no `leg-blocked`), and G3 excuses the two links.
# Before ticket 54 the legs were hard obstacles to the title (ticket 66) and `mid` widened by the title plus the clearances beside the port.
# The two feeds are authored `route: orthogonal`: since ticket 162 a diagonal may cross a title, so as chords they would leave no leg.
# Test-only input owned by ticket 66; test/pipeline/hard-legs-under-a-title.test.ts reads it.
portograph: 2
groups:
  top: { tier: 0, label: Top }
  mid: { tier: 1, label: A rather long title for one router }
  low: { tier: 2, label: Low }
  side: { tier: 2, label: Side }
nodes:
  a0: { group: top, class: router, label: A0 }
  a1: { group: top, class: router, label: A1 }
  a2: { group: top, class: router, label: A2 }
  m0: { group: mid, class: router, label: M0 }
  z0: { group: low, class: router, label: Z0 }
  z1: { group: low, class: router, label: Z1 }
  z2: { group: low, class: router, label: Z2 }
  s0: { group: side, class: router, label: S0 }
  s1: { group: side, class: router, label: S1 }
links:
  - [a1, m0, { route: orthogonal }]
  - [a2, m0, { route: orthogonal }]
  - [m0, z1]
  - [m0, z2]
