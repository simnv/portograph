# Expected (dense-16x9 ticket 36, slice 1): with `layout.moveBeforeGrow: true` stage 5 seats the child row `site#1` under its parents'
# ports as one seat set: `c1` stands under `p1` and `c2` under `p2`, each at its own width (`n1`, which only the row below reads,
# ranks on a row of its own). The set is one `seatSet` entry; 7c applies it and chooses nothing again. Before the slice, 7c grew `c1` and `c2`
# to 220 px each toward their feeds; with the seat set both keep the width of their content (50 px) and both feeds stand vertical.
# Test: test/layout/seat-set.test.ts reads the entry, the widths, the verticals, the restore checks and R3.
portograph: 2
layout: { moveBeforeGrow: true }
groups:
  up: { tier: 0 }
  site: { tier: 1, label: "One site in ranks" }
nodes:
  t0: { group: up, ports: [{ name: a, side: bottom }, { name: b, side: bottom }] }
  p1: { group: site, size: { width: 420, height: 40 }, ports: [{ name: up, side: top }, { name: d1, side: bottom }] }
  p2: { group: site, size: { width: 420, height: 40 }, ports: [{ name: up, side: top }, { name: d1, side: bottom }] }
  c1: { group: site, ports: [{ name: u1, side: top }, { name: b, side: bottom }] }
  n1: { group: site, ports: [{ name: b, side: bottom }] }
  c2: { group: site, ports: [{ name: u1, side: top }, { name: b, side: bottom }] }
  k1: { group: site, ports: [{ name: t1, side: top }, { name: t2, side: top }, { name: t3, side: top }] }
links:
  - { from: t0.a, to: p1.up }
  - { from: t0.b, to: p2.up }
  - { from: p1.d1, to: c1.u1 }
  - { from: p2.d1, to: c2.u1 }
  - { from: c1.b, to: k1.t1 }
  - { from: n1.b, to: k1.t2 }
  - { from: c2.b, to: k1.t3 }
