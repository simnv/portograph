# Expected (dense-16x9 ticket 36, slice 1): with `layout.moveBeforeGrow: true` the rows rule (stage 6) seats the child row `site#1` (`c1`, `n1`, `c2`)
# under its parents' ports as one seat set: `c1` stands under `p1` and `c2` under `p2`, each at the width of its content (50 px, as the
# unfed `n1`). The set is one `seatSet` entry; 7c applies it and does not choose again. Main has the same straight links: its 7c moves the
# parents' bottom ports toward the children. No member feeds a row below (that case, and the change from main: a-seated-row-leaves-its-lower-row-one-feed).
# Test: test/layout/seat-set.test.ts reads the entry, the widths, the verticals, the restore checks and R3.
portograph: 2
layout: { moveBeforeGrow: true }
groups:
  up: { tier: 0 }
  site: { tier: 1, label: "One site in ranks" }
nodes:
  t0: { group: up, ports: [{ name: a, side: bottom }, { name: b, side: bottom }] }
  p1: { group: site, size: { width: 420, height: 40 }, ports: [{ name: up, side: top }, { name: d1, side: bottom }] }
  p2: { group: site, size: { width: 420, height: 40 }, ports: [{ name: up, side: top }, { name: d1, side: bottom }] }
  c1: { group: site, ports: [{ name: u1, side: top }, { name: b, side: bottom }] }
  n1: { group: site, ports: [{ name: b, side: bottom }] }
  c2: { group: site, ports: [{ name: u1, side: top }, { name: b, side: bottom }] }
links:
  - { from: t0.a, to: p1.up }
  - { from: t0.b, to: p2.up }
  - { from: p1.d1, to: c1.u1 }
  - { from: p2.d1, to: c2.u1 }
