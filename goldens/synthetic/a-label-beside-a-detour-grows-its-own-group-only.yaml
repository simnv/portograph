# Expected (architecture-2 tickets 21 and 23): room across a run beside a sibling. As in a-row-mesh-with-another-label-draws-plain-links,
# the detours of the mesh take separate tracks (ticket 23): three over the row, a track pitch apart, and the rest under it. The top
# padding of `row` must reach the outer track plus one track pitch to the border (24 px): 7f grows the top edge of `row` by 4 px and
# records it (`labelPadding`: row top, room 24, links [link-7]). Only the content of `row` and the tiers below move down; the sibling
# `aside` in the same tier keeps its top and its 20 px padding. The `backup` label stands under the row on the side of the bodies.
# No LINK_LABEL_ON_BORDER. At the end of 7f the overlay ports of each face nest with their direct links (user, 2026-10-24): two
# tracks remain over the row and no pair shares one (`overlayTrackShares` absent); the room 7f grew for three tracks stays recorded.
# Test-only input; test/pipeline/link-label-rules.test.ts reads it.
portograph: 2
groups:
  top: { tier: 0, label: Top }
  row: { tier: 1, label: Row }
  aside: { tier: 1, label: Aside }
nodes:
  core: { group: top, class: router, label: Core }
  n1: { group: row, class: router, label: N1 }
  n2: { group: row, class: router, label: N2 }
  n3: { group: row, class: router, label: N3 }
  n4: { group: row, class: router, label: N4 }
  n5: { group: row, class: router, label: N5 }
  s: { group: aside, class: router, label: S }
links:
  - [core, n1]
  - [core, n5]
  - [core, s]
  - { from: n1, to: n2, class: sync }
  - { from: n1, to: n3, class: sync }
  - { from: n1, to: n4, class: sync }
  - { from: n1, to: n5, class: sync }
  - { from: n2, to: n3, class: sync }
  - { from: n2, to: n4, class: sync, label: backup }
  - { from: n2, to: n5, class: sync }
  - { from: n3, to: n4, class: sync }
  - { from: n3, to: n5, class: sync }
  - { from: n4, to: n5, class: sync }
