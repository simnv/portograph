# Expected (ADR-0025, dense-16x9 ticket 03): the grid takes the column count whose stage-4 box is nearest the aspect aim, 16:9 or `layout.aspect`.
# The four nodes of `place` stand wider than tall. Under the default aim the box nearest 16:9 is three columns over one; with
# `layout: { aspect: "1:1" }` it is two columns over two (the count of ADR-0024). Both counts hold every drop straight.
portograph: 2
profile: network
groups:
  upper: { tier: 0 }
  place: { tier: 1, shape: grid }
nodes:
  head: { group: upper, ports: [{ name: p, side: bottom }] }
  a: { group: place, ports: [{ name: p, side: top }] }
  b: { group: place }
  c: { group: place }
  d: { group: place }
links:
  - [head.p, a.p]
