# Expected: a tier gap seats a row one cover margin inside its low boundary, so that row's cover
# ends exactly on the boundary, and stage 8 claims the run standing there straight through the touch.
#
# Three transit links descend from `n5_2` to tiers 0, 2 and 3, so the tier gaps they cross each owe
# rows. The gap between tier 3 and tier 4 is y 768.25 ... 841.25 and seats all three of its rows, at
# y 779.75, 797.25 and 814.75. The first of them is `link-17`'s, and its cover — the run grown by
# `10 + (the two strokes) / 2` = 11.5 px — is x 66.60 ... 330.60, y 768.25 ... 791.25. Its top edge
# is the gap's own low boundary, and that is arithmetic, not luck. The gap reserves each run's own
# approach beyond the far boundary as a rectangle grown by 11.5 px, so the search refuses the first
# position the pitch allows and takes the one past that rectangle's edge — 11.5 px inside the
# boundary, which is the row's own cover margin. The cover's edge then lands on the boundary
# exactly, and every run that stands there touches it.
#
# `link-18` stands on that boundary at x 112.10. Its piece from there to its own port is a straight
# run with one checkpoint on its own line, so stage 8 claims it (ADR-0015 tenth amendment) — except
# that the claim scanned the reserved covers with `segmentRect`, which grows the rectangle it is
# given by EPS and so counts a zero-area touch as a hit. The claim was declined, the piece went to
# libavoid, and libavoid answered with a route that never reaches the reserved end:
# `Routed gap on link-18 does not meet its reserved endpoints`.
#
# A run on a cover edge is clear of the cover, so the scan asks for an overlap of area. The claim is
# made, the piece is one straight segment from (112.10, 768.25) to (112.10, 725.00), and the diagram
# is produced at Q 0.4132939050368625 with G4, G5 and G6 failing — none of them this rule.
#
# Shrunk from the generated corpus input `transit-t6-p3-f1-s3`, which fails the same way.
#
# The rows keep their declared order (`layout.corridorRowOrder: false`, architecture-2 ticket 17): the claim above
# needs the crossings that order makes, and the corridor row order would remove them.
portograph: 2
layout: { corridorRowOrder: false }
groups:
  t0: { tier: 0, label: Tier 0 }
  t1: { tier: 1, label: Tier 1 }
  t2: { tier: 2, label: Tier 2 }
  t3: { tier: 3, label: Tier 3 }
  t4: { tier: 4, label: Tier 4 }
  t5: { tier: 5, label: Tier 5 }
nodes:
