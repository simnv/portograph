# Expected: architecture-2 ticket 73, the feed split. The input of a-tier-gap-plan-orders-every-part. The feeds of edge-far (sw0, sw3) and
# of edge-near (sw1, sw2, sw4) stand apart in x at stage 5 (the transit links of isp0 and isp1 have no lane yet), but closer than the two
# reaches and the band gap: stage 5 moves the feeding side (the access and src tiers) right of the split line, so 7c stands both groups under their
# feeds (`feedSplits`: one split of sub-tier 2, pair edge-far | edge-near). Every link of srv0 and srv1 is vertical, bends 2 to 0,
# isp0 293 to 184 px, canvas 579 to 590 px. Test test/layout/feed-split.test.ts.
portograph: 2
groups:
  src: { tier: 0 }
  access: { tier: 1 }
  edge-far: { tier: 2 }
  edge-near: { tier: 2 }
nodes:
  isp0: { group: src, class: router, ports: [] }
  isp1: { group: src, class: router, ports: [] }
  sw0: { group: access, class: switch, ports: [] }
  sw1: { group: access, class: switch, ports: [] }
  sw2: { group: access, class: switch, ports: [] }
  sw3: { group: access, class: switch, ports: [] }
  sw4: { group: access, class: switch, ports: [] }
  srv0: { group: edge-near, class: server, ports: [] }
  srv1: { group: edge-far, class: server, ports: [] }
links:
  - [isp0, sw0]
  - [isp1, sw1]
  - [isp0, sw2]
  - [isp1, sw3]
  - [isp0, sw4]
  - [sw0, srv1]
  - [sw1, srv0]
  - [sw2, srv0]
  - [sw3, srv1]
  - [sw4, srv0]
  - [isp0, srv1]
  - [isp1, srv0]
