# Expected: the link between n5 and s joins two frames of one tier on one sub-tier and is a level chord (a held level cross-frame chord) when 7e ends. The
# label of the sync link n2--n4 needs 4 px more top padding for `row`, which 7f reserves by moving the content of `row` down. The content of `aside`
# moves down with it (the two rows are one level relation), so the chord n5--s is still level at the end: one segment, equal y at both ends. Every gate passes.
# Test-only input owned by dense-16x9 ticket 06 (slice B review 1): test/pipeline/sibling-frame-chord.test.ts.
portograph: 2
groups:
  top: { tier: 0, label: Top }
  row: { tier: 1, label: Row }
  aside: { tier: 1, label: Aside }
nodes:
  core: { group: top, class: router, label: Core }
  n1: { group: row, class: router, label: N1 }
  n2: { group: row, class: router, label: N2 }
  n3: { group: row, class: router, label: N3 }
  n4: { group: row, class: router, label: N4 }
  n5: { group: row, class: router, label: N5 }
  s: { group: aside, class: router, label: S, size: { width: 50, height: 100 } }
links:
  - [core, n1]
  - [core, n5]
  - [core, s]
  - { from: n1, to: n2, class: sync }
  - { from: n1, to: n3, class: sync }
  - { from: n1, to: n4, class: sync }
  - { from: n1, to: n5, class: sync }
  - { from: n2, to: n3, class: sync }
  - { from: n2, to: n4, class: sync, label: backup }
  - { from: n2, to: n5, class: sync }
  - { from: n3, to: n4, class: sync }
  - { from: n3, to: n5, class: sync }
  - { from: n4, to: n5, class: sync }
  - [n5, s]
