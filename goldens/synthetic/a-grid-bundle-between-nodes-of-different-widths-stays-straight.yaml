# Expected: The grid `farm` stands as a grid with a and b in one column. `a` carries a long label and is the wider body; b
# takes the same width as a floor (stage 3), so the two port blocks stand at one x and the members of the bundle are
# straight (0 bent, 0 turns). `GRID_BUNDLE_STACKED` is reported once.
portograph: 2
profile: network
groups:
  top: { tier: 0, label: Core }
  farm: { tier: 1, shape: grid, label: Farm }
nodes:
  core: { group: top, class: router, label: Core }
  a: { group: farm, class: server, label: A server with a very long label to widen it }
  b: { group: farm, class: server, label: B }
  c: { group: farm, class: server, label: C }
  d: { group: farm, class: server, label: D }
links:
  - [core, c]
  - [core, d]
  - [a, b]
  - [a, b]
