# Expected: two cantons side by side. `west` holds two sites on tier 2, `w-site-a` and `w-site-b`, each with a zone of its own (a child frame), so the two
# sites are frames side by side in one row of the canton; `east` holds one site with a zone. A full `sync` mesh joins the four tier-1 nodes and the four
# tier-3 nodes and the two buses join, so 7a reserves a riser lane in each sub-tier of tier 2, flush against the right edge of `w-site-b`. Centring then
# leaves the two sites closer than `FRAME_TO_FRAME_GAP` (40 px), and the beside-row pack (`packBesideRows`, in centring and in its 7f replays) moved the
# whole of `w-site-b` right onto the riser lane: 7f publication threw "Lane riser:mesh-bus-1:1 crosses occupied group w-site-b#0". The pack asks the
# move guard: `w-site-b` stays, and `w-site-a` closes up to it from the left, so the two site frames stand 40 px apart, every gate passes and no
# `FRAME_PACK_HELD` remains.
# Test-only input owned by snack-theme ticket 159; test/pipeline/frame-pack-riser.test.ts reads it.
# Card nodes (`layout.nodeContent: card`, snack-theme ticket 159): the premise was forged on the card geometry; a stacked document is narrower.
portograph: 2
layout: { nodeContent: card }
groups:
  west: { label: West }
  east: { label: East }
  w-top-a: { tier: 1, canton: west }
  w-top-b: { tier: 1, canton: west }
  e-top-a: { tier: 1, canton: east }
  e-top-b: { tier: 1, canton: east }
  w-site-a: { tier: 2, canton: west, label: Site A }
  w-zone-a: { parent: w-site-a, label: Zone A }
  w-site-b: { tier: 2, canton: west, label: Site B }
  w-zone-b: { parent: w-site-b, label: Zone B }
  e-site: { tier: 2, canton: east, label: Site C }
  e-zone: { parent: e-site, label: Zone C }
  w-low: { tier: 3, canton: west }
  e-low: { tier: 3, canton: east }
