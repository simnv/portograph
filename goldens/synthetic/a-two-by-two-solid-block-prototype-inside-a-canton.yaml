# Ticket 83: a complete solid node block under the cap.
# Expected: all block members straight, compact hubs, full-weight X, 34-degree/top-entry gap reserved before freeze.
portograph: 2
profile: network
layout: { autoArrange: false }
groups:
  domain: { label: Domain }
  upper: { tier: 0, canton: domain }
  lower: { tier: 1, canton: domain }
nodes:
  hub0: { group: upper, class: router }
  hub1: { group: upper, class: router }
  leaf0: { group: lower, class: router }
  leaf1: { group: lower, class: router }
links:
  - { from: hub0, to: leaf0 }
  - { from: hub0, to: leaf1 }
  - { from: hub1, to: leaf0 }
  - { from: hub1, to: leaf1 }
