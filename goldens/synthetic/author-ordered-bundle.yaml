# Expected: Preserve both author orders, report exactly three inversions and three member crossings, and add no crossings outside the bundle.
portograph: 2
profile: network
groups:
  upper: { tier: 0 }
  lower: { tier: 1 }
nodes:
  source:
    group: upper
    ports:
      - { name: p, side: bottom, order: 1 }
      - { name: p, side: bottom, order: 2 }
      - { name: p, side: bottom, order: 3 }
  target:
    group: lower
    ports:
      - { name: p, side: top, order: 1 }
      - { name: p, side: top, order: 2 }
      - { name: p, side: top, order: 3 }
links:
  - [source.p#1, target.p#3, { route: bundle }]
  - [source.p#2, target.p#2, { route: bundle }]
  - [source.p#3, target.p#1, { route: bundle }]
