# Expected: a growth no target uses does not stay (architecture-2 ticket 71; since dense-16x9 ticket 02, ADR-0027 clause 5). The user's
# tier-gap sheet without its two transit links. The centring passes widen `srv0` toward `sw1`, `sw2` and `sw4` (247 px), and the window
# of its step clamps `edge-near` right of `edge-far`, so no target of `srv0` stands. Ticket 71 gave that width back at the end of the
# centre rule through a record (`givenBack`); now the step that grows it is declined where it ends, and the record is gone: `srv0` is
# 56 px. `srv1` keeps its width: its links to `sw0` and `sw3` stand vertical. Main: bends 6, crossings 5, canvas 477 px wide (668 before
# ticket 71). Since architecture-2 ticket 72 (the joint stage-4 order) the sheet as written turns `access` to sw2 sw4 sw0 sw1 sw3 and
# `edge-near` stands left of `edge-far`; `test/layout/seat-acceptance.test.ts` pins `layout.feedOrder: false` to read the rule.
portograph: 2
groups:
  src: { tier: 0 }
  access: { tier: 1 }
  edge-far: { tier: 2 }
  edge-near: { tier: 2 }
nodes:
  isp0: { group: src, class: router, ports: [] }
  isp1: { group: src, class: router, ports: [] }
  sw0: { group: access, class: switch, ports: [] }
  sw1: { group: access, class: switch, ports: [] }
  sw2: { group: access, class: switch, ports: [] }
  sw3: { group: access, class: switch, ports: [] }
  sw4: { group: access, class: switch, ports: [] }
  srv0: { group: edge-near, class: server, ports: [] }
  srv1: { group: edge-far, class: server, ports: [] }
links:
  - [isp0, sw0]
  - [isp1, sw1]
  - [isp0, sw2]
  - [isp1, sw3]
  - [isp0, sw4]
  - [sw0, srv1]
  - [sw1, srv0]
  - [sw2, srv0]
  - [sw3, srv1]
  - [sw4, srv0]
