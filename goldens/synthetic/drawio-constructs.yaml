# Expected: One small diagram carrying every construct the draw.io exporter has to translate that
# the golden does not exercise together: a group whose title band the pipeline puts at the bottom,
# a port role and a port status on one pill, a dotted and a dashed link class, a labelled link, and
# an overlay link that the SVG masks and a draw.io file cannot. Both overlay ends sit on a top side
# and their two faces are level. Architecture-2 ticket 34 (user, 2026-10-25, "purple line looks
# wrong, no margins"): an overlay never rides along a face or a foreign pill, so the overlay is a U,
# (51.00, 263.5), (51.00, 255.75), (146.01, 255.75), (146.01, 263.5): up out of each own pill by the
# overlay port clearance (7.75 px), one run 7.75 px above the pill tips of `b.alt`, `b.up` and
# `c.up`, and down. It crosses the routed `link-1` once, at a right angle, clear of the `b.up` pill.
# It was one horizontal segment on the three pill tips (stress tickets 20 and 30, "level counts as
# leaving", 2026-09-16, reversed). Both overlay ends are shared ports (`SHARED_PORT`): the U legs lie
# on the routed stems of `link-2` and `link-3` (one port; the user has not ruled on an offset). The
# connector is `orthogonalEdgeStyle;jettySize=0` with the U's two waypoints.
# Every gate passes; Q is 0.7613433643264863.
# Test-only input owned by drawio-export ticket 01; the whole pipeline runs, so no stage
# precondition is needed.
portograph: 2
groups:
  upper: { tier: 0, label: Upper }
  lower: { tier: 1, label: Lower }
nodes:
  a:
    group: upper
    class: router
    label: Router A
    description: 10.0.0.1
    ports:
      - { name: down, side: bottom, class: downlink up }
      - { name: spare, side: bottom, class: mgmt admin-down }
  b:
    group: lower
    class: tbr
    label: Border B
    ports:
      - { name: up, side: top, class: uplink up }
      - { name: alt, side: top, class: peer degraded }
  c:
    group: lower
    class: rr
    label: Reflector C
    ports:
      - { name: up, side: top, class: loopback }
links:
  - [a.down, b.up, { label: 100G }]
  - [a.spare, b.alt, { class: dotted }]
  - [a.down, c.up, { class: dashed }]
  - [b.alt, c.up, { route: overlay }]
