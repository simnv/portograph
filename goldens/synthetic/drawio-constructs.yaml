# Expected: One small diagram carrying every construct the draw.io exporter has to translate that
# the golden does not exercise together: a group whose title band the pipeline puts at the bottom,
# a port role and a port status on one pill, a dotted and a dashed link class, a labelled link, and
# an overlay link that the SVG masks and a draw.io file cannot. Both overlay ends sit on a top side,
# so the two stub ends are level and the straight segment between them is horizontal and clear: the
# default branch of the 2026-09-16 rule (stress ticket 20) states the three-segment shape the
# orthogonal derivation always drew, and the connector stays `orthogonalEdgeStyle;jettySize=0`.
# The whole path is (50.75, 263.5) (50.75, 259.5) (146.01, 259.5) (146.01, 263.5) — 4, 95.26 and
# 4 px — beginning and ending on the two pill faces, where the endpoint marks are drawn (stress
# ticket 30). Every gate passes; Q is 0.7705517318633934.
# Test-only input owned by drawio-export ticket 01; the whole pipeline runs, so no stage
