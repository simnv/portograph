# Expected: two cantons side by side. `west` holds a wide site `w-site-a` (four nodes on its first rank) with a zone at its left, and a narrow site
# `w-site-b` with no zone; `east` holds one site with a zone. A full `sync` mesh joins the four tier-1 nodes and the four tier-3 nodes and the two buses
# join, so 7a reserves a riser lane in each sub-tier of tier 2, in the margin of the `west` canton right of `w-site-b`. In the zone sub-tier the only
# group of `west` stands far left, and the zone of `east` has the nearer centre. The lane is held by the group whose frames grow least to hold it
# (`riserHostGrowth`): `w-zone-a#2`, inside the `west` canton. Hosted by the nearer centre, the `east` canton grew across the canton gap to the
# lane and the two canton frames overlapped (G9).
# Test-only input owned by snack-theme ticket 159; test/pipeline/frame-pack-riser.test.ts reads it.
portograph: 2
groups:
  west: { label: West }
  east: { label: East }
  w-top-a: { tier: 1, canton: west }
  w-top-b: { tier: 1, canton: west }
  e-top-a: { tier: 1, canton: east }
  e-top-b: { tier: 1, canton: east }
  w-site-a: { tier: 2, canton: west, label: Site A }
  w-zone-a: { parent: w-site-a, label: Zone A }
  w-site-b: { tier: 2, canton: west, label: Site B }
  e-site: { tier: 2, canton: east, label: Site C }
  e-zone: { parent: e-site, label: Zone C }
  w-low: { tier: 3, canton: west }
  e-low: { tier: 3, canton: east }
nodes:
  w1: { group: w-top-a, class: router, label: W1 }
  w2: { group: w-top-b, class: router, label: W2 }
  e1: { group: e-top-a, class: router, label: E1 }
  e2: { group: e-top-b, class: router, label: E2 }
  wa1: { group: w-site-a, class: router, label: WA1 }
  wa2: { group: w-site-a, class: switch, label: WA2 }
  wa3: { group: w-site-a, class: router, label: WA3 }
  wa4: { group: w-site-a, class: router, label: WA4 }
  wz1: { group: w-zone-a, class: server, label: WZ1 }
  wb1: { group: w-site-b, class: router, label: WB1 }
  wb2: { group: w-site-b, class: switch, label: WB2 }
  ec1: { group: e-site, class: router, label: EC1 }
  ec2: { group: e-site, class: switch, label: EC2 }
  ez1: { group: e-zone, class: server, label: EZ1 }
  x1: { group: w-low, class: router, label: X1 }
  x2: { group: w-low, class: router, label: X2 }
  x3: { group: e-low, class: router, label: X3 }
  x4: { group: e-low, class: router, label: X4 }
links:
