  - [w1, wa3]
  - [w1, wa4]
  - [w2, wb1]
  - [e1, ec1]
  - [e2, ec1]
  - [wa1, wa2]
  - [wa2, wz1]
  - [wb1, wb2]
  - [ec1, ec2]
  - [ec2, ez1]
  - [wz1, x1]
  - [wb2, x2]
  - [ez1, x3]
  - [ez1, x4]
  - { from: w1, to: w2, class: sync }
  - { from: w1, to: e1, class: sync }
  - { from: w1, to: e2, class: sync }
  - { from: w2, to: e1, class: sync }
  - { from: w2, to: e2, class: sync }
  - { from: e1, to: e2, class: sync }
  - { from: x1, to: x2, class: sync }
  - { from: x1, to: x3, class: sync }
  - { from: x1, to: x4, class: sync }
  - { from: x2, to: x3, class: sync }
  - { from: x2, to: x4, class: sync }
  - { from: x3, to: x4, class: sync }
  - { from: w1, to: x1, class: sync }
  - { from: w1, to: x2, class: sync }
  - { from: w1, to: x3, class: sync }
  - { from: w1, to: x4, class: sync }
  - { from: w2, to: x1, class: sync }
  - { from: w2, to: x2, class: sync }
  - { from: w2, to: x3, class: sync }
  - { from: w2, to: x4, class: sync }
