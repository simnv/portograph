# Expected: Two three-rank locations in one tier share their sub-tiers (ranked-groups ticket 03). Each of
# `east` and `west` is a chain gateway, distribution, access under the ISP, so each has three ranks and the
# tier takes three sub-tiers. Rank r of both groups stands on sub-tier r: the two gateways share one row, the
# two distribution switches the next. The two frames stand side by side, each holds only its own nodes and
# they do not overlap.
# Test-only input owned by ranked-groups ticket 03; test/pipeline/frames.test.ts reads the layout.
portograph: 2
groups:
  upstream: { tier: 0, label: Upstream }
  east: { tier: 1, label: East }
  west: { tier: 1, label: West }
nodes:
  isp: { group: upstream, class: provider, label: ISP }
  e-gw: { group: east, class: router, label: East gateway }
  e-dist: { group: east, class: switch, label: East distribution }
  e-acc: { group: east, class: access, label: East access }
  w-gw: { group: west, class: router, label: West gateway }
  w-dist: { group: west, class: switch, label: West distribution }
  w-acc: { group: west, class: access, label: West access }
links:
  - [isp, e-gw]
  - [isp, w-gw]
  - [e-gw, e-dist]
  - [e-dist, e-acc]
  - [w-gw, w-dist]
  - [w-dist, w-acc]
