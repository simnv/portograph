# The same sheet with both directions reversed (R3): the cable is written upper node to lower node, the overlay lower to upper. The side order does not depend on the authored direction.
portograph: 2
profile: network
groups:
  as-a: {tier: 0, label: "AS A"}
  as-b: {tier: 0, label: "AS B"}
  as-r: {tier: 1, label: "AS R"}
  as-p: {tier: 2, label: "AS P"}
nodes:
  c1: {group: as-a, class: router, icon: router, label: C1}
  c2: {group: as-b, class: router, icon: router, label: C2}
  rtr: {group: as-r, class: router, icon: router, label: RTR}
  peer: {group: as-p, class: router, icon: router, label: PEER}
links:
  - [c1, rtr]
  - [c2, rtr]
  - [rtr, peer]
  - [c1, rtr, {class: flow, label: EBGP}]
  - [c2, rtr, {class: flow, label: EBGP}]
  - [peer, rtr, {class: flow, label: EBGP}]
