# Expected: canton-groups ticket 57, fixture 4, from the ELK-between start. A wide anchor tier `core` (tier 0) feeds three units on tier 1
# from left to right: the canton `ca` (member `a-site` on tier 1, `a-lab` on tier 2), the plain group `mid` (tier 1 only), and the canton `cb`
# (`b-site`, `b-lab`). ELK stands `mid` between the two cantons. `mid` is a foreign unit on a tier inside the span of both cantons: between
# their columns it would leave empty room on tier 2. Two overlay links join `mid` to `b-lab`, so the run of cantons holds more of its partners on
# the right of its middle: `mid` goes after the run. No routed link crosses another in either order.
# Test-only input owned by canton-groups ticket 57; test/pipeline/canton-order.test.ts reads the layout.
# The declared row order is pinned (ticket 22 far-end pull): the foreign unit stands where ELK leaves it between the two cantons.
portograph: 2
layout: { corridorRowOrder: false }
groups:
  ca: { label: Canton A }
  cb: { label: Canton B }
  core: { tier: 0, label: Core }
  a-site: { tier: 1, canton: ca, label: Site A }
  a-lab: { tier: 2, canton: ca, label: Lab A }
  mid: { tier: 1, label: Middle }
  b-site: { tier: 1, canton: cb, label: Site B }
  b-lab: { tier: 2, canton: cb, label: Lab B }
nodes:
  core1: { group: core, class: router, label: Core one }
  core2: { group: core, class: router, label: Core two }
  core3: { group: core, class: router, label: Core three }
  core4: { group: core, class: router, label: Core four }
  core5: { group: core, class: router, label: Core five }
  a-gw: { group: a-site, class: router, label: A gateway }
  a-srv: { group: a-lab, class: server, label: A server }
  m-sw: { group: mid, class: switch, label: Middle switch }
  m-srv: { group: mid, class: server, label: Middle server }
  b-gw: { group: b-site, class: router, label: B gateway }
  b-srv: { group: b-lab, class: server, label: B server }
links:
  - [core2, a-gw]
  - [core4, b-gw]
  - [a-gw, a-srv]
  - [b-gw, b-srv]
  - { from: m-srv, to: a-srv, class: flow }
  - { from: m-sw, to: b-srv, class: flow }
  - { from: m-srv, to: b-srv, class: flow }
