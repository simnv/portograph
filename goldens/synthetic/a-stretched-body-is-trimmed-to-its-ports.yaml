# Expected: A body that the centring stretched is trimmed to its ports after placement (architecture-2 ticket 68, the end trim).
# Reduced from a-face-aligns-one-port-and-leaves-a-chord-port-in-place. The sink `sink-near` has three feeds: two
# switches of the tier above and the router `src-a` two tiers up. The centring grows its body toward feeds it does not
# keep; after the last move of 7f the body ends at its outer top ports with their insets, never below its content.
# Ports keep their x, no node moves inside its group, and every link keeps its route and its bends. The group box of `near`
# shrinks with the body. Then `far` closes up toward `near` by 48 px, the width the trim freed, and the corridor of
# `src-b` -> `sink-far` follows its port (architecture-2 ticket 69): canvas 395 to 346 px. Test `test/layout/end-trim.test.ts`
# reads the layout.
# The nodes are declared so that the canonical link order (decision review D-Q1, ticket DR-04) is the order the links are written in;
# the order of the nodes inside each group is unchanged.
portograph: 2
groups:
  src: { tier: 0 }
  access: { tier: 1 }
  far: { tier: 2 }
  near: { tier: 2 }
nodes:
  sw-1: { group: access, class: switch, ports: [] }
  sink-near: { group: near, class: server, ports: [] }
  sw-2: { group: access, class: switch, ports: [] }
  src-a: { group: src, class: router, ports: [] }
  src-b: { group: src, class: router, ports: [] }
  sink-far: { group: far, class: server, ports: [] }
links:
  - [sw-1, sink-near]
  - [sw-2, sink-near]
  - [src-a, sink-near]
  - [src-b, sink-far]
