# Expected: A body that the centring stretched is trimmed to its ports after placement (architecture-2 ticket 68, the end trim).
# Reduced from a-face-aligns-one-port-and-leaves-a-chord-port-in-place. `near` and `access` are grids: a grid cell does not move, so
# the seat of `sink-near` grows it in place over two of its five feeds (80 px to 362 px, dx 0, under the alignment cap of ADR-0027).
# After the last move of 7f the body ends at its outer top ports with their insets (127.5 px), never below its content. Ports keep
# their x, no node moves inside its group, and every link keeps its route and its bends. The group box of `near` shrinks with the
# body, and `far` closes up toward it (67.5 px). Since dense-16x9 ticket 02 a step that grows a body and leaves every aligned port of its group
# off its feed is declined whole, so the first version (no grids, four feeds) has nothing to trim; the grids and the feed from `src-c` give the
# premise back. Test `test/layout/end-trim.test.ts` reads the layout (with the group lift off).
# DR-04: links take the canonical order (group declaration order, then node order inside the group), so `access` is declared
# before `src`; the canonical order is then the written order.
portograph: 2
groups:
  access: { tier: 1, shape: grid }
  src: { tier: 0 }
  far: { tier: 2 }
  near: { tier: 2, shape: grid }
nodes:
  src-a: { group: src, class: router, ports: [] }
  src-b: { group: src, class: router, ports: [] }
  src-c: { group: src, class: router, ports: [] }
  sw-1: { group: access, class: switch, ports: [] }
  sw-2: { group: access, class: switch, ports: [] }
  sink-near: { group: near, class: server, ports: [] }
  sink-far: { group: far, class: server, ports: [] }
links:
  - [sw-1, sink-near]
  - [src-a, sink-near]
  - [src-b, sink-far]
  - [src-b, sink-near]
  - [src-c, sink-near]
  - [sw-2, sink-near]
