# Expected: architecture-2 ticket 74, a regression of the tier-gap solve (a reduced, anonymized real sheet). The column pull of tier 1
# (`holdColumnAxes`) pools the frame g2, which pulls toward its feed on n5, with the row group g1. g1 has no feed range: with n5 last
# in its row the seat lines the bundle n6 -> n5 up from n6 (`Bundle.lead` n6, n5 grows to it); in the other slots the block stands
# bent. Pooled with a wish to stay where it stood, g1 took half of g2's deficit at each call, so every replay moved tier 1 in x, and the
# rebuild in y of the tier-gap solve threw. A unit with no feed range now has no wish: g2 reaches its feed in one call and pushes g1,
# and a second call keeps the plan. The sheet publishes, the three bundle links stand vertical, and n5 publishes in every slot of the
# g0 row (on main slots 0, 2 and 5 threw). Test test/layout/column-pull-wish.test.ts.
portograph: 2
theme: snack
layout: { nodeContent: card }
groups:
  g0: { tier: 0 }
  g1: { tier: 1 }
  g2: { tier: 1 }
  g3: { parent: g2 }
nodes:
  n0: { group: g0, label: n0 }
  n1: { group: g0, label: n1 }
  n2: { group: g0, label: n2 }
  n3: { group: g0, label: n3, description: dxxxxxxxxxxxxxxxxxxx }
  n4: { group: g0, icon: cloud, label: n4xxxxxxx }
  n5: { group: g0, label: n5 }
  n6: { group: g1, label: n6, ports: [{ name: p0 }, { name: p1 }, { name: p2 }] }
  n7: { group: g1, label: n7, description: dxxxxxxxxxxxxxx }
  n8: { group: g1, icon: switch, label: n8xxxxxxxxxx }
  n9: { group: g2, label: n9, description: dxxxxxxxxxxxxxxxx, ports: [{ name: p0 }] }
  n10: { group: g2, icon: server, label: n10xxxx }
  n11: { group: g3, label: n11 }
links:
  - [n6.p0, n5]
  - [n6.p1, n5]
  - [n6.p2, n5]
  - [n9.p0, n5, { label: l3xxxxxxxxx }]
