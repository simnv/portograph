# Expected: the course round reads a perimeter lane beside the box its group has when stage 7a stands the lane, not beside
# the box the linked-group grid widens in 7f (architecture-2 ticket 22). The row Top is declared rB, f2, f1, rA; f1 feeds
# s1, which stands right of the wide body n1. In the baseline the grid widens Top onto the extent of Low, so a lane read
# off that box stands about 56 px right of s1's top port, out of the reach 7c seats a port under a lane, and the course
# entered s1 on its right side with three turns. Read off the box before the grid (the nodes, the insets and the title),
# the lane stands over s1's top port, and the link drops into it with two turns, as it does in the declared order rB, f1,
# f2, rA. The grid refuses a widening across a reserved lane, so the trial never has the wide box.
# Test-only input owned by architecture-2 ticket 22; test/pipeline/course-round.test.ts runs the whole pipeline on it.
portograph: 2
profile: network
layout: { farEndPull: false }
groups:
  top: {tier: 0, label: Top}
  low: {tier: 1, label: Low}
nodes:
  rB: {group: top, class: router, label: RB, ports: [{name: q, side: bottom}]}
  f2: {group: top, label: F2}
  f1: {group: top, label: F1}
  rA: {group: top, class: router, label: RA, ports: [{name: p1, side: bottom}, {name: p2, side: bottom}, {name: p3, side: bottom}]}
  n1: {group: low, label: N1, ports: [{name: a1, side: top}, {name: a2, side: top}, {name: a3, side: top}, {name: b, side: top}]}
  s1: {group: low, label: S1}
links:
- [rA.p1, n1.a1]
- [rA.p2, n1.a2]
- [rA.p3, n1.a3]
- [rB.q, n1.b]
- [f1, s1]
