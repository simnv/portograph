portograph: 2
profile: network
title: Build a Transit Network with IBGP
groups:
  as-65100:
    tier: 0
    label: "ISP: AS 65100"
  as-65000:
    tier: 1
    label: "Customer: AS 65000"
nodes:
  ext:
    group: as-65100
    label: EXT
    class: router
    icon: router
  pe1:
    group: as-65000
    label: PE1
    class: router
    icon: router
  core:
    group: as-65000
    label: CORE
    class: router
    icon: router
  pe2:
    group: as-65000
    label: PE2
    class: router
    icon: router
links:
  - id: src-link-001
    from: core
    to: pe1
  - id: src-link-003
    from: pe1
    to: ext
    label: Inter-AS link
  - id: src-link-005
    from: pe2
    to: ext
    label: PE2 stub interface
  - id: src-link-006
    from: core
    to: pe2
  - id: ses-01
    from: ext
    to: pe1
    class: flow
    label: EBGP
  - id: ses-02
    from: pe1
    to: pe2
    class: flow
    label: IBGP
