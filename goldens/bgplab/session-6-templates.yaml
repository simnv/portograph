# Fetched: 2026-11-06
# Conversion: authored from static YAML and reference PNG; recipe bgplab-v1 plus decision-addendum
# Kept: 4 real nodes; 0 AS/site boxes; 4 physical pairs; 0 LANs; no one-ended stubs; all retained source link names
# Added: none
# Simplified: Preserve spine row above leaf row using required empty-label structural groups; no AS box is drawn. Static global AS 65000 is known but not a container. RR role comes from spines.bgp.rr and the RR badges. Router/server/cloud icons substitute source artwork.
# Dropped links: none
# Sessions: 0 overlay (class flow) from the drawing: none
# Dropped annotations: "BGP Session Templates" note and orange endpoint dots; RR badges represented by rr class with server icon
# Dropped configuration: addressing and prefixes, protocol settings and policies, IDs and router IDs, timers, validation includes, plugins, defaults and deployment instructions; no credential values
# Tiers/order: spines=0 [s1, s2]; leafs=1 [l1, l2]; declared nodes follow reference reading order; engine may reorder
# Aliases: none confirmed; see notes for duplicate nominations
portograph: 2
profile: network
title: BGP Session Templates
groups:
  spines:
    tier: 0
    label: ""
  leafs:
    tier: 1
    label: ""
nodes:
  s1:
    group: spines
    label: S1
    class: rr
    icon: server
  s2:
    group: spines
    label: S2
    class: rr
    icon: server
  l1:
    group: leafs
    label: L1
    class: router
    icon: router
  l2:
    group: leafs
    label: L2
    class: router
    icon: router
links:
  - id: src-link-001
    from: l1
    to: s1
  - id: src-link-002
    from: l1
    to: s2
  - id: src-link-003
    from: l2
    to: s1
  - id: src-link-004
    from: l2
    to: s2
