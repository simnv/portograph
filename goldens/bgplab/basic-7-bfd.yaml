# Aliases: none
portograph: 2
profile: network
title: Use BGP Timers and BFD to Speed Up BGP Convergence
groups:
  as-65000:
    tier: 0
    label: AS 65000
  as-65100:
    tier: 1
    label: AS 65100
  as-65001:
    tier: 2
    label: AS 65001
nodes:
  r1:
    group: as-65000
    label: R1
    class: router
    icon: router
  x1:
    group: as-65100
    label: X1
    class: router
    icon: router
  r2:
    group: as-65001
    label: R2
    class: router
    icon: router
links:
  - id: src-link-001
    from: r1
    to: x1
  - id: src-link-003
    from: r2
    to: x1
  - id: ses-01
    from: r1
    to: x1
    class: flow
    label: EBGP
  - id: ses-02
    from: x1
    to: r2
    class: flow
    label: EBGP
