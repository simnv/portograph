# Conversion: authored from static YAML and reference PNG; recipe bgplab-v1 plus decision-addendum
# Kept: 3 real nodes; 3 AS/site boxes; 2 physical pairs; 0 LANs; no one-ended stubs; all retained source link names
# Added: none
# Simplified: Rotate the customer-left/provider-right hierarchy into customer tier 0, providers tier 1; initial provider order X1, X2. Customer box has no ASN in the drawing; do not add the static ASN to its label. Router/server/cloud icons substitute source artwork.
# Dropped links: none
# Sessions: 2 overlay (class flow) from the drawing: rtr-x1 EBGP, rtr-x2 EBGP
# Dropped annotations: AS 65000 and AS 65007 callout balloons pointing to RTR
# Dropped configuration: addressing and prefixes, protocol settings and policies, IDs and router IDs, timers, validation includes, plugins, defaults and deployment instructions; no credential values
# Tiers/order: as-customer=0 [rtr]; as-65100=1 [x1]; as-65101=1 [x2]; declared nodes follow reference reading order; engine may reorder
# Aliases: none confirmed; see notes for duplicate nominations
portograph: 2
profile: network
title: Use Multiple AS Numbers on the Same Router
groups:
  as-customer:
    tier: 0
    label: Customer
  as-65100:
    tier: 1
    label: "ISP-1: AS 65100"
  as-65101:
    tier: 1
    label: "ISP-2: AS 65101"
nodes:
  rtr:
    group: as-customer
    label: RTR
    class: router
    icon: router
  x1:
    group: as-65100
    label: X1
    class: router
    icon: router
  x2:
    group: as-65101
    label: X2
    class: router
    icon: router
links:
  - id: src-link-001
    from: rtr
    to: x1
  - id: src-link-002
    from: rtr
    to: x2
  - id: ses-01
    from: rtr
    to: x1
    class: flow
    label: EBGP
  - id: ses-02
    from: rtr
    to: x2
    class: flow
    label: EBGP
