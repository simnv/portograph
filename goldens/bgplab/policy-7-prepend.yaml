# Reference: https://github.com/bgplab/bgplab/blob/4bd74dbc7f19f172d51cda9ff681303f7e152a5a/docs/policy/topology-prepend.png
# Licence: MIT; Copyright (c) 2023–2024 Ivan Pepelnjak
# Author: Ivan Pepelnjak (bgplab/bgplab)
# Fetched: 2026-11-06
# Conversion: authored from static YAML and reference PNG; recipe bgplab-v1
# Kept: 3 real nodes (rtr, x1, x2), 3 AS boxes, 3 physical pairs (src-link-001..003), 0 LANs, 0 stubs; link names
#   Primary uplink, Backup uplink, Inter-ISP link kept as labels.
# Added: link labels (source names the PNG omits).
# Simplified: orientation rotated.
# Dropped links: none.
# Dropped annotations: Callouts "Primary uplink, No prepending" and "Backup uplink, Prepend AS 65000" with link-end
#   markers; EBGP arrows kept as sessions.
# Dropped configuration: originated prefixes, loopbacks, router IDs, bgp.advertise_loopback, validation. No plugin
#   data beyond check_validate.
# Sessions: 2 overlay (class flow) from the drawing: rtr-x1 EBGP, rtr-x2 EBGP.
# Tiers/order: Rotated: the PNG has AS 65000 on the left and X1 above X2 on the right; left becomes tier 0 (top).
#   as-65000 = tier 0 [rtr]; as-65100 = tier 1 [x1]; as-65101 = tier 1 [x2]. Reading order: rtr, x1, x2.
# Aliases: none (the link labels make it differ from policy-1-weights).
portograph: 2
profile: network
title: "Use AS-Path Prepending to Influence Incoming Traffic Flow"
groups:
  as-65000: { tier: 0, label: "AS 65000" }
  as-65100: { tier: 1, label: "AS 65100" }
  as-65101: { tier: 1, label: "AS 65101" }
nodes:
  rtr: { group: as-65000, label: RTR, class: router, icon: router }
  x1: { group: as-65100, label: X1, class: router, icon: router }
  x2: { group: as-65101, label: X2, class: router, icon: router }
links:
  - [rtr, x1, { id: src-link-001, label: "Primary uplink" }]
  - [rtr, x2, { id: src-link-002, label: "Backup uplink" }]
  - [x1, x2, { id: src-link-003, label: "Inter-ISP link" }]
  - [rtr, x1, { id: ses-01, class: flow, label: "EBGP" }]
  - [rtr, x2, { id: ses-02, class: flow, label: "EBGP" }]
