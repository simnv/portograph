  lan-1: { group: g-lan, label: Access VLAN, class: cloud, icon: cloud }
  s1: { group: g-hosts, label: S1, class: server, icon: server }
  s2: { group: g-hosts, label: S2, class: server, icon: server }
  s3: { group: g-hosts, label: S3, class: server, icon: server }
  c: { group: g-hosts, label: C, class: server, icon: server }
links:
  - [sw, lan-1, { id: src-link-001-leg-01 }]
  - [s1, lan-1, { id: src-link-001-leg-02 }]
  - [s2, lan-1, { id: src-link-001-leg-03 }]
  - [s3, lan-1, { id: src-link-001-leg-04 }]
  - [c, lan-1, { id: src-link-001-leg-05 }]
