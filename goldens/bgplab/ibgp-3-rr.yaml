# Aliases: none confirmed; see notes for duplicate nominations
portograph: 2
profile: network
title: Use BGP Route Reflectors
groups:
  spines:
    tier: 0
    label: ""
  leafs:
    tier: 1
    label: ""
nodes:
  s1:
    group: spines
    label: S1
    class: router
    icon: router
  s2:
    group: spines
    label: S2
    class: router
    icon: router
  l1:
    group: leafs
    label: L1
    class: router
    icon: router
  l2:
    group: leafs
    label: L2
    class: router
    icon: router
  l3:
    group: leafs
    label: L3
    class: router
    icon: router
  l4:
    group: leafs
    label: L4
    class: router
    icon: router
links:
