# Simplified: Preserve spine row above leaf row using required empty-label structural groups; no AS box is drawn. Static global AS 65000 is known but not a container. The initial configuration has no bgp.rr and the reference has no RR badges, so all six nodes remain routers. Router/server/cloud icons substitute source artwork.
