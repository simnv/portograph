    from: l1
    to: s1
  - id: src-link-002
    from: l1
    to: s2
  - id: src-link-003
    from: l2
    to: s1
  - id: src-link-004
    from: l2
    to: s2
  - id: src-link-005
    from: l3
    to: s1
  - id: src-link-006
    from: l3
    to: s2
  - id: src-link-007
    from: l4
    to: s1
  - id: src-link-008
    from: l4
    to: s2
