# Aliases: none confirmed; see notes for duplicate nominations
portograph: 2
profile: network
title: Dynamic BGP Peers
groups:
  as-65100-site-a:
    tier: 0
    label: AS 65100
  as-65100-site-b:
    tier: 0
    label: AS 65100
  medium:
    tier: 1
    label: ""
  as-65000:
    tier: 2
    label: "Core: AS 65000"
nodes:
  s1:
    group: as-65100-site-a
    label: S1
    class: router
    icon: router
  s2:
    group: as-65100-site-b
    label: S2
    class: router
    icon: router
  lan-1:
    group: medium
    label: Carrier Ethernet
    class: cloud
    icon: cloud
  hub:
    group: as-65000
    label: Hub
    class: router
    icon: router
  c1:
    group: as-65000
    label: C1
    class: router
    icon: router
  c2:
    group: as-65000
    label: C2
    class: router
    icon: router
links:
  - id: src-link-001-leg-01
    from: hub
    to: lan-1
  - id: src-link-001-leg-02
    from: s1
    to: lan-1
  - id: src-link-001-leg-03
    from: s2
    to: lan-1
  - id: src-link-002
    from: hub
    to: c1
  - id: src-link-003
    from: hub
    to: c2
  - id: src-link-004
    from: c1
    to: c2
  - id: ses-01
    from: hub
    to: s1
    class: flow
    label: EBGP
  - id: ses-02
    from: hub
    to: c1
    class: flow
    label: IBGP
  - id: ses-03
    from: hub
    to: s2
    class: flow
    label: EBGP
  - id: ses-04
    from: hub
    to: c2
    class: flow
    label: IBGP
