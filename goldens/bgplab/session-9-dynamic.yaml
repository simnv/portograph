# Added: lan-1: Carrier Ethernet; participants [hub, s1, s2]; Expand literal members of groups with _auto_create enabled to all five real nodes. The drawing shows sessions only. Retain source cables Hub-C1, Hub-C2, C1-C2 and the shared Hub/S1/S2 LAN as physical additions; these coexist with the four drawn BGP overlays.
# Simplified: Rotate the sites-left/core-right hierarchy into sites tier 0, Core tier 2 with neutral medium tier 1; retain the separate AS 65100 boxes. Initial site order S1, S2; Core order Hub, C1, C2. Router/server/cloud icons substitute source artwork.
