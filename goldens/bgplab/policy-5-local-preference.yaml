# Source: https://github.com/bgplab/bgplab/blob/4bd74dbc7f19f172d51cda9ff681303f7e152a5a/policy/5-local-preference/topology.yml
# Reference: https://github.com/bgplab/bgplab/blob/4bd74dbc7f19f172d51cda9ff681303f7e152a5a/docs/policy/topology-locpref.png
# Licence: MIT; Copyright (c) 2023–2024 Ivan Pepelnjak
# Author: Ivan Pepelnjak (bgplab/bgplab)
# Fetched: 2026-11-06
# Conversion: authored from static YAML and reference PNG; recipe bgplab-v1
# Kept: 4 real nodes (c1, c2, x1, x2), 2 AS boxes (ISP: AS 65100, Customer: AS 65000), 4 physical pairs (src-link-001,
#   003, 005, 006), 0 LANs, 0 stubs; names kept as labels.
# Added: none (the labels are source names).
# Simplified: src-link-003 (x1-x2) and src-link-006 (c1-c2) are `type: lan` with two participants; kept as ordinary
#   links. Netlab groups external/customer match the two drawn boxes.
# Dropped links: src-link-002 c1-x2 and src-link-004 c2-x1: named "Unused link", pool l2only, comment "Used for
#   compliance with 4-router topology"; the lab page says the unused links retain interface names; not drawn.
# Dropped annotations: Callouts "Primary uplink, High local preference" and "Backup uplink, Low local preference"; the
#   two OSPF arrows (x1-x2 and c1-c2, non-BGP, dropped).
# Dropped configuration: addresses and prefixes, default-originate, ospf.area, bgp.advertise_loopback and
#   bgp.advertise, router IDs, validation, plugin/_adjust data.
# Sessions: 4 overlay (class flow) from the drawing: x1-x2 IBGP (grey arrow), x1-c1 EBGP, x2-c2 EBGP, c1-c2 IBGP. Grey
#   arrows are drawn BGP sessions and are kept.
# Tiers/order: Two stacked boxes: isp = tier 0 [x1, x2]; customer = tier 1 [c1, c2]. Reading order: x1, x2, c1, c2.
# Aliases: policy/6-med (same body, own title).
portograph: 2
profile: network
title: "Select Preferred Uplink with BGP Local Preference"
groups:
  isp: { tier: 0, label: "ISP: AS 65100" }
  customer: { tier: 1, label: "Customer: AS 65000" }
nodes:
  x1: { group: isp, label: X1, class: router, icon: router }
  x2: { group: isp, label: X2, class: router, icon: router }
  c1: { group: customer, label: C1, class: router, icon: router }
  c2: { group: customer, label: C2, class: router, icon: router }
links:
  - [c1, x1, { id: src-link-001, label: "Primary uplink" }]
  - [x1, x2, { id: src-link-003, label: "ISP internal link" }]
  - [c2, x2, { id: src-link-005, label: "Backup uplink" }]
  - [c1, c2, { id: src-link-006, label: "Customer internal link" }]
  - [x1, x2, { id: ses-01, class: flow, label: "IBGP" }]
  - [x1, c1, { id: ses-02, class: flow, label: "EBGP" }]
  - [x2, c2, { id: ses-03, class: flow, label: "EBGP" }]
  - [c1, c2, { id: ses-04, class: flow, label: "IBGP" }]
