# Added: none; Retain all four explicitly drawn BGP sessions, including the grey EBGP arrows; grey denotes existing configuration, not another physical class. Simplify the two-member LAN R1-R2 to one physical link; preserve the literal source name Intra-site LAN C1-C2 although its node names differ.; source-only retained cable labels: src-link-001 "WAN uplink R1-to-X1"; src-link-003 "Inter-ISP link X1-to-X2"; src-link-005 "WAN uplink R2-to-X2"; src-link-006 "Intra-site LAN C1-C2"
# Simplified: Preserve both ISPs above the customer box; initial ISP order X1, X2 and customer order R1, R2. Router/server/cloud icons substitute source artwork.
# Dropped links: src-link-002: r1 - x2 omitted, source explicitly names "Unused WAN link" and reference omits it. src-link-004: r2 - x1 omitted, source explicitly names "Unused WAN link" and reference omits it.
# Sessions: 4 overlay (class flow) from the drawing: x1-x2 EBGP, x1-r1 EBGP, x2-r2 EBGP, r1-r2 IBGP
# Dropped annotations: OSPF double arrow R1-R2; source colours distinguish existing and exercise sessions
# Dropped configuration: addressing and prefixes, protocol settings and policies, IDs and router IDs, timers, validation includes, plugins, defaults and deployment instructions; no credential values
# Tiers/order: as-65100=0 [x1]; as-65101=0 [x2]; as-65000=1 [r1, r2]; declared nodes follow reference reading order; engine may reorder
# Aliases: none confirmed; see notes for duplicate nominations
portograph: 2
profile: network
title: Establish an IBGP Session Between WAN Edge Routers
groups:
  as-65100:
    tier: 0
    label: "ISP-1: AS 65100"
  as-65101:
    tier: 0
    label: "ISP-2: AS 65101"
  as-65000:
    tier: 1
    label: "Customer: AS 65000"
nodes:
  x1:
    group: as-65100
    label: X1
    class: router
    icon: router
  x2:
    group: as-65101
    label: X2
    class: router
    icon: router
  r1:
    group: as-65000
    label: R1
    class: router
    icon: router
  r2:
    group: as-65000
    label: R2
    class: router
    icon: router
links:
  - id: src-link-001
    from: r1
    to: x1
    label: WAN uplink R1-to-X1
  - id: src-link-003
    from: x1
    to: x2
    label: Inter-ISP link X1-to-X2
  - id: src-link-005
    from: r2
    to: x2
    label: WAN uplink R2-to-X2
  - id: src-link-006
    from: r1
    to: r2
    label: Intra-site LAN C1-C2
  - id: ses-01
    from: x1
    to: x2
    class: flow
    label: EBGP
  - id: ses-02
    from: x1
    to: r1
    class: flow
    label: EBGP
  - id: ses-03
    from: x2
    to: r2
    class: flow
    label: EBGP
  - id: ses-04
    from: r1
    to: r2
    class: flow
    label: IBGP
