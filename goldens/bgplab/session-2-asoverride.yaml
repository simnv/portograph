    tier: 0
    label: Site A AS 65000
  as-65100:
    tier: 1
    label: "ISP: AS 65100"
  as-65000-site-b:
    tier: 2
    label: Site B AS 65000
nodes:
  ce1:
    group: as-65000-site-a
    label: CE1
    class: router
    icon: router
  pe1:
    group: as-65100
    label: PE1
    class: router
    icon: router
  pe2:
    group: as-65100
    label: PE2
    class: router
    icon: router
  ce2:
    group: as-65000-site-b
    label: CE2
    class: router
    icon: router
links:
  - id: src-link-001
    from: pe1
    to: ce1
    label: PE1-to-CE1
  - id: src-link-005
    from: pe2
    to: ce2
    label: PE2-to-CE2
  - id: src-link-006
    from: pe1
    to: pe2
    label: SP internal link
