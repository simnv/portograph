portograph: 2
profile: network
title: Configuring BGP on FRRouting
groups:
  as-65000:
    tier: 0
    label: AS 65000
  as-65100:
    tier: 1
    label: AS 65100
nodes:
  rtr:
    group: as-65000
    label: RTR
    class: router
    icon: router
  x1:
    group: as-65100
    label: X1
    class: router
    icon: router
links:
  - id: src-link-001
    from: rtr
    to: x1
  - id: ses-01
    from: rtr
    to: x1
    class: flow
    label: EBGP
