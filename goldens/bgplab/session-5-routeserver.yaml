# Kept: 4 real nodes; 4 AS/site boxes; 0 physical pairs; 1 LANs; no one-ended stubs; all retained source link names
# Added: lan-1: IXP LAN; participants [rs, isp1, isp2, isp3]; The source LAN explicitly includes RS, ISP1, ISP2, ISP3. The PNG bus has no separate RS leg. Add the source-required RS leg; the three EBGP arrows remain overlays and never stand in for the cable.
# Simplified: Preserve IXP above participants; insert the required neutral medium group between them. Router/server/cloud icons substitute source artwork.
# Dropped links: none
# Sessions: 3 overlay (class flow) from the drawing: rs-isp1 EBGP, rs-isp2 EBGP, rs-isp3 EBGP
# Dropped annotations: LAN bus square end caps and source icon styling
# Dropped configuration: addressing and prefixes, protocol settings and policies, IDs and router IDs, timers, validation includes, plugins, defaults and deployment instructions; no credential values
# Tiers/order: as-65000=0 [rs]; medium=1 [lan-1]; as-65100=2 [isp1]; as-65103=2 [isp2]; as-65107=2 [isp3]; declared nodes follow reference reading order; engine may reorder
# Aliases: policy/c-cond-advertise (its topology.yml is a copy of the route-server lab and its drawing shows rtr/x1/x2: an upstream inconsistency; ruling R5)
portograph: 2
profile: network
title: BGP Route Server in an Internet Exchange Point
groups:
  as-65000:
    tier: 0
    label: "IXP: AS 65000"
  medium:
    tier: 1
    label: ""
  as-65100:
    tier: 2
    label: AS 65100
  as-65103:
    tier: 2
    label: AS 65103
  as-65107:
    tier: 2
    label: AS 65107
nodes:
  rs:
    group: as-65000
    label: RS
    class: route-server
    icon: server
  lan-1:
    group: medium
    label: IXP LAN
    class: cloud
    icon: cloud
  isp1:
    group: as-65100
    label: ISP1
    class: router
    icon: router
  isp2:
    group: as-65103
    label: ISP2
    class: router
    icon: router
  isp3:
    group: as-65107
    label: ISP3
    class: router
    icon: router
links:
  - id: src-link-001-leg-01
    from: rs
    to: lan-1
  - id: src-link-001-leg-02
    from: isp1
    to: lan-1
  - id: src-link-001-leg-03
    from: isp2
    to: lan-1
  - id: src-link-001-leg-04
    from: isp3
    to: lan-1
  - id: ses-01
    from: rs
    to: isp1
    class: flow
    label: EBGP
  - id: ses-02
    from: rs
    to: isp2
    class: flow
    label: EBGP
  - id: ses-03
    from: rs
    to: isp3
    class: flow
    label: EBGP
