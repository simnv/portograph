  ce2: { group: as-65002, label: CE2, class: router, icon: router }
  xa: { group: as-65200, label: XA, class: router, icon: router }
  ce1: { group: as-65001, label: CE1, class: router, icon: router }
  pe1: { group: as-65100, label: PE1, class: router, icon: router }
  c1: { group: as-65100, label: C1, class: router, icon: router }
  xb: { group: as-65201, label: XB, class: router, icon: router }
links:
