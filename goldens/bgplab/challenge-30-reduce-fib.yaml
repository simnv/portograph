  as-65002: { tier: 0, label: "Customer AS 65002" }
  as-65200: { tier: 0, label: "Upstream-A AS 65200" }
  as-65001: { tier: 1, label: "Customer AS 65001" }
  as-65100: { tier: 1, label: "ISP: AS 65100" }
  as-65201: { tier: 1, label: "Upstream-B AS 65201" }
nodes:
