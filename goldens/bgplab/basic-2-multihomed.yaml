# Fetched: 2026-11-06
# Conversion: authored from static YAML and reference PNG; recipe bgplab-v1
# Kept: 3 real nodes; 3 displayed AS boxes; 2 physical pairs including 0 stub legs; 0 LANs; all visible router labels
# Sessions: 2 overlay (class flow) from the drawing: rtr-x1 EBGP, rtr-x2 EBGP
# Added: none
# Simplified: source left-to-right hierarchy rotated into top-to-bottom tiers; standard icons replace artwork; no port or layout hints
# Dropped links: none
# Dropped annotations: none
# Dropped configuration: addressing, route origination/policy, protocol timers/options, validation, plugins, device/deployment data and credentials; no credential values retained
# Tiers/order: as-65000=0, as-65100=1, as-65101=1; group and node declaration follows PNG reading order, source order breaks ties; engine may reorder
# Aliases: basic/3-originate, basic/4-ipv6, basic/d-interface, session/7-policy (same body; own titles; session/7 PNG differs only in two dropped "Policy template" callouts)
portograph: 2
profile: network
title: Configure Multiple EBGP Sessions
groups:
  as-65000:
    tier: 0
    label: AS 65000
  as-65100:
    tier: 1
    label: AS 65100
  as-65101:
    tier: 1
    label: AS 65101
nodes:
  rtr:
    group: as-65000
    label: RTR
    class: router
    icon: router
  x1:
    group: as-65100
    label: X1
    class: router
    icon: router
  x2:
    group: as-65101
    label: X2
    class: router
    icon: router
links:
  - id: src-link-001
    from: rtr
    to: x1
  - id: src-link-002
    from: rtr
    to: x2
  - id: ses-01
    from: rtr
    to: x1
    class: flow
    label: EBGP
  - id: ses-02
    from: rtr
    to: x2
    class: flow
    label: EBGP
