# Fetched: 2026-11-06
# Conversion: authored from static YAML and reference PNG; recipe bgplab-v1
# Kept: 7 real nodes (c1, c2, x1, x2, uc200, uc205, uc207), 6 AS boxes (AS 65200, AS 65205, AS 65207, ISP-1: AS 65100,
#   ISP-2: AS 65101, Customer: AS 65000), 10 physical pairs minus 2 omitted = 8 (src-link-001, 003, 005..010), 0 LANs,
#   0 stubs; names kept as labels.
# Added: uc200, uc205, uc207 and src-link-007..010: active links and nodes of the full 7-node lab; not in the main PNG
#   and the nodes come from topology.yml; the second reference docs/policy/policy-extra-asn.png draws only their AS
#   boxes (AS 65200 over ISP-1; AS 65205 between ISP-1 and ISP-2; AS 65207 over ISP-2) and grey links, no router; its
#   boxes and tier rows are used here. Also added: the source link names are kept as link labels: "Primary uplink"
#   (src-link-001), "Inter-ISP link" (src-link-003), "Backup uplink" (src-link-005), "Customer internal link"
#   (src-link-006).
# Simplified: src-link-006 (c1-c2) is a two-participant `type: lan`, kept as an ordinary link.
# Dropped links: src-link-002 c1-x2 and src-link-004 c2-x1: named "Unused link", pool l2only, comment "Used for
#   compliance with 4-router topology"; not drawn. (topology.4-router.yml, a variant without uc nodes, not used.)
# Dropped annotations: the callout shapes of "Primary uplink" and "Backup uplink" (their texts stay as link labels); the OSPF arrow c1-c2 (non-BGP). The extra-ASN
#   PNG draws no arrows.
# Dropped configuration: addresses, loopbacks, router IDs, ids, bgp.advertise_loopback and bgp.advertise, ospf module,
#   per-device extra-config templates (not read). No credentials.
# Sessions: 4 overlay (class flow) from the drawing: x1-x2 EBGP (grey), x1-c1 EBGP (grey), x2-c2 EBGP (grey), c1-c2
#   IBGP (red).
# Tiers/order: Top to bottom as in the two PNGs: as-65200, as-65205, as-65207 = tier 0 [uc200], [uc205], [uc207];
#   isp-1 = tier 1 [x1]; isp-2 = tier 1 [x2]; customer = tier 2 [c1, c2]. Reading order: uc200, uc205, uc207, x1, x2,
#   c1, c2.
# Aliases: none.
portograph: 2
profile: network
title: "BGP Local Preference in a Complex Routing Policy"
groups:
  as-65200: { tier: 0, label: "AS 65200" }
  as-65205: { tier: 0, label: "AS 65205" }
  as-65207: { tier: 0, label: "AS 65207" }
  isp-1: { tier: 1, label: "ISP-1: AS 65100" }
  isp-2: { tier: 1, label: "ISP-2: AS 65101" }
  customer: { tier: 2, label: "Customer: AS 65000" }
nodes:
  uc200: { group: as-65200, label: uc200, class: router, icon: router }
  uc205: { group: as-65205, label: uc205, class: router, icon: router }
  uc207: { group: as-65207, label: uc207, class: router, icon: router }
  x1: { group: isp-1, label: X1, class: router, icon: router }
  x2: { group: isp-2, label: X2, class: router, icon: router }
  c1: { group: customer, label: C1, class: router, icon: router }
  c2: { group: customer, label: C2, class: router, icon: router }
links:
  - [c1, x1, { id: src-link-001, label: "Primary uplink" }]
  - [x1, x2, { id: src-link-003, label: "Inter-ISP link" }]
  - [c2, x2, { id: src-link-005, label: "Backup uplink" }]
  - [c1, c2, { id: src-link-006, label: "Customer internal link" }]
  - [x1, uc200, { id: src-link-007 }]
  - [x1, uc205, { id: src-link-008 }]
  - [x2, uc205, { id: src-link-009 }]
  - [x2, uc207, { id: src-link-010 }]
  - [x1, x2, { id: ses-01, class: flow, label: "EBGP" }]
  - [x1, c1, { id: ses-02, class: flow, label: "EBGP" }]
  - [x2, c2, { id: ses-03, class: flow, label: "EBGP" }]
  - [c1, c2, { id: ses-04, class: flow, label: "IBGP" }]
