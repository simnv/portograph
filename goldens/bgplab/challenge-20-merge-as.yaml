# Added: none. Source link 9 (pe2-pe3, pool l2only) is drawn in the PNG as the join between the two orgs, so it is kept.
# Simplified: RR1 and RR2 are class rr with the server glyph; the drawing shows the router glyph. The drawing's left-to-right row is rotated into vertical tiers.
