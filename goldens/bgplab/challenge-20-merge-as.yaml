# Dropped annotations: none (all arrows are BGP sessions).
# Dropped configuration: addressing, originated prefixes, router ids, loopbacks, OSPF and IS-IS module settings.
# Sessions: 7 overlay (class flow) from the drawing: x1-pe1 EBGP, pe1-rr1 IBGP, rr1-pe2 IBGP, pe2-pe3 BGP, pe3-rr2 IBGP, rr2-pe4 IBGP, pe4-x2 EBGP
# Tiers/order: rotated left to right into tiers. 0 as-65100 (X1); 1 as-65000 (RR1, PE1, PE2); 2 as-65003 (RR2, PE3, PE4); 3 as-65107 (X2).
# Aliases: none
portograph: 2
profile: network
title: "Merge Networks Using Different BGP AS Numbers"
groups:
  as-65100: { tier: 0, label: "AS 65100" }
  as-65000: { tier: 1, label: "Org 1: AS 65000" }
  as-65003: { tier: 2, label: "Org 2: AS 65003" }
  as-65107: { tier: 3, label: "AS 65107" }
nodes:
  x1: { group: as-65100, label: X1, class: router, icon: router }
  rr1: { group: as-65000, label: RR1, class: rr, icon: server }
  pe1: { group: as-65000, label: PE1, class: router, icon: router }
  pe2: { group: as-65000, label: PE2, class: router, icon: router }
  rr2: { group: as-65003, label: RR2, class: rr, icon: server }
  pe3: { group: as-65003, label: PE3, class: router, icon: router }
  pe4: { group: as-65003, label: PE4, class: router, icon: router }
  x2: { group: as-65107, label: X2, class: router, icon: router }
links:
  - [x1, pe1, { id: src-link-001 }]
  - [pe1, rr1, { id: src-link-002 }]
  - [pe1, pe2, { id: src-link-003 }]
  - [pe2, rr1, { id: src-link-004 }]
  - [x2, pe4, { id: src-link-005 }]
  - [pe4, rr2, { id: src-link-006 }]
  - [pe4, pe3, { id: src-link-007 }]
  - [rr2, pe3, { id: src-link-008 }]
  - [pe2, pe3, { id: src-link-009 }]
  - [x1, pe1, { id: ses-01, class: flow, label: EBGP }]
  - [pe1, rr1, { id: ses-02, class: flow, label: IBGP }]
  - [rr1, pe2, { id: ses-03, class: flow, label: IBGP }]
  - [pe2, pe3, { id: ses-04, class: flow, label: BGP }]
  - [pe3, rr2, { id: ses-05, class: flow, label: IBGP }]
  - [rr2, pe4, { id: ses-06, class: flow, label: IBGP }]
  - [pe4, x2, { id: ses-07, class: flow, label: EBGP }]
