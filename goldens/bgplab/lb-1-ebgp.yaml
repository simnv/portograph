# Reference: https://github.com/bgplab/bgplab/blob/4bd74dbc7f19f172d51cda9ff681303f7e152a5a/docs/lb/topology-lb-ebgp.png
# Licence: MIT; Copyright (c) 2023–2024 Ivan Pepelnjak
# Author: Ivan Pepelnjak (bgplab/bgplab)
# Fetched: 2026-11-06
# Conversion: authored from static YAML and reference PNG; recipe bgplab-v1
# Kept: 5 real nodes (RTR, P1, P2, P3, C2), 4 AS boxes (AS 65000, AS 65100, AS 65101, AS 65001), 6 physical pairs, 0 LANs, 0 stubs, no link names.
# Added: source link 4 (p1-p2, both in the AS 65100 box) is not drawn in the PNG; it is an active link (addressed, OSPF in the ISP group), so it is kept as an addition.
# Simplified: the drawing's left-to-right ring is rotated into vertical tiers.
# Dropped links: none.
# Dropped annotations: 2 orange prefix callouts ("10.1.3.0/24" at P1, "10.7.5.0/24" at C2).
# Dropped configuration: addressing, originated prefixes, loopback advertisement, OSPF and BGP module settings.
# Sessions: 5 overlay (class flow) from the drawing: rtr-p1 EBGP, rtr-p2 EBGP, p2-c2 EBGP, rtr-p3 EBGP, p3-c2 EBGP
# Tiers/order: rotated left to right into tiers. 0 as-65000 (RTR); 1 as-65100 (P1, P2) and as-65101 (P3), top to bottom; 2 as-65001 (C2).
# Aliases: none
portograph: 2
profile: network
title: "Load Balancing across External BGP Paths"
groups:
  as-65000: { tier: 0, label: "AS 65000" }
  as-65100: { tier: 1, label: "AS 65100" }
  as-65101: { tier: 1, label: "AS 65101" }
  as-65001: { tier: 2, label: "AS 65001" }
nodes:
  rtr: { group: as-65000, label: RTR, class: router, icon: router }
  p1: { group: as-65100, label: P1, class: router, icon: router }
  p2: { group: as-65100, label: P2, class: router, icon: router }
  p3: { group: as-65101, label: P3, class: router, icon: router }
  c2: { group: as-65001, label: C2, class: router, icon: router }
links:
  - [rtr, p1, { id: src-link-001 }]
  - [rtr, p2, { id: src-link-002 }]
  - [rtr, p3, { id: src-link-003 }]
  - [p1, p2, { id: src-link-004 }]
  - [p2, c2, { id: src-link-005 }]
  - [p3, c2, { id: src-link-006 }]
  - [rtr, p1, { id: ses-01, class: flow, label: EBGP }]
  - [rtr, p2, { id: ses-02, class: flow, label: EBGP }]
  - [p2, c2, { id: ses-03, class: flow, label: EBGP }]
  - [rtr, p3, { id: ses-04, class: flow, label: EBGP }]
  - [p3, c2, { id: ses-05, class: flow, label: EBGP }]
