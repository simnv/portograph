# Aliases: none.
portograph: 2
profile: network
title: "Using No-Export Community to Filter Transit Routes"
groups:
  isp-1: { tier: 0, label: "ISP-1: AS 65100" }
  isp-2: { tier: 0, label: "ISP-2: AS 65101" }
  customer: { tier: 1, label: "Customer: AS 65000" }
nodes:
  x1: { group: isp-1, label: X1, class: router, icon: router }
  x2: { group: isp-2, label: X2, class: router, icon: router }
  c1: { group: customer, label: C1, class: router, icon: router }
  c2: { group: customer, label: C2, class: router, icon: router }
links:
  - [c1, x1, { id: src-link-001, label: "Link to AS 65100" }]
  - [c2, x2, { id: src-link-005, label: "Link to AS 65101" }]
  - [c1, c2, { id: src-link-006, label: "Customer internal link" }]
  - [x1, c1, { id: ses-01, class: flow, label: "EBGP" }]
  - [x2, c2, { id: ses-02, class: flow, label: "EBGP" }]
  - [c1, c2, { id: ses-03, class: flow, label: "IBGP" }]
