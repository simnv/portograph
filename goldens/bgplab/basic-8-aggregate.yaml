# Author: Ivan Pepelnjak (bgplab/bgplab)
# Fetched: 2026-11-06
# Conversion: authored from static YAML and reference PNG; recipe bgplab-v1
# Kept: 4 real nodes; 3 displayed AS boxes; 3 physical pairs including 0 stub legs; 0 LANs; all visible router labels
# Sessions: 2 overlay (class flow) from the drawing: ce1-x1 EBGP, x1-ce2 EBGP
# Added: source-only physical ce1-sw, represented in PNG by OSPF annotation only
# Simplified: source left-to-right hierarchy rotated into top-to-bottom tiers; standard icons replace artwork; no port or layout hints
# Dropped links: src-link-003 x1-sw omitted: explicitly unused interface-name filler; src-link-005 and src-link-006 sw loopbacks omitted as configuration
# Dropped annotations: OSPF arrow sw-ce1; 10.42.42.x callout under SW
# Dropped configuration: addressing, route origination/policy, protocol timers/options, validation, plugins, device/deployment data and credentials; no credential values retained
# Tiers/order: as-65000=0, as-65100=1, as-65001=2; group and node declaration follows PNG reading order, source order breaks ties; engine may reorder
# Aliases: none
# Facts: SW is a router in the PNG despite its node ID; its AS 65000 boundary is drawing-derived, with no configured ASN. YAML ce1/ce2 retain IDs and use drawing labels R1/R2.
portograph: 2
profile: network
title: BGP Route Aggregation
groups:
  as-65000:
    tier: 0
    label: AS 65000
  as-65100:
    tier: 1
    label: AS 65100
  as-65001:
    tier: 2
    label: AS 65001
nodes:
  sw:
    group: as-65000
    label: SW
    class: router
    icon: router
  ce1:
    group: as-65000
    label: R1
    class: router
    icon: router
  x1:
    group: as-65100
    label: X1
    class: router
    icon: router
  ce2:
    group: as-65001
    label: R2
    class: router
    icon: router
links:
  - id: src-link-001
    from: ce1
    to: x1
  - id: src-link-002
    from: ce1
    to: sw
  - id: src-link-004
    from: ce2
    to: x1
  - id: ses-01
    from: ce1
    to: x1
    class: flow
    label: EBGP
  - id: ses-02
    from: x1
    to: ce2
    class: flow
    label: EBGP
