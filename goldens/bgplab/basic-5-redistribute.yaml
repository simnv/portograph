# Fetched: 2026-11-06
# Conversion: authored from static YAML and reference PNG; recipe bgplab-v1
# Kept: 6 real nodes; 3 displayed AS boxes; 7 physical pairs including 2 stub legs; 0 LANs; all visible router labels
# Sessions: 2 overlay (class flow) from the drawing: c1-x1 EBGP, x2-c2 EBGP
# Added: source-only physical x1-x2; stub-7 attached to s1 and stub-8 attached to s2, active one-node source links 7 and 8; PNG omits these links
# Simplified: source left-to-right hierarchy rotated into top-to-bottom tiers; standard icons replace artwork; no port or layout hints
# Dropped links: src-link-002 x2 stub omitted: topology comment explicitly calls it a bogus interface-name filler; PNG does not draw it
# Dropped annotations: OSPF arrows s1-c1 and c2-s2; redistribution circular arrows at c1 and c2
# Dropped configuration: addressing, route origination/policy, protocol timers/options, validation, plugins, device/deployment data and credentials; no credential values retained
# Tiers/order: as-65000=0, as-65100=1, as-65001=2, medium-7=0, medium-8=2; group and node declaration follows PNG reading order, source order breaks ties; engine may reorder
# Aliases: none
# Facts: s1 and s2 each have module [ospf] only, so netlab does not apply the external group bgp.as 65100 to them; bgp.* is inert without the bgp module. They are OSPF routers inside the drawn customer AS boxes: s1 with c1 in AS 65000, s2 with c2 in AS 65001.
# Reconciliation: coordinator confirmed the module applicability rule; drawn customer AS membership agrees with the effective source semantics. No unresolved AS conflict.
portograph: 2
profile: network
title: Redistribute IGP Information Into BGP
groups:
  as-65000:
    tier: 0
    label: AS 65000
  as-65100:
    tier: 1
    label: AS 65100
  as-65001:
    tier: 2
    label: AS 65001
  medium-7:
    tier: 0
    label: ""
  medium-8:
    tier: 2
    label: ""
nodes:
  s1:
    group: as-65000
    label: S1
    class: router
    icon: router
  c1:
    group: as-65000
    label: C1
    class: router
    icon: router
  x1:
    group: as-65100
    label: X1
    class: router
    icon: router
  x2:
    group: as-65100
    label: X2
    class: router
    icon: router
  c2:
    group: as-65001
    label: C2
    class: router
    icon: router
  s2:
    group: as-65001
    label: S2
    class: router
    icon: router
  stub-7:
    group: medium-7
    label: Stub 7
    class: cloud
    icon: cloud
  stub-8:
    group: medium-8
    label: Stub 8
    class: cloud
    icon: cloud
links:
  - id: src-link-001
    from: c1
    to: x1
  - id: src-link-003
    from: x1
    to: x2
  - id: src-link-004
    from: c2
    to: x2
  - id: src-link-005
    from: c1
    to: s1
  - id: src-link-006
    from: c2
    to: s2
  - id: src-link-007
    from: s1
    to: stub-7
  - id: src-link-008
    from: s2
    to: stub-8
  - id: ses-01
    from: c1
    to: x1
    class: flow
    label: EBGP
  - id: ses-02
    from: x2
    to: c2
    class: flow
    label: EBGP
