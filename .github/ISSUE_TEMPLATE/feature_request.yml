name: Feature request
description: A new drawing technique, YAML key, output format or option.
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not draw, or what is difficult to draw now?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should portograph do? A sketch or a drawing by hand helps.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: YAML input
      description: A YAML file that the feature applies to, if you have one. Use no private data.
      render: yaml
  - type: textarea
    id: rule
    attributes:
      label: General rule
      description: The rule that the feature follows on every diagram, not only on yours.
