version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Layout-solver bumps are manual: any new version can move every layout, and the goldens must be reviewed.
      # Every version is ignored, patch releases too: a 0.x patch can move layouts as well.
      - dependency-name: elkjs
      - dependency-name: libavoid-js
      # @types/node follows engines.node (>=22): only its 22.x line.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the Go port) is a separate migration.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
