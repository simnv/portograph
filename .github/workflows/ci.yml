name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs the same checks before it publishes.
  workflow_call:
    inputs:
      release:
        description: A release run owns its group per commit and no push cancels it.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name under workflow_call, so a release never shares a group with a push.
  # The checks of a release must not be cancelled by a later push: they have their own group per commit.
  group: ${{ inputs.release && format('release-checks-{0}', github.sha) || format('{0}-ci-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !inputs.release }}

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Through scripts/test-runner.mjs, as everywhere: on Linux it takes the lock with util-linux flock.
      # The runner VM runs nothing else: two vitest workers (the local default is one). About 13 min on one worker locally.
      - name: Test
        env:
          PORTOGRAPH_TEST_WORKERS: "2"
          # The host health check guards a shared workstation; a CI VM runs only this job, so the load limit is lifted.
          PORTOGRAPH_MAX_LOAD: "100"
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke render
        run: |
          mkdir -p smoke
          status=0
          node bin/portograph.mjs render goldens/m1-sip-edge.yaml --output smoke/m1-sip-edge.svg 2> smoke/stderr.txt || status=$?
          cat smoke/stderr.txt
          if [ "$status" -ne 0 ]; then echo "::error::render exited with $status"; exit 1; fi
          if grep -q 'Verdana is not installed' smoke/stderr.txt; then echo "::error::the CLI did not find Verdana"; exit 1; fi
          test -s smoke/m1-sip-edge.svg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-render-node${{ matrix.node }}
          path: smoke/
          if-no-files-found: error
