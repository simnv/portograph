name: release

# A tag v<version> publishes that version to npm through trusted publishing (OIDC, no token) and
# creates a GitHub release. The trusted publisher on npmjs.com names this repository and release.yml.
# npm makes provenance only for a public repository: push the tag after the repository is public.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the tag with the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache in the job that publishes.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      # A version that is already on npm (for example 0.1.0, published by hand) is not published again;
      # the GitHub release is still made. npm view exits 1 with E404 when the version does not exist.
      - name: Check whether this version is on npm
        id: registry
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "portograph@$version" version >/dev/null 2>&1; then
            echo "::notice::portograph@$version is already on npm; publish is skipped"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.registry.outputs.published == 'false'
        run: npm ci

      # npm publish runs prepack, which builds dist/ first.
      - name: Publish
        if: steps.registry.outputs.published == 'false'
        run: npm publish --provenance --access public

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
